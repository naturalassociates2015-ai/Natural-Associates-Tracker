<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Associates - Live Site Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .admin-only { display: none; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4 bg-slate-900">
        <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900">Natural Associates</h1>
                <p class="text-sm text-slate-500">Site Expense & Cash Flow Tracker</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Select User / Role</label>
                    <select id="loginUser" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                        <option value="">-- Choose Profile --</option>
                        <option value="Admin">Admin (Full Access)</option>
                        <option value="Sivashankar">Sivashankar (Engineer)</option>
                        <option value="Yogesh">Yogesh (Engineer)</option>
                        <option value="Senthil">Senthil (Engineer)</option>
                        <option value="Manikandan">Manikandan (Engineer / Lead)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPass" placeholder="Enter password" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" required>
                    <p id="loginError" class="text-xs text-red-500 mt-1 hidden">Invalid password!</p>
                </div>
                <button type="submit" class="w-full py-3 bg-slate-900 text-white rounded-xl font-medium hover:bg-slate-800 transition">Login</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <i data-lucide="building-2" class="w-6 h-6 text-emerald-400"></i>
                    <div>
                        <h1 class="text-xl font-bold">Natural Associates</h1>
                        <p id="userRoleDisplay" class="text-xs text-slate-400"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="handleLogout()" class="flex items-center space-x-1 text-sm bg-slate-800 px-3 py-1.5 rounded-lg hover:bg-slate-700 transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <nav class="bg-white border-b shadow-sm">
            <div class="max-w-7xl mx-auto px-4 flex space-x-6 overflow-x-auto">
                <button onclick="switchTab('dashboard')" id="tab-dashboard" class="py-4 px-3 border-b-2 border-emerald-600 text-emerald-600 font-medium flex items-center space-x-2">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Overview</span>
                </button>
                <button onclick="switchTab('expenses')" id="tab-expenses" class="py-4 px-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium flex items-center space-x-2">
                    <i data-lucide="receipt" class="w-4 h-4"></i>
                    <span>Expenses</span>
                </button>
                <!-- Admin Setup Tab (Hidden by default, shown only for Admin) -->
                <button onclick="switchTab('settings')" id="tab-settings" class="admin-only py-4 px-3 border-b-2 border-transparent text-slate-500 hover:text-slate-700 font-medium flex items-center space-x-2">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Admin Setup</span>
                </button>
            </div>
        </nav>

        <!-- Content Area -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
            
            <!-- DASHBOARD TAB -->
            <div id="view-dashboard" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded-2xl shadow border">
                        <p class="text-sm text-slate-500">Total Funds Allocated</p>
                        <h3 id="totalFundsDisplay" class="text-2xl font-bold text-slate-900">₹0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow border">
                        <p class="text-sm text-slate-500">Total Expenses Spent</p>
                        <h3 id="totalExpensesDisplay" class="text-2xl font-bold text-slate-900">₹0</h3>
                    </div>
                </div>
            </div>

            <!-- EXPENSES TAB -->
            <div id="view-expenses" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow border">
                    <h2 class="text-lg font-bold mb-4">Record New Expense</h2>
                    <form onsubmit="addExpense(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                            <input type="date" id="expDate" class="w-full p-2.5 border rounded-xl" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Engineer</label>
                            <select id="expEngineer" class="w-full p-2.5 border rounded-xl" required></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Site</label>
                            <select id="expSite" class="w-full p-2.5 border rounded-xl" required></select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Amount (₹)</label>
                            <input type="number" id="expAmount" placeholder="Enter amount" class="w-full p-2.5 border rounded-xl" required>
                        </div>
                        <div class="md:col-span-4">
                            <button type="submit" class="bg-emerald-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-emerald-700 transition">Save Expense</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ADMIN SETUP TAB (Strictly Admin Only) -->
            <div id="view-settings" class="admin-only space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow border">
                    <h2 class="text-lg font-bold mb-4 text-emerald-600">Admin Setup & Engineer Fund Management</h2>
                    <p class="text-sm text-slate-500 mb-4">Manage engineer fund allocations and site configurations here.</p>
                </div>
            </div>

        </main>
    </div>

    <script>
        // SheetDB / Sheet TV Endpoints
        const SHEETDB_EXPENSES = "https://sheetdb.io/api/v1/5jtno86nn45ml";
        const SHEETDB_ENGINEERS = "https://sheetdb.io/api/v1/e92x2wxuf37nv";

        let currentUser = localStorage.getItem('na_current_user') || null;
        const passwords = { "Admin": "admin123", "Sivashankar": "pass123", "Yogesh": "pass123", "Senthil": "pass123", "Manikandan": "pass123" };
        
        const engineers = [
            { name: "Sivashankar", totalGiven: 100000 },
            { name: "Yogesh", totalGiven: 75000 },
            { name: "Senthil", totalGiven: 0 },
            { name: "Manikandan", totalGiven: 0 }
        ];

        const sites = ["Madhuravoyal", "Sithalapakam", "Oragadam", "Sunguvachathiram"];

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (passwords[user] && passwords[user] === pass) {
                currentUser = user;
                localStorage.setItem('na_current_user', user);
                initApp();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handleLogout() {
            localStorage.removeItem('na_current_user');
            currentUser = null;
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginForm').reset();
        }

        function initApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userRoleDisplay').innerText = `Logged in as: ${currentUser}`;

            // Strict Role-based visibility for Admin-only elements
            const adminElements = document.querySelectorAll('.admin-only');
            adminElements.forEach(el => {
                if (currentUser === 'Admin') {
                    el.style.display = ''; // அட்மினுக்கு மட்டும் தெரியும்
                } else {
                    el.style.display = 'none'; // இன்ஜினியர்களுக்கு மறைக்கப்படும்
                }
            });

            // Populate selects
            const expEngineer = document.getElementById('expEngineer');
            expEngineer.innerHTML = '';
            engineers.forEach(eng => { expEngineer.innerHTML += `<option value="${eng.name}">${eng.name}</option>`; });

            const expSite = document.getElementById('expSite');
            expSite.innerHTML = '';
            sites.forEach(site => { expSite.innerHTML += `<option value="${site}">${site}</option>`; });

            document.getElementById('expDate').valueAsDate = new Date();
            renderDashboard();
        }

        function switchTab(tabName) {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-expenses').classList.add('hidden');
            document.getElementById('view-settings').classList.add('hidden');

            document.getElementById('tab-dashboard').classList.remove('border-emerald-600', 'text-emerald-600');
            document.getElementById('tab-expenses').classList.remove('border-emerald-600', 'text-emerald-600');
            document.getElementById('tab-settings').classList.remove('border-emerald-600', 'text-emerald-600');

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('border-emerald-600', 'text-emerald-600');
        }

        function renderDashboard() {
            let totalFunds = engineers.reduce((sum, eng) => sum + eng.totalGiven, 0);
            document.getElementById('totalFundsDisplay').innerText = `₹${totalFunds.toLocaleString()}`;
        }

        function addExpense(e) {
            e.preventDefault();
            alert("Expense saved successfully!");
        }

        // Auto login if already authenticated
        if (currentUser) {
            initApp();
        }

        lucide.createIcons();
    </script>
</body>
</html>

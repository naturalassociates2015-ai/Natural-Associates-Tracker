<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Natural Associates expense tracker</title>
  <style>
    :root {
      --primary: #1b4332;
      --secondary: #2d6a4f;
      --accent: #52b788;
      --earth: #5c4033;
      --bg: #f4f7f5;
      --card: #ffffff;
      --text: #1f2937;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    
    /* Login Screen */
    #loginSection {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
      background: linear-gradient(135deg, var(--primary), var(--earth));
    }
    .login-box {
      background: var(--card); padding: 30px; border-radius: 16px;
      width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-box h2 { margin: 0 0 8px; color: var(--primary); font-size: 22px; }
    .login-box p { margin: 0 0 20px; color: #6b7280; font-size: 13px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .form-group select, .form-group input {
      width: 100%; padding: 12px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 15px;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--primary); color: white; font-size: 16px;
      font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: var(--secondary); }
    .btn-sm { width: auto; padding: 8px 14px; font-size: 13px; }
    .btn-danger { background: var(--danger); }

    /* Header & App */
    #appSection { display: none; padding-bottom: 40px; }
    header {
      background: var(--primary); color: white; padding: 15px 20px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    header h1 { margin: 0; font-size: 18px; }
    .user-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; }

    .container { max-width: 900px; margin: 15px auto; padding: 0 15px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; }
    .tab-btn {
      padding: 10px 16px; border: none; border-radius: 8px;
      background: #e5e7eb; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { background: var(--secondary); color: white; }

    .card {
      background: var(--card); padding: 18px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px;
    }
    .summary-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px; margin-bottom: 15px;
    }
    .stat-card {
      background: white; padding: 15px; border-radius: 10px;
      border-left: 4px solid var(--secondary); box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .stat-card span { font-size: 12px; color: #6b7280; display: block; }
    .stat-card strong { font-size: 20px; color: var(--primary); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-weight: 600; }
    .table-wrap { overflow-x: auto; }

    .loader {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8); z-index: 999;
      align-items: center; justify-content: center; font-weight: bold; color: var(--primary);
    }
  </style>
</head>
<body>

<div id="loader" class="loader">Syncing with Server...</div>

<!-- LOGIN SECTION -->
<div id="loginSection">
  <div class="login-box">
    <h2>Natural Associates</h2>
    <p>Expense & Site Fund Tracker</p>
    <div class="form-group">
      <label>Select User</label>
      <select id="loginUser">
        <option value="MANIGANDAN">MANIGANDAN (Admin)</option>
        <option value="Sivashankar">Sivashankar (Site Engineer)</option>
        <option value="Yogesh">Yogesh (Coordinator)</option>
        <option value="Senthil">Senthil</option>
      </select>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" autocomplete="off" />
    </div>
    <button type="button" class="btn" onclick="handleLogin()">Login</button>
    <p id="loginErr" style="color:red; margin-top:10px; display:none;">தவறான பாஸ்வேர்ட்!</p>
  </div>
</div>

<!-- MAIN APP SECTION -->
<div id="appSection">
  <header>
    <div>
      <h1>Natural Associates</h1>
      <span class="user-badge" id="currentUserLabel"></span>
    </div>
    <div style="display:flex; gap:8px;">
      <button type="button" class="btn btn-sm" style="background:#52b788;" onclick="syncData()">Sync</button>
      <button type="button" class="btn btn-sm btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button type="button" class="tab-btn active" onclick="switchTab('summaryTab', this)">Summary</button>
      <button type="button" class="tab-btn" onclick="switchTab('expenseTab', this)">Add Expense</button>
      <button type="button" class="tab-btn" id="adminTabBtn" onclick="switchTab('adminTab', this)">Admin Fund Setup</button>
    </div>

    <!-- SUMMARY TAB -->
    <div id="summaryTab" class="tab-content">
      <div class="summary-grid">
        <div class="stat-card"><span>Fund Received</span><strong id="statReceived">₹0</strong></div>
        <div class="stat-card"><span>Expenses Spent</span><strong id="statSpent">₹0</strong></div>
        <div class="stat-card" style="border-color:#5c4033;"><span>Balance Available</span><strong id="statBalance">₹0</strong></div>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Recent Expenses</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Site</th><th>Material</th><th>Amount</th><th>Engineer</th></tr>
            </thead>
            <tbody id="expenseTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ADD EXPENSE TAB -->
    <div id="expenseTab" class="tab-content" style="display:none;">
      <div class="card">
        <h3 style="margin-top:0;">Add New Site Expense</h3>
        <div class="form-group"><label>Date</label><input type="date" id="expDate" /></div>
        <div class="form-group">
          <label>Site</label>
          <select id="expSite">
            <option value="Madhuravoyal">Madhuravoyal</option>
            <option value="Sithalapakam">Sithalapakam</option>
            <option value="Oragadam">Oragadam</option>
            <option value="Madha school">Madha school</option>
          </select>
        </div>
        <div class="form-group"><label>Material / Work</label><input type="text" id="expMaterial" placeholder="e.g. Cement, M Sand, Labour" /></div>
        <div class="form-group"><label>Qty & Unit</label><input type="text" id="expQty" placeholder="e.g. 10 Bags" /></div>
        <div class="form-group"><label>Amount (₹)</label><input type="number" id="expAmount" placeholder="0" /></div>
        <div class="form-group"><label>Remarks</label><input type="text" id="expRemarks" placeholder="Optional notes" /></div>
        <button type="button" class="btn" onclick="submitExpense()">Save Expense</button>
      </div>
    </div>

    <!-- ADMIN FUND TAB -->
    <div id="adminTab" class="tab-content" style="display:none;">
      <div class="card">
        <h3 style="margin-top:0;">Allocate Engineer Fund</h3>
        <div class="form-group"><label>Date</label><input type="date" id="fundDate" /></div>
        <div class="form-group">
          <label>Engineer</label>
          <select id="fundEngineer">
            <option value="MANIGANDAN">MANIGANDAN</option>
            <option value="Sivashankar">Sivashankar</option>
            <option value="Yogesh">Yogesh</option>
            <option value="Senthil">Senthil</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Mode</label>
          <select id="fundMode">
            <option value="GPay">GPay</option>
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
          </select>
        </div>
        <div class="form-group"><label>Amount (₹)</label><input type="number" id="fundAmount" placeholder="0" /></div>
        <button type="button" class="btn" onclick="submitFund()">Save Fund</button>
      </div>
    </div>
  </div>
</div>

<script>
  // உங்கள் புதிய Google Apps Script Web App URL-ஐ கீழே மாற்றவும்
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOGACtm9gwgTJHl1W00t43O3m-1OQcr2DSF3oJKVCBfKxvZOeupyWuSOxkEqrDsj8GaQ/exec";

  // பாஸ்வேர்ட் விவரங்கள் (தேவைப்பட்டால் மாற்றிக்கொள்ளலாம்)
  const PASSWORDS = {
    "MANIGANDAN": "admin123",
    "Sivashankar": "1234",
    "Yogesh": "1234",
    "Senthil": "1234"
  };

  let appData = { engineers: [], expenses: [] };

  // பக்கம் திறக்கும்போதே ஏற்கனவே லாகின் ஆகியிருக்கிறதா எனச் சரிபார்க்கும்
  window.addEventListener("DOMContentLoaded", () => {
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("expDate").value = today;
    document.getElementById("fundDate").value = today;

    const savedUser = localStorage.getItem("na_logged_user");
    if (savedUser) {
      showApp(savedUser);
    }
  });

  function handleLogin() {
    const user = document.getElementById("loginUser").value;
    const pass = document.getElementById("loginPass").value.trim();
    const errEl = document.getElementById("loginErr");

    if (PASSWORDS[user] && PASSWORDS[user] === pass) {
      errEl.style.display = "none";
      localStorage.setItem("na_logged_user", user);
      showApp(user);
    } else {
      errEl.style.display = "block";
    }
  }

  function showApp(user) {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("appSection").style.display = "block";
    document.getElementById("currentUserLabel").innerText = user;

    // Admin-க்கு மட்டும் Fund Setup டேப் தெரியும்
    document.getElementById("adminTabBtn").style.display = (user === "MANIGANDAN") ? "inline-block" : "none";
    syncData();
  }

  function logout() {
    localStorage.removeItem("na_logged_user");
    document.getElementById("appSection").style.display = "none";
    document.getElementById("loginSection").style.display = "flex";
    document.getElementById("loginPass").value = "";
  }

  function switchTab(tabId, btn) {
    document.querySelectorAll(".tab-content").forEach(el => el.style.display = "none");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    document.getElementById(tabId).style.display = "block";
    btn.classList.add("active");
  }

  async function syncData() {
    const loader = document.getElementById("loader");
    loader.style.display = "flex";
    try {
      const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
      const json = await res.json();
      if (json.status === "ok") {
        appData = json;
        renderDashboard();
      }
    } catch (e) {
      alert("Server Sync Error: " + e.message);
    } finally {
      loader.style.display = "none";
    }
  }

  function renderDashboard() {
    const user = localStorage.getItem("na_logged_user");
    let totalReceived = 0;
    let totalSpent = 0;

    appData.engineers.forEach(row => {
      const eng = String(row.Engineer || row.name || "").trim();
      if (user === "MANIGANDAN" || eng === user) {
        totalReceived += Number(row.Amount || 0);
      }
    });

    const tbody = document.getElementById("expenseTableBody");
    tbody.innerHTML = "";

    appData.expenses.slice().reverse().forEach(exp => {
      const eng = String(exp.Engineer || "").trim();
      if (user === "MANIGANDAN" || eng === user) {
        totalSpent += Number(exp.Amount || 0);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${String(exp.Date || "").split("T")[0]}</td>
          <td>${exp.Site || ""}</td>
          <td>${exp.Material || ""}</td>
          <td>₹${exp.Amount || 0}</td>
          <td>${eng}</td>
        `;
        tbody.appendChild(tr);
      }
    });

    document.getElementById("statReceived").innerText = "₹" + totalReceived.toLocaleString("en-IN");
    document.getElementById("statSpent").innerText = "₹" + totalSpent.toLocaleString("en-IN");
    document.getElementById("statBalance").innerText = "₹" + (totalReceived - totalSpent).toLocaleString("en-IN");
  }

  async function submitExpense() {
    const user = localStorage.getItem("na_logged_user");
    const payload = {
      action: "create",
      target: document.getElementById("expSite").value,
      data: {
        RecordId: "EXP_" + Date.now(),
        Date: document.getElementById("expDate").value,
        Engineer: user,
        Site: document.getElementById("expSite").value,
        Material: document.getElementById("expMaterial").value,
        Qty: document.getElementById("expQty").value,
        Amount: Number(document.getElementById("expAmount").value || 0),
        Remarks: document.getElementById("expRemarks").value,
        Status: "Approved"
      }
    };
    await postToServer(payload);
    document.getElementById("expMaterial").value = "";
    document.getElementById("expAmount").value = "";
  }

  async function submitFund() {
    const payload = {
      action: "addFundHistory",
      data: {
        RecordId: "FND_" + Date.now(),
        EntryType: "FUND_HISTORY",
        Date: document.getElementById("fundDate").value,
        Engineer: document.getElementById("fundEngineer").value,
        name: document.getElementById("fundEngineer").value,
        Mode: document.getElementById("fundMode").value,
        Amount: Number(document.getElementById("fundAmount").value || 0)
      }
    };
    await postToServer(payload);
    document.getElementById("fundAmount").value = "";
  }

  async function postToServer(payload) {
    const loader = document.getElementById("loader");
    loader.style.display = "flex";
    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      await syncData();
      alert("Saved Successfully!");
    } catch (e) {
      alert("Error saving: " + e.message);
    } finally {
      loader.style.display = "none";
    }
  }
</script>
</body>
</html>

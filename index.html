<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natural Associates - Site Expense Tracker</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #18221d;
      --muted: #5c6b63;
      --header-bg: #1e293b;
      --header-ink: #ffffff;
      --accent: #1b5e3a;
      --accent-soft: #eef5f1;
      --accent-border: #d3e3da;
      --terracotta: #c84b31;
      --terracotta-dark: #a83a22;
      --terracotta-soft: #fdf2ef;
      --amber-soft: #fbf6e9;
      --border: #dfe5e2;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      padding-bottom: 96px;
      line-height: 1.45;
      min-height: 100vh;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .login-emblem {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      border: 1px solid var(--accent-border);
      overflow: hidden;
    }

    .login-emblem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .login-brand {
      font-size: 21px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.2px;
      margin-bottom: 20px;
    }

    .login-field {
      margin-bottom: 14px;
      text-align: left;
    }

    .login-user-select {
      text-align: center;
      text-align-last: center;
      font-size: 18px;
      font-weight: 800;
      padding: 12px 14px;
      color: var(--ink);
      background: #f8faf9;
      border: 1.5px solid var(--border);
      border-radius: 11px;
    }

    .pin-input {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 6px;
      padding: 11px 38px 11px 14px;
    }

    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 12px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background: var(--header-bg);
      color: #ffffff;
      border-radius: 10px;
      margin-top: 4px;
    }

    .login-error {
      color: var(--terracotta);
      background: var(--terracotta-soft);
      border: 1px solid #f2c4ba;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: none;
      text-align: left;
    }

    .app-shell {
      display: none;
    }

    .topbar {
      background: var(--header-bg);
      color: var(--header-ink);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-leaf {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-leaf img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.1px;
    }

    .brand-sub {
      font-size: 11.5px;
      color: #cbd5e1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    select, input, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      color: var(--ink);
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--header-bg);
    }

    input[readonly] {
      background: #f1f5f3;
      color: #3a4f42;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      transition: transform 0.06s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--header-bg);
      color: #fff;
    }

    .btn-danger {
      background: var(--terracotta);
      color: #fff;
    }

    .btn-secondary {
      background: #eef2f6;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .container {
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 0 12px;
    }

    .status-banner {
      display: none;
      padding: 8px 12px;
      border-radius: 9px;
      margin-bottom: 11px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .status-banner.info {
      display: block;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .status-banner.warn {
      display: block;
      background: var(--terracotta-soft);
      color: var(--terracotta);
      border: 1px solid #f2c4ba;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 13px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .eng-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .period-group {
      display: inline-flex;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      gap: 2px;
      box-shadow: var(--shadow);
    }

    .period-btn {
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 7px;
    }

    .period-btn.active {
      background: var(--header-bg);
      color: #ffffff;
    }

    /* Step-by-step Left-Right paired rows */
    .step-pairs {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .pair-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .desc-box {
      min-height: 54px;
      resize: vertical;
      font-size: 14px;
      background: #fafbfc;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pb-meta {
      font-size: 12.5px;
      color: var(--muted);
    }

    .pb-actions {
      display: flex;
      gap: 5px;
    }

    .summary-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-grid-5 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 9px;
      margin-bottom: 13px;
    }

    .admin-blocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-bottom: 13px;
    }

    .stat-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box.clickable {
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.08s ease;
    }

    .stat-box.clickable:hover {
      border-color: var(--header-bg);
    }

    .stat-box.clickable:active {
      transform: scale(0.98);
    }

    .stat-box.selected-box {
      border: 2px solid var(--header-bg);
      box-shadow: 0 4px 14px rgba(30, 41, 59, 0.14);
    }

    .stat-box.highlight-soft {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .stat-label {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-val {
      font-size: 16.5px;
      font-weight: 800;
      margin-top: 4px;
    }

    .stat-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge-completed {
      background: #e5e7eb;
      color: #374151;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    td.wrap-cell {
      white-space: normal;
      min-width: 160px;
    }

    th {
      color: var(--ink);
      font-size: 12px;
      background: #f1f5f9;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .confirm-box {
      background: var(--amber-soft);
      border: 1px solid #e7cf96;
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }

    /* Bottom bar + bottom "+" button right above the nav bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      pointer-events: none;
    }

    .bottom-plus-bar {
      max-width: 1100px;
      margin: 0 auto 8px;
      padding: 0 16px;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }

    .bottom-plus-btn {
      pointer-events: auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--terracotta);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 14px rgba(200, 75, 49, 0.45);
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .bottom-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      background: #ffffff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -3px 12px rgba(15, 23, 42, 0.08);
      pointer-events: auto;
    }

    .nav-btn {
      flex: 1;
      border-radius: 0;
      background: #ffffff;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 800;
      padding: 13px 8px;
      border-right: 1px solid var(--border);
    }

    .nav-btn:last-child {
      border-right: none;
    }

    .nav-btn.nav-summary {
      color: var(--accent);
      background: #f2f8f5;
    }

    .nav-btn.nav-summary.active {
      background: var(--accent);
      color: #ffffff;
    }

    .nav-btn.nav-expense {
      color: var(--terracotta-dark);
      background: var(--terracotta-soft);
    }

    .nav-btn.nav-expense.active {
      background: var(--terracotta);
      color: #ffffff;
    }

    .c-green { color: var(--accent); }
    .c-red { color: var(--terracotta); }
    .c-ink { color: var(--ink); }

    @media print {
      .topbar, .bottom-nav, .no-print {
        display: none !important;
      }
      body {
        background: #fff;
        padding-bottom: 0;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-emblem">
        <img
          src="icon-192.png"
          alt="Logo"
          onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
        />
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div class="login-brand">Natural Associates</div>
      <form onsubmit="handleLogin(event)" autocomplete="off">
        <div class="login-field">
          <select id="loginUserSelect" class="login-user-select" aria-label="User">
            <option value="Admin" selected>Admin</option>
            <option value="Manigandan">Manigandan</option>
            <option value="Senthil">Senthil</option>
            <option value="Sivashankar">Sivashankar</option>
            <option value="Yogesh">Yogesh</option>
          </select>
        </div>
        <div class="login-field">
          <div class="pw-wrap">
            <input
              type="password"
              id="loginPasswordInput"
              class="pin-input"
              maxlength="4"
              inputmode="numeric"
              autocomplete="new-password"
              placeholder="••••"
              aria-label="Password"
              required
            />
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility()">Show</button>
          </div>
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="btn-login">Login</button>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <div class="brand-leaf">
            <img
              src="icon-192.png"
              alt="Logo"
              onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">Natural Associates</div>
            <div class="brand-sub" id="loggedInBadge">Logged in</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn-ghost btn-sm" onclick="loadAllData(true)">Sync</button>
          <button class="btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="statusBanner" class="status-banner"></div>
      <section id="viewContainer"></section>
    </main>

    <nav class="bottom-nav no-print">
      <div id="bottomPlusBar" class="bottom-plus-bar"></div>
      <div class="bottom-nav-inner" id="bottomNavInner"></div>
    </nav>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOGACtm9gwgTJHl1W00t43O3m-1OQcr2DSF3oJKVCBfKxvZOeupyWuSOxkEqrDsj8GaQ/exec";
    const CACHE_KEY = "NA_TRACKER_CACHE_V7";

    const ENGINEERS = ["Manigandan", "Senthil", "Sivashankar", "Yogesh"];
    const CATEGORIES = [
      "Material",
      "Masonry",
      "Centring",
      "Electrician",
      "Plumber",
      "Painter",
      "Tiles Layer",
      "Carpenter",
      "Fabricator",
      "Polish",
      "Granite layer"
    ];
    const DEFAULT_SITES = [
      "Madhuravoyal-Kannan Sir",
      "Sithalapakam-Nakkiran Sir",
      "Oragadam-Thyagarajan",
      "Valasaravakkam-Maran Sir",
      "SVS-Plot6A&10",
      "SVS-Plot11",
       "SVS-Plot30",
      "SVS-Plot23"
      
    ];
    const REMOVED_UNITS = new Set(["load", "day", "d", "nmr", "w-payment", "w payment"]);
    const DEFAULT_UNITS = [
      "Nos", "Kg", "Tons", "Cft", "Ltr", "Unit", "Bundle", "Advance", "Transport"
    ];

    const FALLBACK_USERS = [
      { user: "Admin", role: "ADMIN", password: "2021" },
       { user: "Senthil", role: "ENGINEER", password: "1981" },
      { user: "Manigandan", role: "Manigandan", password: "2962" },
      { user: "Yogesh", role: "ENGINEER", password: "7699" },
      { user: "Sivashankar", role: "ENGINEER", password: "8889" }
      
    ];

    const state = {
      currentUser: null,
      activeTab: "summary",
      engPeriod: "All",
      adminDetailPanel: null,
      adminFilterOpen: false,
      adminAddFormOpen: false,
      cpSiteFilter: "",
      seSiteFilter: "",
      efEngFilter: "",
      showExpenseForm: false,
      isSavingExpense: false,
      editingExpenseId: null,
      editingClientPaymentId: null,
      editingFundId: null,
      editingSelfExpenseId: null,
      editingSiteName: null,
      settledUntilByEng: {},
      settlePreview: null,
      pendingOps: [],
      users: [...FALLBACK_USERS],
      expenses: [],
      funds: [],
      clientPayments: [],
      selfExpenses: [],
      sites: DEFAULT_SITES.map(s => ({ "Site Name": s, Location: "", Status: "Active" })),
      units: [...DEFAULT_UNITS],
      filters: {
        engineer: "",
        site: "",
        category: "",
        vendor: "",
        description: "",
        fromDate: "",
        toDate: ""
      }
    };

    function sanitizeUnitsList(rawUnits) {
      const cleaned = [];
      const seen = new Set();
      const addUnit = (u) => {
        const val = String(u || "").trim();
        if (!val) return;
        const lower = val.toLowerCase();
        if (REMOVED_UNITS.has(lower)) return;
        if (!seen.has(lower)) {
          seen.add(lower);
          cleaned.push(val);
        }
      };
      if (Array.isArray(rawUnits)) {
        rawUnits.forEach(addUnit);
      }
      DEFAULT_UNITS.forEach(addUnit);
      return cleaned;
    }

    function persistCache() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          expenses: state.expenses,
          funds: state.funds,
          clientPayments: state.clientPayments,
          selfExpenses: state.selfExpenses,
          sites: state.sites,
          units: sanitizeUnitsList(state.units),
          settledUntilByEng: state.settledUntilByEng,
          pendingOps: state.pendingOps
        }));
      } catch (_) {}
    }

    function restoreCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (Array.isArray(p.expenses)) state.expenses = normalizeExpenses(p.expenses);
        if (Array.isArray(p.funds)) state.funds = normalizeFunds(p.funds);
        if (Array.isArray(p.clientPayments)) state.clientPayments = normalizeClientPayments(p.clientPayments);
        if (Array.isArray(p.selfExpenses)) state.selfExpenses = normalizeSelfExpenses(p.selfExpenses);
        if (Array.isArray(p.sites) && p.sites.length) state.sites = p.sites;
        state.units = sanitizeUnitsList(p.units);
        if (p.settledUntilByEng && typeof p.settledUntilByEng === "object") {
          state.settledUntilByEng = p.settledUntilByEng;
        }
        if (Array.isArray(p.pendingOps)) state.pendingOps = p.pendingOps;
      } catch (_) {}
    }

    function toLocalDateStr(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const y = val.getFullYear();
        const m = String(val.getMonth() + 1).padStart(2, "0");
        const day = String(val.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      const str = String(val).trim();
      const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;

      // Handle DD/MM/YYYY or D/M/YYYY (common in India)
      const slashMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (slashMatch) {
        const p1 = Number(slashMatch[1]);
        const p2 = Number(slashMatch[2]);
        const yr = slashMatch[3];
        let day = p1;
        let month = p2;
        if (p2 > 12 && p1 <= 12) {
          month = p1;
          day = p2;
        }
        return `${yr}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      return str.slice(0, 10);
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getStartOfWeekISO() {
      const d = new Date();
      const dayOfWeek = d.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      d.setDate(d.getDate() + diffToMonday);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getStartOfMonthISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}-01`;
    }

    function formatINR(num) {
      const n = Number(num) || 0;
      return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    function isSettledFlag(val) {
      return val === true || String(val).trim().toUpperCase() === "TRUE";
    }

    function isAdmin() {
      return state.currentUser && state.currentUser.role === "ADMIN";
    }

    function isManigandan() {
      return state.currentUser && state.currentUser.user === "Manigandan";
    }

      if (inp.type === "password") {

    function handleLogin(ev) {
      ev.preventDefault();
      const selectedUser = document.getElementById("loginUserSelect").value;
      const enteredPw = document.getElementById("loginPasswordInput").value;
      const errEl = document.getElementById("loginError");

      const matched = state.users.find(
        u => String(u.user).toLowerCase() === String(selectedUser).toLowerCase()
      );

      if (!matched || String(matched.password) !== String(enteredPw)) {
        errEl.textContent = "Invalid user or PIN.";

      errEl.style.display = "none";
      state.currentUser = {
        user: matched.user,
        role: selectedUser === "Admin" ? "ADMIN" : (selectedUser === "Manigandan" ? "Manigandan" : (matched.role || "ENGINEER"))
      };

      state.activeTab = "summary";
      state.adminDetailPanel = null;
      state.showExpenseForm = false;
      state.editingExpenseId = null;
      state.adminAddFormOpen = false;
      showAppShell();
      loadAllData(false);

    function getActiveSiteNames() {
      const activeSites = state.sites
        .filter(s => {
          const st = String(s.Status || "Active").trim().toLowerCase();
          return st !== "completed" && st !== "closed";
        })
        .map(s => String(s["Site Name"] || "").trim())
        .filter(Boolean);
      return activeSites.length ? activeSites : [...DEFAULT_SITES];
    }

    function getAllSiteNames() {
      const all = state.sites
        .map(s => String(s["Site Name"] || "").trim())
        .filter(Boolean);
      return all.length ? all : [...DEFAULT_SITES];
    }

    function normalizeExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => {
          const qty = Number(r.Qty ?? r.qty ?? 1) || 1;
          const rate = Number(r.Rate ?? r.rate ?? 0) || 0;
          const amt = Number(r.Amount ?? r.amount ?? (qty * rate)) || 0;
          const desc = String(r.Description || r.description || "").trim();
          const recId = String(r.RecordId || r.id || "").trim();
          const rawUnit = String(r.Unit || r.unit || "Nos").trim();
          const unit = REMOVED_UNITS.has(rawUnit.toLowerCase()) ? "Unit" : rawUnit;
          return {
            RecordId: recId || `EXP_${i + 1}`,
            Date: toLocalDateStr(r.Date || r.date || todayISO()),
            Engineer: String(r.Engineer || r.engineer || "Manigandan").trim(),
            Site: String(r.Site || r.site || "").trim(),
            Category: String(r.Category || r.category || "Material").trim(),
            "Vendor/Contractor": String(r["Vendor/Contractor"] || r.vendor || "").trim(),
            Description: desc,
            Qty: qty,
            Unit: unit,
            Rate: rate,
            Amount: amt,
            Settled: isSettledFlag(r.Settled ?? r.settled)
          };
        })
        .filter(x => x.Amount > 0 && (x.Description.length > 0 || x.Site.length > 0));
    }

    function normalizeFunds(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => ({
          RecordId: String(r.RecordId || r.id || `FND_${i + 1}`).trim(),
          Date: toLocalDateStr(r.Date || r.date || todayISO()),
          Engineer: String(r.Engineer || r.engineer || "").trim(),
          Amount: Number(r.Amount ?? r.amount ?? 0) || 0,
          Mode: String(r.Mode || r.mode || "Online").trim(),
          Settled: isSettledFlag(r.Settled ?? r.settled)
        }))
        .filter(x => x.Engineer.length > 0 && x.Amount !== 0);
    }

    function normalizeClientPayments(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => ({
          RecordId: String(r.RecordId || r.id || `CP_${i + 1}`).trim(),
          Date: toLocalDateStr(r.Date || r.date || todayISO()),
          Site: String(r.Site || r.site || "").trim(),
          "Base Amount": Number(r["Base Amount"] ?? r.baseAmount ?? 0) || 0,
          "Gst%": Number(r["Gst%"] ?? r.gstPct ?? 0) || 0,
          TotalAmount: Number(r.TotalAmount ?? r["Total Amount"] ?? r.amount ?? 0) || 0,
          PaymentMode: String(r.PaymentMode || r.paymentMode || "").trim(),
          ReferenceNo: String(r.ReferenceNo || r.referenceNo || "").trim(),
          Remarks: String(r.Remarks || r.remarks || "").trim()
        }))
        .filter(x => x.Site.length > 0 && x.TotalAmount > 0);
    }

    function normalizeSelfExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => ({
          RecordId: String(r.RecordId || r.id || `SE_${i + 1}`).trim(),
          Date: toLocalDateStr(r.Date || r.date || todayISO()),
          For: String(r.For || r.for || "").trim(),
          Description: String(r.Description || r.description || "").trim(),
          Amount: Number(r.Amount ?? r.amount ?? 0) || 0
        }))
        .filter(x => x.Amount > 0 && (x.Description.length > 0 || x.For.length > 0));
    }

    function getLatestCarryRecForEng(eng) {
      const carries = state.funds
        .filter(f => f.Engineer === eng && f.Mode === "Carry Balance")
        .sort((a, b) => String(b.RecordId).localeCompare(String(a.RecordId)) || toLocalDateStr(b.Date).localeCompare(toLocalDateStr(a.Date)));
      return carries[0] || null;
    }

    function isRecordBeforeSettlement(eng, recDate, recId = "") {
      const settledUntil = state.settledUntilByEng[eng];
      const latestCarry = getLatestCarryRecForEng(eng);
      if (latestCarry) {
        if (recId === latestCarry.RecordId) return false;
        const carryDate = toLocalDateStr(latestCarry.Date);
        const d = toLocalDateStr(recDate);
        if (settledUntil && d <= settledUntil) return true;
        if (d < carryDate) return true;
        if (d === carryDate && recId && String(recId) < String(latestCarry.RecordId)) return true;
        return false;
      }
      if (!settledUntil) return false;
      return toLocalDateStr(recDate) <= settledUntil;
    }

    function applyPendingOpsToState() {
      if (!Array.isArray(state.pendingOps) || !state.pendingOps.length) return;
      for (const op of state.pendingOps) {
        if (op.action === "addExpense" || op.action === "updateExpense") {
          const rec = normalizeExpenses([op.record])[0];
          if (rec) {
            const idx = state.expenses.findIndex(x => x.RecordId === rec.RecordId);
            if (idx > -1) state.expenses[idx] = rec;
            else state.expenses.unshift(rec);
          }
        } else if (op.action === "deleteExpense") {
          state.expenses = state.expenses.filter(x => x.RecordId !== op.RecordId);
        } else if (op.action === "addFund" || op.action === "updateFund") {
          const rec = normalizeFunds([op.record])[0];
          if (rec) {
            const idx = state.funds.findIndex(x => x.RecordId === rec.RecordId);
            if (idx > -1) state.funds[idx] = rec;
            else state.funds.unshift(rec);
          }
        } else if (op.action === "deleteFund") {
          state.funds = state.funds.filter(x => x.RecordId !== op.RecordId);
        } else if (op.action === "settlePeriod") {
          const eng = op.engineer;
          const upTo = toLocalDateStr(op.upToDate);
          if (eng && upTo) {
            state.settledUntilByEng[eng] = upTo;
            state.funds.forEach(f => {
              if (f.Engineer === eng && f.Mode !== "Carry Balance" && toLocalDateStr(f.Date) <= upTo) {
                f.Settled = true;
              }
            });
            state.expenses.forEach(e => {
              if (e.Engineer === eng && toLocalDateStr(e.Date) <= upTo) {
                e.Settled = true;
              }
            });
          }
          if (op.carryRecord) {
            const cr = normalizeFunds([op.carryRecord])[0];
            if (cr && !state.funds.some(f => f.RecordId === cr.RecordId)) {
              state.funds.unshift(cr);
            }
          }
        } else if (op.action === "addClientPayment" || op.action === "updateClientPayment") {
          const rec = normalizeClientPayments([op.record])[0];
          if (rec) {
            const idx = state.clientPayments.findIndex(x => x.RecordId === rec.RecordId);
            if (idx > -1) state.clientPayments[idx] = rec;
            else state.clientPayments.unshift(rec);
          }
        } else if (op.action === "deleteClientPayment") {
          state.clientPayments = state.clientPayments.filter(x => x.RecordId !== op.RecordId);
        } else if (op.action === "addSelfExpense" || op.action === "updateSelfExpense") {
          const rec = normalizeSelfExpenses([op.record])[0];
          if (rec) {
            const idx = state.selfExpenses.findIndex(x => x.RecordId === rec.RecordId);
            if (idx > -1) state.selfExpenses[idx] = rec;
            else state.selfExpenses.unshift(rec);
          }
        } else if (op.action === "deleteSelfExpense") {
          state.selfExpenses = state.selfExpenses.filter(x => x.RecordId !== op.RecordId);
        }
      }
    }

    async function flushPendingOps() {
      if (!Array.isArray(state.pendingOps) || !state.pendingOps.length) return;
      const remaining = [];
      for (const op of state.pendingOps) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(op)
          });
          if (!res.ok) remaining.push(op);
        } catch (_) {
          remaining.push(op);
        }
      }
      state.pendingOps = remaining;
      persistCache();
    }

    let isSyncingNow = false;

    function isUserInteractingWithFormOrDropdown() {
      if (state.showExpenseForm || state.editingExpenseId || state.adminAddFormOpen || state.settlePreview) {
        return true;
      }
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName;
      return tag === "SELECT" || tag === "TEXTAREA" || (tag === "INPUT" && active.type !== "date");
    }

    async function loadAllData(showMessage = false) {
      if (isSyncingNow) return;
      isSyncingNow = true;
      if (showMessage) setBanner("Syncing...", "info");
      try {
        await flushPendingOps();
        const res = await fetch(`${SCRIPT_URL}?action=getAll&t=${Date.now()}`, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();

        if (Array.isArray(data.users) && data.users.length) {
          const mapU = new Map();
          FALLBACK_USERS.forEach(u => mapU.set(u.user.toLowerCase(), u));
          data.users.forEach(u => {
            if (u.user && u.password) mapU.set(u.user.toLowerCase(), u);
          });
          state.users = Array.from(mapU.values());
        }
        if (Array.isArray(data.expenses)) state.expenses = normalizeExpenses(data.expenses);
        if (Array.isArray(data.funds)) state.funds = normalizeFunds(data.funds);
        if (Array.isArray(data.clientPayments)) state.clientPayments = normalizeClientPayments(data.clientPayments);
        if (Array.isArray(data.selfExpenses)) state.selfExpenses = normalizeSelfExpenses(data.selfExpenses);

        if (Array.isArray(data.sites) && data.sites.length) {
          const map = new Map();
          state.sites.forEach(s => map.set(s["Site Name"], s));
          data.sites.forEach(s => {
            const name = typeof s === "string" ? s.trim() : String(s["Site Name"] || "").trim();
            if (name) {
              map.set(name, {
                "Site Name": name,
                Location: typeof s === "object" ? String(s.Location || "") : "",
                Status: typeof s === "object" ? String(s.Status || "Active") : "Active"
              });
            }
          });
          state.sites = Array.from(map.values());
        }

        state.units = sanitizeUnitsList(data.units);

        applyPendingOpsToState();
        persistCache();
        if (showMessage) setBanner("Synced.", "info");
      } catch (err) {
        if (showMessage) setBanner("Check Apps Script access (Anyone).", "warn");
      } finally {
        isSyncingNow = false;
        if (state.currentUser && !isUserInteractingWithFormOrDropdown()) {
          render();
        }
      }
    }

    async function postAction(payload) {
      state.pendingOps.push(payload);
      persistCache();
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          let json = null;
          try { json = await res.json(); } catch (_) {}
          if (json && json.status === "error") {
            setBanner(json.message || "Error saving record.", "warn");
            return false;
          }
          state.pendingOps = state.pendingOps.filter(x => x !== payload);
          persistCache();
          setBanner("Saved.", "info");
          return true;
        }
      } catch (_) {}
      setBanner("Saved locally; retrying sync...", "warn");
      return true;
    }

          <button type="button" class="nav-btn nav-expense ${state.activeTab === "expenses" ? "active" : ""}" onclick="onBottomNavClick('expenses')">Expenses</button>
        `;

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natural Associates - Site Expense Tracker</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #18221d;
      --muted: #5c6b63;
      --header-bg: #1e293b;
      --header-ink: #ffffff;
      --accent: #1b5e3a;
      --accent-soft: #eef5f1;
      --accent-border: #d3e3da;
      --terracotta: #c84b31;
      --terracotta-dark: #a83a22;
      --terracotta-soft: #fdf2ef;
      --amber-soft: #fbf6e9;
      --border: #dfe5e2;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      padding-bottom: 96px;
      line-height: 1.45;
      min-height: 100vh;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .login-emblem {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      border: 1px solid var(--accent-border);
      overflow: hidden;
    }

    .login-emblem img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .login-brand {
      font-size: 21px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.2px;
      margin-bottom: 20px;
    }

    .login-field {
      margin-bottom: 14px;
      text-align: left;
    }

    .login-user-select {
      text-align: center;
      text-align-last: center;
      font-size: 18px;
      font-weight: 800;
      padding: 12px 14px;
      color: var(--ink);
      background: #f8faf9;
      border: 1.5px solid var(--border);
      border-radius: 11px;
    }

    .pin-input {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 6px;
      padding: 11px 38px 11px 14px;
    }

    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 12px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background: var(--header-bg);
      color: #ffffff;
      border-radius: 10px;
      margin-top: 4px;
    }

    .login-error {
      color: var(--terracotta);
      background: var(--terracotta-soft);
      border: 1px solid #f2c4ba;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: none;
      text-align: left;
    }

    .app-shell {
      display: none;
    }

    .topbar {
      background: var(--header-bg);
      color: var(--header-ink);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
    }

    .topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-toggle-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      width: 34px;
      height: 34px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .brand-leaf {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-leaf img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.1px;
    }

    .brand-sub {
      font-size: 11.5px;
      color: #cbd5e1;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .drawer-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 60;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .side-drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 265px;
      max-width: 82vw;
      height: 100vh;
      background: #ffffff;
      z-index: 70;
      box-shadow: 4px 0 22px rgba(15, 23, 42, 0.18);
      transition: left 0.22s ease;
      display: flex;
      flex-direction: column;
      padding: 18px 14px;
    }

    .side-drawer.open {
      left: 0;
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .drawer-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }

    .drawer-close {
      background: #f1f5f9;
      color: var(--ink);
      padding: 4px 9px;
      font-size: 13px;
      border-radius: 7px;
    }

    .drawer-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .drawer-item {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      color: var(--ink);
      padding: 11px 12px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .drawer-item:hover, .drawer-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent-border);
    }

    select, input, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      color: var(--ink);
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--header-bg);
    }

    input[readonly] {
      background: #f1f5f3;
      color: #3a4f42;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      transition: transform 0.06s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: var(--header-bg);
      color: #fff;
    }

    .btn-danger {
      background: var(--terracotta);
      color: #fff;
    }

    .btn-secondary {
      background: #eef2f6;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .container {
      max-width: 1100px;
      margin: 14px auto 0;
      padding: 0 12px;
    }

    .status-banner {
      display: none;
      padding: 8px 12px;
      border-radius: 9px;
      margin-bottom: 11px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .status-banner.info {
      display: block;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .status-banner.warn {
      display: block;
      background: var(--terracotta-soft);
      color: var(--terracotta);
      border: 1px solid #f2c4ba;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 15px;
      margin-bottom: 13px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .eng-toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .period-group {
      display: inline-flex;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
      gap: 2px;
      box-shadow: var(--shadow);
    }

    .period-btn {
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 7px;
    }

    .period-btn.active {
      background: var(--header-bg);
      color: #ffffff;
    }

    .vertical-stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .desc-box {
      min-height: 64px;
      resize: vertical;
      font-size: 14px;
      background: #fafbfc;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pb-meta {
      font-size: 12.5px;
      color: var(--muted);
    }

    .pb-actions {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .summary-grid-5 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 9px;
      margin-bottom: 13px;
    }

    .stat-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box.highlight-soft {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .stat-label {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-val {
      font-size: 16.5px;
      font-weight: 800;
      margin-top: 4px;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-paid {
      background: #dcfce7;
      color: #166534;
    }

    .badge-unpaid {
      background: #fef3c7;
      color: #92400e;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 8px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    td.wrap-cell {
      white-space: normal;
      min-width: 150px;
    }

    th {
      color: var(--ink);
      font-size: 12px;
      background: #f1f5f9;
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .confirm-box {
      background: var(--amber-soft);
      border: 1px solid #e7cf96;
      border-radius: 10px;
      padding: 12px;
      margin-top: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      pointer-events: none;
    }

    .bottom-plus-bar {
      max-width: 1100px;
      margin: 0 auto 8px;
      padding: 0 16px;
      display: flex;
      justify-content: flex-end;
      pointer-events: none;
    }

    .bottom-plus-btn {
      pointer-events: auto;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--terracotta);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 14px rgba(200, 75, 49, 0.45);
      font-size: 24px;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .bottom-nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      background: #ffffff;
      border-top: 1px solid var(--border);
      box-shadow: 0 -3px 12px rgba(15, 23, 42, 0.08);
      pointer-events: auto;
    }

    .nav-btn {
      flex: 1;
      border-radius: 0;
      background: #ffffff;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 800;
      padding: 13px 8px;
      border-right: 1px solid var(--border);
    }

    .nav-btn:last-child {
      border-right: none;
    }

    .nav-btn.nav-summary {
      color: var(--accent);
      background: #f2f8f5;
    }

    .nav-btn.nav-summary.active {
      background: var(--accent);
      color: #ffffff;
    }

    .nav-btn.nav-expense {
      color: var(--terracotta-dark);
      background: var(--terracotta-soft);
    }

    .nav-btn.nav-expense.active {
      background: var(--terracotta);
      color: #ffffff;
    }

    .c-green { color: var(--accent); }
    .c-red { color: var(--terracotta); }
    .c-ink { color: var(--ink); }

    @media print {
      .topbar, .bottom-nav, .side-drawer, .drawer-backdrop, .no-print {
        display: none !important;
      }
      body {
        background: #fff;
        padding-bottom: 0;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-emblem">
        <img
          src="icon-192.png"
          alt="Logo"
          onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
        />
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div class="login-brand">Natural Associates</div>
      <form onsubmit="handleLogin(event)" autocomplete="off">
        <div class="login-field">
          <select id="loginUserSelect" class="login-user-select" aria-label="User"></select>
        </div>
        <div class="login-field">
          <div class="pw-wrap">
            <input
              type="password"
              id="loginPasswordInput"
              class="pin-input"
              maxlength="4"
              inputmode="numeric"
              autocomplete="new-password"
              placeholder="••••"
              aria-label="Password"
              required
            />
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility()">Show</button>
          </div>
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="btn-login">Login</button>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <div id="drawerBackdrop" class="drawer-backdrop no-print" onclick="closeSideDrawer()"></div>
    <aside id="sideDrawer" class="side-drawer no-print" aria-label="Admin Menu">
      <div class="drawer-header">
        <span class="drawer-title">Admin Menu</span>
        <button type="button" class="drawer-close" onclick="closeSideDrawer()">✕</button>
      </div>
      <div class="drawer-list">
        <button type="button" class="drawer-item" data-view="summary" onclick="selectDrawerView('summary')">Summary</button>
        <button type="button" class="drawer-item" data-view="expenses" onclick="selectDrawerView('expenses')">Expenses</button>
        <button type="button" class="drawer-item" data-view="clientPayment" onclick="selectDrawerView('clientPayment')">Client Payment</button>
        <button type="button" class="drawer-item" data-view="engineerFund" onclick="selectDrawerView('engineerFund')">Engineer Fund</button>
        <button type="button" class="drawer-item" data-view="addEngineer" onclick="selectDrawerView('addEngineer')">Add Engineer</button>
        <button type="button" class="drawer-item" data-view="addSite" onclick="selectDrawerView('addSite')">Add Site</button>
        <button type="button" class="drawer-item" data-view="addUnits" onclick="selectDrawerView('addUnits')">Add Units</button>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <button type="button" id="menuBtn" class="menu-toggle-btn no-print" title="Menu" onclick="openSideDrawer()">☰</button>
          <div class="brand-leaf">
            <img
              src="icon-192.png"
              alt="Logo"
              onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">Natural Associates</div>
            <div class="brand-sub" id="loggedInBadge">Logged in</div>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="btn-ghost btn-sm" onclick="loadAllData(true)">Sync</button>
          <button type="button" class="btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="statusBanner" class="status-banner"></div>
      <section id="viewContainer"></section>
    </main>

    <nav class="bottom-nav no-print">
      <div id="bottomPlusBar" class="bottom-plus-bar"></div>
      <div class="bottom-nav-inner" id="bottomNavInner"></div>
    </nav>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgrEAoJfYOUEBCtOzJ3938s-81eHi8LDwSiQDxSiVqEg8N2Wcc-pagsmxWLfdbjZO80A/exec";
    const CACHE_KEY = "NA_TRACKER_CACHE_V16";

    const DEFAULT_ENGINEERS = ["Senthil", "Manigandan", "Yogesh", "Sivashankar"];
    const CATEGORIES = [
      "Material",
      "Masonry",
      "Centring",
      "Electrician",
      "Plumber",
      "Painter",
      "Tiles Layer",
      "Carpenter",
      "Fabricator",
      "Polish",
      "Granite layer"
    ];
    const DEFAULT_UNITS = [
      "Nos", "Kg", "Tons", "Cft", "Ltr", "Bags", "Bundle", "Advance", "Transport", "Unit"
    ];
    const CONFIGURED_USERS = [
      { user: "Admin", role: "ADMIN", password: "2021" },
      { user: "Senthil", role: "ENGINEER", password: "1981" },
      { user: "Manigandan", role: "Manigandan", password: "8889" },
      { user: "Yogesh", role: "ENGINEER", password: "7699" },
      { user: "Sivashankar", role: "ENGINEER", password: "2962" }
    ];

    const state = {
      currentUser: null,
      activeTab: "summary",
      engPeriod: "All",
      adminFilterOpen: false,
      adminAddFormOpen: false,
      cpSiteFilter: "",
      cpFromDate: "",
      cpToDate: "",
      efEngFilter: "",
      showExpenseForm: false,
      isSavingExpense: false,
      editingExpenseId: null,
      editingClientPaymentId: null,
      editingFundId: null,
      editingSiteName: null,
      editingUserName: null,
      settledUntilByEng: {},
      settlePreview: null,
      users: [...CONFIGURED_USERS],
      expenses: [],
      funds: [],
      clientPayments: [],
      sites: [],
      units: [...DEFAULT_UNITS],
      filters: {
        engineer: "",
        site: "",
        category: "",
        vendor: "",
        description: "",
        fromDate: "",
        toDate: ""
      }
    };

    function normalizeTabName(tab) {
      const t = String(tab || "").trim().toLowerCase();
      if (t === "expense" || t === "expenses") return "expenses";
      if (t === "summary") return "summary";
      if (t === "clientpayment" || t === "client payment") return "clientPayment";
      if (t === "engineerfund" || t === "engineer fund") return "engineerFund";
      if (t === "addengineer" || t === "add engineer") return "addEngineer";
      if (t === "addsite" || t === "add site") return "addSite";
      if (t === "addunits" || t === "add units") return "addUnits";
      return "summary";
    }

    function getCanonicalUserKey(name) {
      const lower = String(name || "").trim().toLowerCase();
      if (!lower) return "";
      if (lower === "manigandan" || lower === "Manigandan" || lower === "மணிகண்டன்") return "Manigandan";
      if (lower === "senthil" || lower === "செந்தில்") return "senthil";
      if (lower === "yogesh" || lower === "யோகேஷ்") return "yogesh";
      if (lower === "sivashankar" || lower === "சிவசங்கர்") return "sivashankar";
      if (lower === "admin" || lower === "அட்மின்") return "admin";
      return lower;
    }

    function getCanonicalDisplayName(name) {
      const key = getCanonicalUserKey(name);
      if (key === "Manigandan") return "Manigandan";
      if (key === "senthil") return "Senthil";
      if (key === "yogesh") return "Yogesh";
      if (key === "sivashankar") return "Sivashankar";
      if (key === "admin") return "Admin";
      return String(name || "").trim();
    }

    function dedupeUsersList(rawList) {
      const map = new Map();
      if (Array.isArray(rawList)) {
        rawList.forEach(u => {
          if (!u || !u.user) return;
          const cleanName = String(u.user).trim();
          const key = getCanonicalUserKey(cleanName);
          if (!cleanName || !key) return;
          const displayName = getCanonicalDisplayName(cleanName);
          const role = key === "admin"
            ? "ADMIN"
            : (key === "Manigandan" ? "Manigandan" : (u.role || "ENGINEER"));
          map.set(key, {
            user: displayName,
            role,
            password: String(u.password || "1234")
          });
        });
      }
      return Array.from(map.values());
    }

    function normalizeSiteStatus(val) {
      const s = String(val || "").trim().toLowerCase();
      if (s === "completed" || s === "complete" || s === "closed") return "Completed";
      return "Ongoing";
    }

    function isSiteCompleted(siteName) {
      const target = String(siteName || "").trim().toLowerCase();
      if (!target) return false;
      const found = state.sites.find(s => String(s["Site Name"] || "").trim().toLowerCase() === target);
      if (!found) return false;
      return normalizeSiteStatus(found.Status) === "Completed";
    }

    function getEngineerNames() {
      const names = [];
      const seen = new Set();
      state.users.forEach(u => {
        const val = String(u.user || "").trim();
        if (!val) return;
        const key = getCanonicalUserKey(val);
        if (!key || key === "admin") return;
        if (!seen.has(key)) {
          seen.add(key);
          names.push(getCanonicalDisplayName(val));
        }
      });
      return names;
    }

    function normalizePaymentStatus(val) {
      const s = String(val || "").trim().toLowerCase();
      return s === "unpaid" ? "Unpaid" : "Paid";
    }

    function isPaidEntry(item) {
      return normalizePaymentStatus(item.PaymentStatus ?? item.Status ?? item.status) === "Paid";
    }

    function sanitizeUnitsList(rawUnits) {
      const cleaned = [];
      const seen = new Set();
      if (Array.isArray(rawUnits)) {
        rawUnits.forEach(u => {
          const val = String(u || "").trim();
          if (!val) return;
          const lower = val.toLowerCase();
          if (!seen.has(lower)) {
            seen.add(lower);
            cleaned.push(val);
          }
        });
      }
      return cleaned;
    }

    function persistCache() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          users: dedupeUsersList(state.users),
          expenses: state.expenses,
          funds: state.funds,
          clientPayments: state.clientPayments,
          sites: state.sites,
          units: sanitizeUnitsList(state.units),
          settledUntilByEng: state.settledUntilByEng
        }));
      } catch (_) {}
    }

    function restoreCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) {
          state.users = dedupeUsersList(CONFIGURED_USERS);
          state.sites = [];
          state.units = [...DEFAULT_UNITS];
          return;
        }
        const p = JSON.parse(raw);
        state.users = Array.isArray(p.users) && p.users.length ? dedupeUsersList(p.users) : dedupeUsersList(CONFIGURED_USERS);
        state.expenses = Array.isArray(p.expenses) ? normalizeExpenses(p.expenses) : [];
        state.funds = Array.isArray(p.funds) ? normalizeFunds(p.funds) : [];
        state.clientPayments = Array.isArray(p.clientPayments) ? normalizeClientPayments(p.clientPayments) : [];
        state.sites = Array.isArray(p.sites)
          ? p.sites
              .map(s => ({
                "Site Name": String(s["Site Name"] || "").trim(),
                Status: normalizeSiteStatus(s.Status)
              }))
              .filter(s => s["Site Name"])
          : [];
        state.units = Array.isArray(p.units) ? sanitizeUnitsList(p.units) : [...DEFAULT_UNITS];
        if (p.settledUntilByEng && typeof p.settledUntilByEng === "object") {
          state.settledUntilByEng = p.settledUntilByEng;
        }
      } catch (_) {
        state.users = dedupeUsersList(CONFIGURED_USERS);
        state.sites = [];
        state.units = [...DEFAULT_UNITS];
      }
    }

    function toLocalDateStr(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        const y = val.getFullYear();
        const m = String(val.getMonth() + 1).padStart(2, "0");
        const day = String(val.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      const str = String(val).trim();
      const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;

      const slashMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (slashMatch) {
        const p1 = Number(slashMatch[1]);
        const p2 = Number(slashMatch[2]);
        const yr = slashMatch[3];
        let day = p1;
        let month = p2;
        if (p2 > 12 && p1 <= 12) {
          month = p1;
          day = p2;
        }
        return `${yr}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      return str.slice(0, 10);
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getStartOfWeekISO() {
      const d = new Date();
      const dayOfWeek = d.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      d.setDate(d.getDate() + diffToMonday);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getStartOfMonthISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}-01`;
    }

    function formatINR(num) {
      const n = Number(num) || 0;
      return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    function handleLogin(ev) {
      ev.preventDefault();
      const selectedUser = document.getElementById("loginUserSelect").value;
      const enteredPw = document.getElementById("loginPasswordInput").value.trim();
      const errEl = document.getElementById("loginError");

      const selKey = getCanonicalUserKey(selectedUser);
      const matched = state.users.find(u => getCanonicalUserKey(u.user) === selKey);

      if (!matched || String(matched.password) !== String(enteredPw)) {
        errEl.textContent = "Invalid user or PIN.";
        errEl.style.display = "block";
        return;
      }

      errEl.style.display = "none";
      state.currentUser = {
        user: matched.user,
        role: selKey === "admin" ? "ADMIN" : (selKey === "Manigandan" ? "Manigandan" : (matched.role || "ENGINEER"))

      document.getElementById("loginPasswordInput").value = "";

      state.showExpenseForm = false;
      state.editingExpenseId = null;

    function normalizeExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => {
          const qty = Number(r.Qty ?? r.qty ?? 1) || 1;
          const rate = Number(r.Rate ?? r.rate ?? 0) || 0;
          const amt = Number(r.Amount ?? r.amount ?? (qty * rate)) || 0;
          const desc = String(r.Description || r.description || "").trim();
          const recId = String(r.RecordId || r.id || "").trim();
          const unit = String(r.Unit || r.unit || "Nos").trim();
          return {
            RecordId: recId || `EXP_${i + 1}`,
            Date: toLocalDateStr(r.Date || r.date || todayISO()),
            Engineer: getCanonicalDisplayName(String(r.Engineer || r.engineer || "Manigandan").trim()),
            Site: String(r.Site || r.site || "").trim(),
            Category: String(r.Category || r.category || "Material").trim(),
            "Vendor/Contractor": String(r["Vendor/Contractor"] || r.vendor || "").trim(),
            Description: desc,
            Qty: qty,
            Unit: unit,
            Rate: rate,
            Amount: amt,
            PaymentStatus: normalizePaymentStatus(r.PaymentStatus ?? r.paymentStatus ?? r.Status),
            Settled: isSettledFlag(r.Settled ?? r.settled)
          };
        })
        .filter(x => x.Amount > 0 && (x.Description.length > 0 || x.Site.length > 0));
    }

    function normalizeFunds(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => ({
          RecordId: String(r.RecordId || r.id || `FND_${i + 1}`).trim(),
          Date: toLocalDateStr(r.Date || r.date || todayISO()),
          Engineer: getCanonicalDisplayName(String(r.Engineer || r.engineer || "").trim()),
          Amount: Number(r.Amount ?? r.amount ?? 0) || 0,
          Mode: String(r.Mode || r.mode || "Online").trim(),
          Settled: isSettledFlag(r.Settled ?? r.settled)
        }))
        .filter(x => x.Engineer.length > 0 && x.Amount !== 0);
    }

    function normalizeClientPayments(list) {
      if (!Array.isArray(list)) return [];
      return list
        .filter(r => r && typeof r === "object")
        .map((r, i) => {
          const base = Number(r["Base Amount"] ?? r.baseAmount ?? 0) || 0;
          const gstPct = Number(r["Gst%"] ?? r.gstPct ?? 0) || 0;
          const gstAmt = Number(r["GST Amount"] ?? r.gstAmount ?? ((base * gstPct) / 100)) || 0;
          const total = Number(r.TotalAmount ?? r["Total Amount"] ?? r.amount ?? (base + gstAmt)) || 0;
          return {
            RecordId: String(r.RecordId || r.id || `CP_${i + 1}`).trim(),
            Date: toLocalDateStr(r.Date || r.date || todayISO()),
            Site: String(r.Site || r.site || "").trim(),
            "Base Amount": base,
            "Gst%": gstPct,
            "GST Amount": gstAmt,
            TotalAmount: total,
            PaymentMode: String(r.PaymentMode || r.paymentMode || "").trim(),
            ReferenceNo: String(r.ReferenceNo || r.referenceNo || "").trim(),
            Remarks: String(r.Remarks || r.remarks || "").trim()
          };
        })
        .filter(x => x.Site.length > 0 && x.TotalAmount > 0);
    }

    function getLatestCarryRecForEng(eng) {
      const engKey = getCanonicalUserKey(eng);
      const carries = state.funds
        .filter(f => getCanonicalUserKey(f.Engineer) === engKey && f.Mode === "Carry Balance")
        .sort((a, b) => String(b.RecordId).localeCompare(String(a.RecordId)) || toLocalDateStr(b.Date).localeCompare(toLocalDateStr(a.Date)));
      return carries[0] || null;
    }

    function isRecordBeforeSettlement(eng, recDate, recId = "") {
      const settledUntil = state.settledUntilByEng[eng];
      const latestCarry = getLatestCarryRecForEng(eng);
      if (latestCarry) {
        if (recId === latestCarry.RecordId) return false;
        const carryDate = toLocalDateStr(latestCarry.Date);
        const d = toLocalDateStr(recDate);
        if (settledUntil && d <= settledUntil) return true;
        if (d < carryDate) return true;
        if (d === carryDate && recId && String(recId) < String(latestCarry.RecordId)) return true;
        return false;
      }
      if (!settledUntil) return false;
      return toLocalDateStr(recDate) <= settledUntil;
    }

    let isSyncingNow = false;
    let suppressRemoteOverwriteUntil = 0;

    function isUserInteractingWithFormOrDropdown() {
      if (state.showExpenseForm || state.editingExpenseId || state.adminAddFormOpen || state.settlePreview) {
        return true;
      }
      const active = document.activeElement;
      if (!active) return false;
      const tag = active.tagName;
      return tag === "SELECT" || tag === "TEXTAREA" || (tag === "INPUT" && active.type !== "date");
    }

    async function loadAllData(showMessage = false) {
      if (isSyncingNow) return;
      isSyncingNow = true;
      if (showMessage) setBanner("Syncing with Google Sheet...", "info");
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAll&t=${Date.now()}`, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();

        if (Date.now() < suppressRemoteOverwriteUntil) {
          if (showMessage) setBanner("Synced.", "info");
          return;
        }

        if (Array.isArray(data.users) && data.users.length) {
          state.users = dedupeUsersList(data.users);
        }
        syncLoginUserSelectOptions();

        if (Array.isArray(data.expenses)) state.expenses = normalizeExpenses(data.expenses);
        if (Array.isArray(data.funds)) state.funds = normalizeFunds(data.funds);
        if (Array.isArray(data.clientPayments)) state.clientPayments = normalizeClientPayments(data.clientPayments);

        if (Array.isArray(data.sites)) {
          const map = new Map();
          data.sites.forEach(s => {
            const name = typeof s === "string" ? s.trim() : String(s["Site Name"] || "").trim();
            if (name) {
              map.set(name.toLowerCase(), {
                "Site Name": name,
                Status: typeof s === "object" ? normalizeSiteStatus(s.Status) : "Ongoing"
              });
            }
          });
          state.sites = Array.from(map.values());
        }

        if (Array.isArray(data.units)) {
          state.units = sanitizeUnitsList(data.units);
        }

        persistCache();
        if (showMessage) setBanner("Synced with Google Sheet.", "info");
      } catch (err) {
        if (showMessage) setBanner("Sync failed. Check Apps Script deployment (Anyone).", "warn");
      } finally {
        isSyncingNow = false;
        if (state.currentUser && !isUserInteractingWithFormOrDropdown()) {
          render();
        }
      }
    }

    async function postAction(payload) {
      suppressRemoteOverwriteUntil = Date.now() + 3500;
      persistCache();
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          setBanner(`Sheet save failed (HTTP ${res.status}).`, "warn");
          return false;
        }
        let json = null;
        try { json = await res.json(); } catch (_) {}
        if (json && json.status === "error") {
          setBanner(json.message || "Error saving to Google Sheet.", "warn");
          return false;
        }
        setBanner("Saved to Google Sheet.", "info");
        return true;
      } catch (err) {
        setBanner("Network error while saving to Google Sheet.", "warn");
        return false;
      }
    }

    function getScopedExpenses() {
      let list = [...state.expenses];
      if (!isAdmin()) {
        const engKey = getCanonicalUserKey(state.currentUser.user);
        list = list.filter(e =>
          getCanonicalUserKey(e.Engineer) === engKey &&
          !isSiteCompleted(e.Site) &&
          !isSettledFlag(e.Settled) &&
          !isRecordBeforeSettlement(state.currentUser.user, e.Date, e.RecordId)
        );
        const today = todayISO();
        if (state.engPeriod === "Day") {
          list = list.filter(e => toLocalDateStr(e.Date) === today);
        } else if (state.engPeriod === "Week") {
          const weekStart = getStartOfWeekISO();
          list = list.filter(e => {
            const d = toLocalDateStr(e.Date);
            return d >= weekStart && d <= today;
          });
        } else if (state.engPeriod === "Month") {
          const monthStart = getStartOfMonthISO();
          list = list.filter(e => {
            const d = toLocalDateStr(e.Date);
            return d >= monthStart && d <= today;
          });
        }
      } else {
        if (state.filters.engineer) {
          list = list.filter(e => getCanonicalUserKey(e.Engineer) === getCanonicalUserKey(state.filters.engineer));
        }
        if (state.filters.site) list = list.filter(e => e.Site === state.filters.site);
        if (state.filters.category) list = list.filter(e => e.Category === state.filters.category);
        if (state.filters.vendor.trim()) {
          const vq = state.filters.vendor.trim().toLowerCase();
          list = list.filter(e => String(e["Vendor/Contractor"] || "").toLowerCase().includes(vq));
        }
        if (state.filters.description.trim()) {
          const dq = state.filters.description.trim().toLowerCase();
          list = list.filter(e => String(e.Description || "").toLowerCase().includes(dq));
        }
        if (state.filters.fromDate) list = list.filter(e => toLocalDateStr(e.Date) >= state.filters.fromDate);
        if (state.filters.toDate) list = list.filter(e => toLocalDateStr(e.Date) <= state.filters.toDate);
      }
      return list;
    }

    async function saveExpense(ev) {
      ev.preventDefault();
      if (state.isSavingExpense) return;

      const editingObj = state.editingExpenseId
        ? state.expenses.find(e => e.RecordId === state.editingExpenseId)
        : null;

      if (!isAdmin() && editingObj) return;

      const date = toLocalDateStr(document.getElementById("expDate").value || todayISO());
      const engineer = isAdmin()
        ? (document.getElementById("expEngineer")?.value || editingObj?.Engineer || "Manigandan")
        : state.currentUser.user;
      const site = document.getElementById("expSite").value;
      const category = (isAdmin() || isManigandan())
        ? (document.getElementById("expCategory")?.value || "Material")
        : "Material";
      const vendor = document.getElementById("expVendor").value.trim();
      const description = document.getElementById("expDesc").value.trim();
      const qty = Number(document.getElementById("expQty").value) || 1;
      const unit = document.getElementById("expUnit").value || "Nos";
      const rate = Number(document.getElementById("expRate").value) || 0;
      const amount = Number(document.getElementById("expAmount").value) || (qty * rate);
      const paymentStatus = isAdmin()
        ? normalizePaymentStatus(document.getElementById("expPayStatus")?.value)
        : normalizePaymentStatus(document.getElementById("expPayStatus")?.value || "Paid");

      if (!description || amount <= 0) {
        setBanner("Please enter Description and valid Amount.", "warn");
        return;
      }

      if (!isAdmin() && (!site || isSiteCompleted(site))) {
        setBanner("No active site available.", "warn");
        return;
      }

      state.isSavingExpense = true;
      const saveBtn = document.getElementById("expSaveBtn");
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
      }

      if (editingObj) {
        const updated = {
          ...editingObj,
          Date: date,
          Engineer: getCanonicalDisplayName(engineer),
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount,
          PaymentStatus: paymentStatus
        };
        const idx = state.expenses.findIndex(e => e.RecordId === editingObj.RecordId);
        if (idx > -1) state.expenses[idx] = updated;
        state.isSavingExpense = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await postAction({ action: "updateExpense", record: updated });
      } else {
        const newRec = {
          RecordId: "EXP_" + Date.now(),
          Date: date,
          Engineer: getCanonicalDisplayName(engineer),
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount,
          PaymentStatus: paymentStatus,
          Settled: false
        };
        state.expenses.unshift(newRec);
        state.isSavingExpense = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await postAction({ action: "addExpense", record: newRec });
      }
    }

    async function toggleExpensePaymentStatus(recordId, newStatus) {
      if (!isAdmin()) return;
      const idx = state.expenses.findIndex(e => e.RecordId === recordId);
      if (idx === -1) return;
      const updated = {
        ...state.expenses[idx],
        PaymentStatus: normalizePaymentStatus(newStatus)
      };
      state.expenses[idx] = updated;
      render();
      await postAction({ action: "updateExpense", record: updated });
    }

    async function deleteExpense(recordId) {
      if (!isAdmin()) return;
      state.expenses = state.expenses.filter(e => e.RecordId !== recordId);
      render();
      await postAction({ action: "deleteExpense", RecordId: recordId });
    }

    function renderSummaryView() {
      if (!isAdmin()) {
        const engName = state.currentUser.user;
        const engKey = getCanonicalUserKey(engName);

        const myFunds = state.funds.filter(f =>
          getCanonicalUserKey(f.Engineer) === engKey &&
          !isSettledFlag(f.Settled) &&
          !isRecordBeforeSettlement(engName, f.Date, f.RecordId)
        );
        const myPaidExp = state.expenses.filter(e =>
          getCanonicalUserKey(e.Engineer) === engKey &&
          !isSiteCompleted(e.Site) &&
          isPaidEntry(e) &&
          !isSettledFlag(e.Settled) &&
          !isRecordBeforeSettlement(engName, e.Date, e.RecordId)
        );

        const carryItem = myFunds.find(f => f.Mode === "Carry Balance");
        const fSum = myFunds.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const eSum = myPaidExp.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const balVal = fSum - eSum;

        return `
          <div class="summary-grid-5" style="grid-template-columns: repeat(3, 1fr);">
            <div class="stat-box highlight-soft">
              <div class="stat-label">${carryItem ? "Carry Balance" : "Fund Received"}</div>

            <div class="stat-box">
              <div class="stat-label">Expense (Paid)</div>
              <div class="stat-val c-red">${formatINR(eSum)}</div>
            </div>

    function syncGst() {
      const base = Number(document.getElementById("cpBase")?.value) || 0;
      const pct = Number(document.getElementById("cpGstPct")?.value) || 0;
      const gstAmt = (base * pct) / 100;
      const gstEl = document.getElementById("cpGstAmt");
      const totalEl = document.getElementById("cpTotal");
      if (gstEl) gstEl.value = gstAmt.toFixed(2);
      if (totalEl) totalEl.value = (base + gstAmt).toFixed(2);
    }

    async function submitClientPayment(ev) {
      ev.preventDefault();
      const existing = state.editingClientPaymentId
        ? state.clientPayments.find(c => c.RecordId === state.editingClientPaymentId)
        : null;

      const base = Number(document.getElementById("cpBase").value) || 0;
      const gstPct = Number(document.getElementById("cpGstPct").value) || 0;
      const gstAmt = Number(document.getElementById("cpGstAmt")?.value) || ((base * gstPct) / 100);
      const totalAmt = Number(document.getElementById("cpTotal").value) || (base + gstAmt);

      const rec = {
        RecordId: existing ? existing.RecordId : ("CP_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("cpDate").value),
        Site: document.getElementById("cpSite").value,
        "Base Amount": base,
        "Gst%": gstPct,
        "GST Amount": gstAmt,
        TotalAmount: totalAmt,
        PaymentMode: document.getElementById("cpMode").value,
        ReferenceNo: document.getElementById("cpRef").value.trim(),
        Remarks: document.getElementById("cpRemarks").value.trim()
      };

      if (existing) {
        const idx = state.clientPayments.findIndex(c => c.RecordId === existing.RecordId);
        if (idx > -1) state.clientPayments[idx] = rec;
        state.editingClientPaymentId = null;
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "updateClientPayment", record: rec });
      } else {
        state.clientPayments.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "addClientPayment", record: rec });
      }
    }

    async function deleteClientPayment(recordId) {
      if (!isAdmin()) return;
      state.clientPayments = state.clientPayments.filter(c => c.RecordId !== recordId);
      render();
      await postAction({ action: "deleteClientPayment", RecordId: recordId });
    }

    function startEditSite(siteName) {
      state.editingSiteName = siteName;
      state.adminAddFormOpen = true;
      render();
      setTimeout(() => {
        const inp = document.getElementById("newSiteName");
        if (inp) {
          inp.focus();
          inp.select();
        }
      }, 30);
    }

    async function changeSiteStatusInline(siteName, newStatus) {
      if (!isAdmin()) return;
      const normalized = normalizeSiteStatus(newStatus);
      const idx = state.sites.findIndex(s => String(s["Site Name"]).toLowerCase() === siteName.toLowerCase());
      if (idx === -1) return;
      const updated = { "Site Name": state.sites[idx]["Site Name"], Status: normalized };
      state.sites[idx] = updated;
      render();
      await postAction({ action: "addSite", record: updated });
    }

    async function deleteSite(siteName) {
      if (!isAdmin()) return;
      const target = String(siteName || "").trim().toLowerCase();
      state.sites = state.sites.filter(s => String(s["Site Name"]).trim().toLowerCase() !== target);
      if (state.editingSiteName && state.editingSiteName.toLowerCase() === target) {
        state.editingSiteName = null;
      }
      if (state.filters.site && state.filters.site.toLowerCase() === target) {
        state.filters.site = "";
      }
      if (state.cpSiteFilter && state.cpSiteFilter.toLowerCase() === target) {
        state.cpSiteFilter = "";
      }
      render();
      await postAction({ action: "deleteSite", siteName });
    }

    async function submitAddSite(ev) {
      ev.preventDefault();
      const name = document.getElementById("newSiteName").value.trim();
      const status = normalizeSiteStatus(document.getElementById("newSiteStatus").value);
      if (!name) return;

      const oldName = state.editingSiteName ? String(state.editingSiteName).trim() : "";
      const rec = { "Site Name": name, Status: status };

      if (oldName) {
        state.sites = state.sites.filter(s => String(s["Site Name"]).trim().toLowerCase() !== oldName.toLowerCase());
        const dupIdx = state.sites.findIndex(s => String(s["Site Name"]).trim().toLowerCase() === name.toLowerCase());
        if (dupIdx > -1) state.sites[dupIdx] = rec;
        else state.sites.push(rec);

        state.expenses.forEach(e => {
          if (String(e.Site || "").trim().toLowerCase() === oldName.toLowerCase()) e.Site = name;
        });
        state.clientPayments.forEach(c => {
          if (String(c.Site || "").trim().toLowerCase() === oldName.toLowerCase()) c.Site = name;
        });
      } else {
        const idx = state.sites.findIndex(s => String(s["Site Name"]).trim().toLowerCase() === name.toLowerCase());
        if (idx > -1) state.sites[idx] = rec;
        else state.sites.push(rec);
      }

      state.editingSiteName = null;
      state.adminAddFormOpen = false;
      render();
      await postAction({
        action: oldName ? "updateSite" : "addSite",
        oldSiteName: oldName,
        record: rec
      });
    }

    async function submitAddUnit(ev) {
      ev.preventDefault();
      const unitVal = document.getElementById("newUnitName").value.trim();
      if (!unitVal) return;
      if (!state.units.some(u => u.toLowerCase() === unitVal.toLowerCase())) {
        state.units.push(unitVal);
      }
      state.adminAddFormOpen = false;
      render();
      await postAction({ action: "addUnit", unit: unitVal });
    }

    async function deleteUnit(unitVal) {
      if (!isAdmin()) return;
      state.units = state.units.filter(u => u.toLowerCase() !== String(unitVal).toLowerCase());
      render();
      await postAction({ action: "deleteUnit", unit: unitVal });
    }

    async function submitEngineerUser(ev) {
      ev.preventDefault();
      const rawName = document.getElementById("engUserName").value.trim();
      const pin = document.getElementById("engUserPin").value.trim();
      if (!rawName || !pin) return;

      const canonicalKey = getCanonicalUserKey(rawName);
      const displayName = getCanonicalDisplayName(rawName);
      const role = canonicalKey === "admin"
        ? "ADMIN"
        : (canonicalKey === "Manigandan" ? "Manigandan" : "ENGINEER");

      const rec = { user: displayName, role, password: pin };
      state.users = dedupeUsersList([
        ...state.users.filter(u => getCanonicalUserKey(u.user) !== canonicalKey),
        rec
      ]);

      syncLoginUserSelectOptions();
      state.editingUserName = null;
      state.adminAddFormOpen = false;
      render();
      await postAction({ action: "saveUser", record: rec });
    }

    async function deleteEngineerUser(username) {
      if (!isAdmin()) return;
      const targetKey = getCanonicalUserKey(username);
      if (!targetKey || targetKey === "admin") return;

      state.users = dedupeUsersList(state.users.filter(u => getCanonicalUserKey(u.user) !== targetKey));
      if (state.editingUserName && getCanonicalUserKey(state.editingUserName) === targetKey) {
        state.editingUserName = null;
      }
      if (state.filters.engineer && getCanonicalUserKey(state.filters.engineer) === targetKey) {
        state.filters.engineer = "";
      }
      if (state.efEngFilter && getCanonicalUserKey(state.efEngFilter) === targetKey) {
        state.efEngFilter = "";
      }

      syncLoginUserSelectOptions();
      render();
      await postAction({ action: "deleteUser", user: username });
    }

    async function submitEngineerFund(ev) {
      ev.preventDefault();
      const existing = state.editingFundId
        ? state.funds.find(f => f.RecordId === state.editingFundId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("FND_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("efDate").value),
        Engineer: getCanonicalDisplayName(document.getElementById("efEng").value),
        Amount: Number(document.getElementById("efAmt").value) || 0,
        Mode: document.getElementById("efMode").value,
        Settled: existing ? isSettledFlag(existing.Settled) : false
      };

      if (existing) {
        const idx = state.funds.findIndex(f => f.RecordId === existing.RecordId);
        if (idx > -1) state.funds[idx] = rec;
        state.editingFundId = null;
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "updateFund", record: rec });
      } else {
        state.funds.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "addFund", record: rec });
      }
    }

    async function deleteFund(recordId) {
      if (!isAdmin()) return;
      state.funds = state.funds.filter(f => f.RecordId !== recordId);
      render();
      await postAction({ action: "deleteFund", RecordId: recordId });
    }

    function previewSettlePeriod(ev) {
      ev.preventDefault();
      const eng = document.getElementById("spEng").value;
      const engKey = getCanonicalUserKey(eng);
      const upTo = toLocalDateStr(document.getElementById("spDate").value);
      const fSum = state.funds
        .filter(f => getCanonicalUserKey(f.Engineer) === engKey && !isSettledFlag(f.Settled) && toLocalDateStr(f.Date) <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const eSum = state.expenses
        .filter(e => getCanonicalUserKey(e.Engineer) === engKey && isPaidEntry(e) && !isSettledFlag(e.Settled) && toLocalDateStr(e.Date) <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      state.settlePreview = { eng, upTo, fSum, eSum, carry: fSum - eSum };
      render();
    }

    async function confirmSettlePeriod() {
      if (!state.settlePreview) return;
      const { eng, upTo, carry } = state.settlePreview;
      const engKey = getCanonicalUserKey(eng);

      state.funds.forEach(f => {
        if (getCanonicalUserKey(f.Engineer) === engKey && !isSettledFlag(f.Settled) && toLocalDateStr(f.Date) <= upTo) f.Settled = true;
      });
      state.expenses.forEach(e => {
        if (getCanonicalUserKey(e.Engineer) === engKey && toLocalDateStr(e.Date) <= upTo) e.Settled = true;
      });

      const prevSettledDate = state.settledUntilByEng[eng];
      if (!prevSettledDate || upTo > prevSettledDate) {
        state.settledUntilByEng[eng] = upTo;
      }

      const carryRec = {
        RecordId: "CF_" + Date.now(),
        Date: todayISO(),
        Engineer: getCanonicalDisplayName(eng),
        Amount: carry,
        Mode: "Carry Balance",
        Settled: false
      };
      state.funds.unshift(carryRec);

      state.settlePreview = null;
      render();
      await postAction({ action: "settlePeriod", engineer: eng, upToDate: upTo, carryForward: carry, carryRecord: carryRec });
    }

    function render() {
      state.activeTab = normalizeTabName(state.activeTab);
      syncDrawerActiveState();
      renderBottomNav();
      const container = document.getElementById("viewContainer");
      if (state.activeTab === "summary") {
        container.innerHTML = renderSummaryView();
      } else if (state.activeTab === "expenses") {
        container.innerHTML = renderExpensesView();
      } else if (isAdmin() && state.activeTab === "clientPayment") {
        container.innerHTML = renderClientPaymentPage();
      } else if (isAdmin() && state.activeTab === "engineerFund") {
        container.innerHTML = renderEngineerFundPage();
      } else if (isAdmin() && state.activeTab === "addEngineer") {
        container.innerHTML = renderAddEngineerPage();
      } else if (isAdmin() && state.activeTab === "addSite") {
        container.innerHTML = renderAddSitePage();
      } else if (isAdmin() && state.activeTab === "addUnits") {
        container.innerHTML = renderAddUnitsPage();
      } else {
        container.innerHTML = renderSummaryView();
      }
    }

    restoreCache();
    syncLoginUserSelectOptions();

    setInterval(() => {
      if (state.currentUser && document.visibilityState === "visible" && !isUserInteractingWithFormOrDropdown()) {
        loadAllData(false);
      }
    }, 4000);

    (function initSession() {
      const saved = sessionStorage.getItem("NA_SESSION");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.user && parsed.role) {
            state.currentUser = parsed;
            showAppShell();
            loadAllData(false);
            return;
          }
        } catch (_) {}
      }
      loadAllData(false);
    })();
  </script>
</body>
</html>

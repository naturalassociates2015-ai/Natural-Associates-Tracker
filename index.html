<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natural Associates - Site Expense Tracker</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --bg: #f1f5f1;
      --bg-pattern: radial-gradient(circle at 12% 10%, #e1ede3 0%, transparent 45%),
                    radial-gradient(circle at 88% 85%, #e6eee4 0%, transparent 50%);
      --card: #ffffff;
      --ink: #17261d;
      --muted: #586c5f;
      --forest: #1b5e3a;
      --forest-dark: #113f27;
      --leaf: #2e7d52;
      --sage-soft: #e6f1ea;
      --sage-border: #cde0d3;
      --terracotta: #c84b31;
      --terracotta-dark: #a63821;
      --terracotta-soft: #fdf0ed;
      --amber-soft: #fbf5e6;
      --border: #d7e2da;
      --shadow: 0 4px 14px rgba(17, 63, 39, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: var(--bg-pattern);
      color: var(--ink);
      padding-bottom: 92px;
      line-height: 1.45;
      min-height: 100vh;
    }

    /* Login Gate */
    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: linear-gradient(155deg, #0f3822 0%, #1d5c3b 55%, #2b6e49 100%);
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 22px;
      border: 1px solid var(--sage-border);
      box-shadow: 0 18px 40px rgba(8, 28, 17, 0.28);
    }

    .login-emblem {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--sage-soft);
      color: var(--forest);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid var(--sage-border);
      overflow: hidden;
    }

    .login-brand {
      font-size: 21px;
      font-weight: 800;
      color: var(--forest-dark);
      letter-spacing: -0.2px;
    }

    .login-sub {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px;
      margin-bottom: 20px;
    }

    .login-field {
      margin-bottom: 14px;
    }

    .login-field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-toggle {
      position: absolute;
      right: 8px;
      background: transparent;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 12px;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--forest) 0%, var(--leaf) 100%);
      color: #fff;
      border-radius: 10px;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(27, 94, 58, 0.25);
    }

    .login-error {
      color: var(--terracotta);
      background: var(--terracotta-soft);
      border: 1px solid #f2c4ba;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: none;
    }

    /* App Shell */
    .app-shell {
      display: none;
    }

    .topbar {
      background: linear-gradient(135deg, var(--forest-dark) 0%, var(--forest) 100%);
      color: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 3px 12px rgba(17, 63, 39, 0.18);
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-leaf {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .brand-leaf img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .brand-title {
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: -0.1px;
    }

    .brand-sub {
      font-size: 11.5px;
      color: #cde6d7;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    select, input, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      color: var(--ink);
      background: #ffffff;
      transition: border-color 0.15s ease;
    }

    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--forest);
    }

    input[readonly] {
      background: #f2f6f3;
      color: #3a4f42;
      font-weight: 700;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      transition: transform 0.06s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn-primary {
      background: var(--forest);
      color: #fff;
    }

    .btn-plus-expense {
      background: linear-gradient(135deg, var(--terracotta) 0%, var(--terracotta-dark) 100%);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      padding: 9px 15px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(200, 75, 49, 0.28);
      white-space: nowrap;
    }

    .btn-danger {
      background: var(--terracotta);
      color: #fff;
    }

    .btn-secondary {
      background: var(--sage-soft);
      color: var(--forest-dark);
      border: 1px solid var(--sage-border);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
    }

    .container {
      max-width: 980px;
      margin: 14px auto 0;
      padding: 0 12px;
    }

    .status-banner {
      display: none;
      padding: 9px 13px;
      border-radius: 10px;
      margin-bottom: 11px;
      font-size: 13px;
      font-weight: 600;
    }

    .status-banner.info {
      display: block;
      background: var(--sage-soft);
      color: var(--forest-dark);
      border: 1px solid var(--sage-border);
    }

    .status-banner.warn {
      display: block;
      background: var(--terracotta-soft);
      color: var(--terracotta);
      border: 1px solid #f2c4ba;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 13px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--forest-dark);
      margin-bottom: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Period Strip + Plus Expense Bar */
    .eng-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .period-group {
      display: inline-flex;
      background: #ffffff;
      border: 1px solid var(--sage-border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      box-shadow: var(--shadow);
    }

    .period-btn {
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 700;
      border-radius: 7px;
    }

    .period-btn.active {
      background: var(--forest);
      color: #ffffff;
    }

    /* Left-Right Form Grid with Centered Wide Description */
    .lr-form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    .field-full textarea {
      min-height: 76px;
      resize: vertical;
      font-size: 14.5px;
      background: #fbfdfb;
      border: 1.5px solid var(--sage-border);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 13px;
    }

    .pill-chip {
      background: var(--sage-soft);
      color: var(--forest-dark);
      border: 1px solid var(--sage-border);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    .pill-chip.active {
      background: var(--forest);
      color: #fff;
      border-color: var(--forest);
    }

    .date-group-header {
      background: var(--sage-soft);
      color: var(--forest-dark);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      margin: 12px 0 7px;
      display: flex;
      justify-content: space-between;
      border: 1px solid var(--sage-border);
    }

    .passbook-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-left: 4px solid var(--leaf);
      border-radius: 11px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .pb-left {
      min-width: 0;
      flex: 1;
    }

    .pb-site {
      font-size: 14px;
      font-weight: 800;
      color: var(--forest-dark);
    }

    .pb-desc {
      font-size: 13.5px;
      color: var(--ink);
      margin-top: 2px;
      word-break: break-word;
    }

    .pb-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
    }

    .pb-right {
      text-align: right;
      flex-shrink: 0;
    }

    .pb-amt-expense {
      font-size: 15px;
      font-weight: 800;
      color: var(--terracotta);
    }

    .pb-bal {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 700;
    }

    .pb-actions {
      margin-top: 5px;
      display: flex;
      gap: 5px;
      justify-content: flex-end;
    }

    .summary-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-grid-5 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 9px;
      margin-bottom: 13px;
    }

    .stat-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 10px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-box.highlight-sage {
      background: var(--sage-soft);
      border-color: var(--sage-border);
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 800;
      margin-top: 4px;
    }

    .badge-status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-active {
      background: var(--sage-soft);
      color: var(--forest-dark);
    }

    .badge-completed {
      background: #ecefed;
      color: #5d6861;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 7px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--forest-dark);
      font-size: 12px;
      background: var(--sage-soft);
      font-weight: 700;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .confirm-box {
      background: var(--amber-soft);
      border: 1px solid #e7cf96;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    /* Bottom Button Bar + Small Centered Circular Terracotta + Button */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: transparent;
      z-index: 40;
      pointer-events: none;
    }

    .bottom-fab-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: -17px;
      position: relative;
      z-index: 42;
      pointer-events: auto;
    }

    .fab-mini-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--terracotta);
      color: #ffffff;
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(200, 75, 49, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 800;
      line-height: 1;
      padding: 0;
    }

    .bottom-nav-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      background: #ffffff;
      border-top: 1px solid var(--sage-border);
      box-shadow: 0 -4px 16px rgba(17, 63, 39, 0.08);
      pointer-events: auto;
    }

    .nav-btn {
      flex: 1;
      border-radius: 0;
      background: #ffffff;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      padding: 14px 8px;
      border-right: 1px solid var(--border);
    }

    .nav-btn:last-child {
      border-right: none;
    }

    .nav-btn.nav-summary {
      color: var(--forest-dark);
      background: #f4faf6;
    }

    .nav-btn.nav-summary.active {
      background: var(--forest);
      color: #ffffff;
    }

    .nav-btn.nav-expense {
      color: var(--terracotta-dark);
      background: var(--terracotta-soft);
    }

    .nav-btn.nav-expense.active {
      background: var(--terracotta);
      color: #ffffff;
    }

    .nav-btn.nav-admin.active {
      background: var(--forest-dark);
      color: #ffffff;
    }

    .c-green { color: var(--forest); }
    .c-red { color: var(--terracotta); }
    .c-ink { color: var(--ink); }

    @media print {
      .topbar, .bottom-nav, .no-print {
        display: none !important;
      }
      body {
        background: #fff;
        padding-bottom: 0;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-emblem">
        <img
          src="icon-192.png"
          alt="Logo"
          style="width:100%; height:100%; object-fit:cover; display:none;"
          onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
        />
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div class="login-brand">Natural Associates</div>
      <div class="login-sub">Construction &amp; Structural Consultants • Site Tracker</div>
      <div id="loginError" class="login-error"></div>
      <form onsubmit="handleLogin(event)" autocomplete="off">
        <div class="login-field">
          <label for="loginUserSelect">Select User</label>
          <select id="loginUserSelect">
            <option value="Admin" selected>Admin</option>
            <option value="Manigandan">Manigandan</option>
            <option value="Senthil">Senthil</option>
            <option value="Sivashankar">Sivashankar</option>
            <option value="Yogesh">Yogesh</option>
          </select>
        </div>
        <div class="login-field">
          <label for="loginPasswordInput">Password</label>
          <div class="pw-wrap">
            <input type="password" id="loginPasswordInput" autocomplete="new-password" placeholder="Enter password" required />
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility()">Show</button>
          </div>
        </div>
        <button type="submit" class="btn-login">Login</button>
      </form>
    </div>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <div class="brand-leaf">
            <img
              src="icon-192.png"
              alt="Logo"
              onload="this.style.display='block'; this.nextElementSibling.style.display='none';"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
            />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">Natural Associates</div>
            <div class="brand-sub" id="loggedInBadge">Logged in</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="btn-ghost btn-sm" onclick="loadAllData(true)">Sync</button>
          <button class="btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="statusBanner" class="status-banner"></div>
      <section id="viewContainer"></section>
    </main>

    <nav class="bottom-nav no-print">
      <div id="bottomFabWrap" class="bottom-fab-wrap"></div>
      <div class="bottom-nav-inner" id="bottomNavInner"></div>
    </nav>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgrEAoJfYOUEBCtOzJ3938s-81eHi8LDwSiQDxSiVqEg8N2Wcc-pagsmxWLfdbjZO80A/exec";

    const ENGINEERS = ["Manigandan", "Senthil", "Sivashankar", "Yogesh"];
    const CATEGORIES = [
      "Material",
      "Masonry",
      "Centring",
      "Electrician",
      "Plumber",
      "Painter",
      "Tiles Layer",
      "Carpenter",
      "Fabricator",
      "Polish",
      "Granite layer"
    ];
    const DEFAULT_SITES = [
      "Madhuravoyal",
      "Sithalapakam",
      "Oragadam",
      "Sunguvachathiram",
      "Plot-6A"
    ];
    const DEFAULT_UNITS = [
      "Nos", "Kg", "Tons", "Cft", "Ltr", "Load", "Bags", "Day", "NMR", "Bundle", "Advance", "Transport", "W-Payment"
    ];

    const FALLBACK_USERS = [
      { user: "Admin", role: "ADMIN", password: "1234" },
      { user: "Manigandan", role: "Manigandan", password: "1234" },
      { user: "Senthil", role: "ENGINEER", password: "1234" },
      { user: "Sivashankar", role: "ENGINEER", password: "1234" },
      { user: "Yogesh", role: "ENGINEER", password: "1234" }
    ];

    const state = {
      currentUser: null,
      activeTab: "expenses",
      engPeriod: "Month", // Day | Week | Month | All
      adminSetupTab: "Client Payment",
      cpSiteFilter: "",
      showExpenseForm: false,
      isSavingExpense: false,
      editingExpenseId: null,
      editingClientPaymentId: null,
      editingFundId: null,
      editingSelfExpenseId: null,
      editingSiteName: null,
      settledEngineers: {},
      settlePreview: null,
      users: [...FALLBACK_USERS],
      expenses: [],
      funds: [],
      clientPayments: [],
      selfExpenses: [],
      sites: DEFAULT_SITES.map(s => ({ "Site Name": s, Location: "", Status: "Active" })),
      units: [...DEFAULT_UNITS],
      filters: {
        engineer: "",
        site: "",
        category: "",
        vendor: "",
        description: "",
        fromDate: "",
        toDate: ""
      }
    };

    function toLocalDateStr(val) {
      if (!val) return "";
      const str = String(val).trim();
      const isoMatch = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
      const slashMatch = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (slashMatch) {
        return `${slashMatch[3]}-${String(slashMatch[1]).padStart(2, "0")}-${String(slashMatch[2]).padStart(2, "0")}`;
      }
      const d = new Date(str);
      if (!isNaN(d.getTime())) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      return str.slice(0, 10);
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getStartOfWeekISO() {
      const d = new Date();
      const dayOfWeek = d.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      d.setDate(d.getDate() + diffToMonday);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function getStartOfMonthISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      return `${y}-${m}-01`;
    }

    function formatINR(num) {
      const n = Number(num) || 0;
      return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    function formatDateHeading(dateStr) {
      if (!dateStr) return "Unscheduled Date";
      const clean = toLocalDateStr(dateStr);
      const dt = new Date(clean + "T00:00:00");
      if (isNaN(dt.getTime())) return clean;
      return dt.toLocaleDateString("en-GB", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function isSettledFlag(val) {
      return val === true || String(val).trim().toUpperCase() === "TRUE";
    }

    function isAdmin() {
      return state.currentUser && state.currentUser.role === "ADMIN";
    }

    function isManigandan() {
      return state.currentUser && state.currentUser.user === "Manigandan";
    }

    function togglePasswordVisibility() {
      const inp = document.getElementById("loginPasswordInput");
      const btn = document.querySelector(".pw-toggle");
      if (!inp || !btn) return;
      if (inp.type === "password") {
        inp.type = "text";
        btn.textContent = "Hide";
      } else {
        inp.type = "password";
        btn.textContent = "Show";
      }
    }

    function handleLogin(ev) {
      ev.preventDefault();
      const selectedUser = document.getElementById("loginUserSelect").value;
      const enteredPw = document.getElementById("loginPasswordInput").value;
      const errEl = document.getElementById("loginError");

      const matched = state.users.find(
        u => String(u.user).toLowerCase() === String(selectedUser).toLowerCase()
      );

      if (!matched || String(matched.password) !== String(enteredPw)) {
        errEl.textContent = "Invalid user or password.";
        errEl.style.display = "block";
        return;
      }

      errEl.style.display = "none";
      state.currentUser = {
        user: matched.user,
        role: selectedUser === "Admin" ? "ADMIN" : (selectedUser === "Manigandan" ? "Manigandan" : (matched.role || "ENGINEER"))
      };
      sessionStorage.setItem("NA_SESSION", JSON.stringify(state.currentUser));
      document.getElementById("loginPasswordInput").value = "";
      state.activeTab = isAdmin() ? "summary" : "summary";
      state.showExpenseForm = false;
      state.editingExpenseId = null;
      showAppShell();
      loadAllData(false);
    }

    function handleLogout() {
      sessionStorage.removeItem("NA_SESSION");
      state.currentUser = null;
      document.getElementById("appShell").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
    }

    function showAppShell() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appShell").style.display = "block";
      document.getElementById("loggedInBadge").textContent =
        `${state.currentUser.user} • ${isAdmin() ? "Admin Console" : "Site Engineer"}`;
      render();

    function setBanner(msg, type = "info") {

        el.textContent = "";
        return;
      }
      el.className = `status-banner ${type}`;
      el.textContent = msg;
    }

    function getActiveSiteNames() {
      const activeSites = state.sites
        .filter(s => {
          const st = String(s.Status || "Active").trim().toLowerCase();
          return st !== "completed" && st !== "closed";
        })
        .map(s => String(s["Site Name"] || "").trim())
        .filter(Boolean);
      return activeSites.length ? activeSites : [...DEFAULT_SITES];
    }

    function getAllSiteNames() {
      const all = state.sites
        .map(s => String(s["Site Name"] || "").trim())
        .filter(Boolean);
      return all.length ? all : [...DEFAULT_SITES];
    }

    function normalizeExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => {
        const qty = Number(r.Qty ?? r.qty ?? 1) || 1;
        const rate = Number(r.Rate ?? r.rate ?? 0) || 0;
        const amt = Number(r.Amount ?? r.amount ?? (qty * rate)) || 0;
        return {
          RecordId: String(r.RecordId || r.id || `EXP_${i + 1}`),
          Date: toLocalDateStr(r.Date || r.date || todayISO()),
          Engineer: String(r.Engineer || r.engineer || "Manigandan"),
          Site: String(r.Site || r.site || DEFAULT_SITES[0]),
          Category: String(r.Category || r.category || "Material"),
          "Vendor/Contractor": String(r["Vendor/Contractor"] || r.vendor || ""),
          Description: String(r.Description || r.description || ""),
          Qty: qty,
          Unit: String(r.Unit || r.unit || "Nos"),
          Rate: rate,
          Amount: amt,
          Settled: isSettledFlag(r.Settled ?? r.settled)
        };
      });
    }

    function normalizeFunds(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => ({
        RecordId: String(r.RecordId || r.id || `FND_${i + 1}`),
        Date: toLocalDateStr(r.Date || r.date || todayISO()),
        Engineer: String(r.Engineer || r.engineer || "Manigandan"),
        Amount: Number(r.Amount ?? r.amount ?? 0) || 0,
        Mode: String(r.Mode || r.mode || "Online"),
        Settled: isSettledFlag(r.Settled ?? r.settled)
      }));
    }

    function normalizeClientPayments(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => ({
        RecordId: String(r.RecordId || r.id || `CP_${i + 1}`),
        Date: toLocalDateStr(r.Date || r.date || todayISO()),
        Site: String(r.Site || r.site || DEFAULT_SITES[0]),
        "Base Amount": Number(r["Base Amount"] ?? r.baseAmount ?? 0) || 0,
        "Gst%": Number(r["Gst%"] ?? r.gstPct ?? 0) || 0,
        TotalAmount: Number(r.TotalAmount ?? r["Total Amount"] ?? r.amount ?? 0) || 0,
        PaymentMode: String(r.PaymentMode || r.paymentMode || ""),
        ReferenceNo: String(r.ReferenceNo || r.referenceNo || ""),
        Remarks: String(r.Remarks || r.remarks || "")
      }));
    }

    function normalizeSelfExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => ({
        RecordId: String(r.RecordId || r.id || `SE_${i + 1}`),
        Date: toLocalDateStr(r.Date || r.date || todayISO()),
        For: String(r.For || r.for || "Office"),
        Description: String(r.Description || r.description || ""),
        Amount: Number(r.Amount ?? r.amount ?? 0) || 0
      }));
    }

    async function loadAllData(showMessage = false) {
      if (showMessage) setBanner("Syncing with Google Sheet...", "info");
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAll&t=${Date.now()}`, { method: "GET", cache: "no-store" });
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();

        if (Array.isArray(data.users) && data.users.length) {
          const mapU = new Map();
          FALLBACK_USERS.forEach(u => mapU.set(u.user.toLowerCase(), u));
          data.users.forEach(u => {
            if (u.user && u.password) mapU.set(u.user.toLowerCase(), u);
          });
          state.users = Array.from(mapU.values());
        }
        if (Array.isArray(data.expenses)) state.expenses = normalizeExpenses(data.expenses);
        if (Array.isArray(data.funds)) state.funds = normalizeFunds(data.funds);
        if (Array.isArray(data.clientPayments)) state.clientPayments = normalizeClientPayments(data.clientPayments);
        if (Array.isArray(data.selfExpenses)) state.selfExpenses = normalizeSelfExpenses(data.selfExpenses);

        if (Array.isArray(data.sites) && data.sites.length) {
          const map = new Map();
          state.sites.forEach(s => map.set(s["Site Name"], s));
          data.sites.forEach(s => {
            const name = typeof s === "string" ? s.trim() : String(s["Site Name"] || "").trim();
            if (name) {
              map.set(name, {
                "Site Name": name,
                Location: typeof s === "object" ? String(s.Location || "") : "",
                Status: typeof s === "object" ? String(s.Status || "Active") : "Active"
              });
            }
          });
          state.sites = Array.from(map.values());
        }

        if (Array.isArray(data.units) && data.units.length) {
          const mergedUnits = new Set([...data.units, ...DEFAULT_UNITS]);
          state.units = Array.from(mergedUnits);
        }

        if (showMessage) setBanner("Synced with Natural Associates Tracker.", "info");
      } catch (err) {
        if (showMessage) setBanner("Check Apps Script deployment/permissions for live sheet sync.", "warn");
      } finally {
        if (state.currentUser) render();
      }
    }

    async function postAction(payload) {
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          try {
            const json = await res.json();
            if (json && json.status === "error") {
              setBanner(json.message || "Error saving record.", "warn");
              return false;
            }
          } catch (_) {}
          setBanner("Saved to Google Sheet.", "info");
          return true;
        }
      } catch (_) {}
      setBanner("Saved locally; verify Apps Script Web App access if sheet did not update.", "warn");
      return true;
    }

    function getScopedExpenses() {
      let list = [...state.expenses];
      if (!isAdmin()) {
        list = list.filter(e => e.Engineer === state.currentUser.user && !isSettledFlag(e.Settled));
        const today = todayISO();
        if (state.engPeriod === "Day") {
          list = list.filter(e => toLocalDateStr(e.Date) === today);
        } else if (state.engPeriod === "Week") {
          const weekStart = getStartOfWeekISO();
          list = list.filter(e => {
            const d = toLocalDateStr(e.Date);
            return d >= weekStart && d <= today;
          });
        } else if (state.engPeriod === "Month") {
          const monthStart = getStartOfMonthISO();
          list = list.filter(e => {
            const d = toLocalDateStr(e.Date);
            return d >= monthStart && d <= today;
          });
        }
      } else {
        if (state.filters.engineer) list = list.filter(e => e.Engineer === state.filters.engineer);
        if (state.filters.site) list = list.filter(e => e.Site === state.filters.site);
        if (state.filters.category) list = list.filter(e => e.Category === state.filters.category);
        if (state.filters.vendor.trim()) {
          const vq = state.filters.vendor.trim().toLowerCase();
          list = list.filter(e => String(e["Vendor/Contractor"] || "").toLowerCase().includes(vq));
        }
        if (state.filters.description.trim()) {
          const dq = state.filters.description.trim().toLowerCase();
          list = list.filter(e => String(e.Description || "").toLowerCase().includes(dq));
        }
        if (state.filters.fromDate) list = list.filter(e => toLocalDateStr(e.Date) >= state.filters.fromDate);
        if (state.filters.toDate) list = list.filter(e => toLocalDateStr(e.Date) <= state.filters.toDate);
      }
      return list;
    }

    function openExpenseForm(recordId = null) {
      if (!isAdmin() || recordId) {
        state.editingExpenseId = recordId;
        state.showExpenseForm = true;
        state.activeTab = "expenses";
        render();
      }
    }

    function closeExpenseForm() {
      state.editingExpenseId = null;
      state.showExpenseForm = false;
      render();
    }

    function calcExpenseAmount() {
      const qty = Number(document.getElementById("expQty")?.value) || 0;
      const rate = Number(document.getElementById("expRate")?.value) || 0;
      const amtEl = document.getElementById("expAmount");
      if (amtEl && qty > 0 && rate > 0) {
        amtEl.value = (qty * rate).toFixed(2);
      }
    }

    async function saveExpense(ev) {
      ev.preventDefault();
      if (state.isSavingExpense) return;

      const editingObj = state.editingExpenseId
        ? state.expenses.find(e => e.RecordId === state.editingExpenseId)
        : null;

      const date = toLocalDateStr(document.getElementById("expDate").value || todayISO());
      const engineer = isAdmin()
        ? (document.getElementById("expEngineer")?.value || editingObj?.Engineer || "Manigandan")
        : state.currentUser.user;
      const site = document.getElementById("expSite").value;
      const category = (isAdmin() || isManigandan())
        ? (document.getElementById("expCategory")?.value || "Material")
        : "Material";
      const vendor = document.getElementById("expVendor").value.trim();
      const description = document.getElementById("expDesc").value.trim();
      const qty = Number(document.getElementById("expQty").value) || 1;
      const unit = document.getElementById("expUnit").value || "Nos";
      const rate = Number(document.getElementById("expRate").value) || 0;
      const amount = Number(document.getElementById("expAmount").value) || (qty * rate);

      if (!description || amount <= 0) {
        setBanner("Please enter Description and valid Amount.", "warn");
        return;
      }

      state.isSavingExpense = true;
      const saveBtn = document.getElementById("expSaveBtn");
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
      }

      if (editingObj) {
        const updated = {
          ...editingObj,
          Date: date,
          Engineer: engineer,
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount
        };
        const idx = state.expenses.findIndex(e => e.RecordId === editingObj.RecordId);
        if (idx > -1) state.expenses[idx] = updated;
        state.isSavingExpense = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await postAction({ action: "updateExpense", record: updated });
      } else {
        const newRec = {
          RecordId: "EXP_" + Date.now(),
          Date: date,
          Engineer: engineer,
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount,
          Settled: false
        };
        state.expenses.unshift(newRec);
        state.isSavingExpense = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await postAction({ action: "addExpense", record: newRec });
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deleteExpense(recordId) {
      if (!isAdmin()) return;
      state.expenses = state.expenses.filter(e => e.RecordId !== recordId);
      render();
      await postAction({ action: "deleteExpense", RecordId: recordId });
    }

        if (db !== da) return db.localeCompare(da);
        return String(b.RecordId).localeCompare(String(a.RecordId));
      });

      const totalScopedExpense = scoped.reduce((sum, item) => sum + (Number(item.Amount) || 0), 0);

        ? [...state.expenses]
        : state.expenses.filter(e => e.Engineer === state.currentUser.user && !isSettledFlag(e.Settled))

        const db = toLocalDateStr(b.Date);
        if (da !== db) return da.localeCompare(db);
        return String(a.RecordId).localeCompare(String(b.RecordId));
      });

      let runningBal = isAdmin()
        ? (state.clientPayments.reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0) ||
           state.funds.filter(f => !isSettledFlag(f.Settled)).reduce((s, r) => s + (Number(r.Amount) || 0), 0)) -
          state.selfExpenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0)
        : state.funds
            .filter(f => f.Engineer === state.currentUser.user && !isSettledFlag(f.Settled))
            .reduce((s, r) => s + (Number(r.Amount) || 0), 0);

      const balById = {};
      for (const row of allUserExpenses) {
        if (!isSettledFlag(row.Settled)) {
          runningBal -= Number(row.Amount) || 0;
        }
        balById[row.RecordId] = runningBal;
      }

      const listHeading = isAdmin()
        ? "Expense Entries"
        : `Expense Entries (${state.engPeriod})`;

      if (!scoped.length) {
        html += `<div class="card"><div class="card-title"><span>${listHeading}</span><span>Total: ${formatINR(0)}</span></div><div class="pb-meta">No expense entries found for this selection.</div></div>`;
        return html;
      }

      html += `<div class="card"><div class="card-title"><span>${listHeading}</span><span>Total: ${formatINR(totalScopedExpense)}</span></div>`;

      let currentDate = "";
      for (const item of scoped) {
        const itemDate = toLocalDateStr(item.Date);
        if (itemDate !== currentDate) {
          currentDate = itemDate;
          const daySum = scoped
            .filter(x => toLocalDateStr(x.Date) === currentDate)
            .reduce((s, x) => s + (Number(x.Amount) || 0), 0);
          html += `
            <div class="date-group-header">
              <span>${formatDateHeading(currentDate)}</span>
              <span>${formatINR(daySum)}</span>
            </div>
          `;
        }

        const vendorTag = item["Vendor/Contractor"] ? ` • ${item["Vendor/Contractor"]}` : "";
        const qtyTag = `${item.Qty} ${item.Unit} × ${formatINR(item.Rate)}`;

        html += `
          <div class="passbook-item">
            <div class="pb-left">
              <div class="pb-site">${item.Site}</div>
              <div class="pb-desc">${item.Description}</div>
              <div class="pb-meta">${item.Category}${vendorTag} • ${qtyTag} • ${item.Engineer}</div>
            </div>
            <div class="pb-right">
              <div class="pb-amt-expense">${formatINR(item.Amount)}</div>
              <div class="pb-bal">Bal ${formatINR(balById[item.RecordId])}</div>
              ${isAdmin() ? `
                <div class="pb-actions no-print">
                  <button class="btn-secondary btn-sm" onclick="openExpenseForm('${item.RecordId}')">Edit</button>
                  <button class="btn-danger btn-sm" onclick="deleteExpense('${item.RecordId}')">Del</button>
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      return html;
    }

    function renderSummaryView() {
      if (!isAdmin()) {
        const engName = state.currentUser.user;
        const myFunds = state.funds.filter(f => f.Engineer === engName && !isSettledFlag(f.Settled));
        const myExp = state.expenses.filter(e => e.Engineer === engName && !isSettledFlag(e.Settled));
        const fSum = myFunds.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const eSum = myExp.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const balVal = fSum - eSum;
        const isSettled = Boolean(state.settledEngineers[engName]);

        return `
          <div class="summary-grid-3">
            <div class="stat-box highlight-sage">
              <div class="stat-label">Fund Received</div>
              <div class="stat-val c-green">${formatINR(fSum)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Expense</div>
              <div class="stat-val c-red">${formatINR(eSum)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${isSettled ? "Carry Balance" : "Balance"}</div>
              <div class="stat-val c-ink">${formatINR(balVal)}</div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Fund Details (${engName})</div>
            ${myFunds.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>Mode</th><th>Amount</th></tr></thead>
                  <tbody>
                    ${myFunds.map(f => `
                      <tr>
                        <td>${toLocalDateStr(f.Date)}</td>
                        <td>${f.Mode || "Online"}</td>
                        <td class="c-green"><strong>${formatINR(f.Amount)}</strong></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No active fund entries given yet.</div>`}
          </div>
        `;
      }

      const totalClientReceived = state.clientPayments.reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0);
      const totalSiteExpense = state.expenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const siteBalance = totalClientReceived - totalSiteExpense;
      const totalSelfExpense = state.selfExpenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const netBalance = siteBalance - totalSelfExpense;

      const allSites = getAllSiteNames();
      const siteRows = allSites.map(siteName => {
        const paymentsForSite = state.clientPayments.filter(c => c.Site === siteName);
        const baseAmt = paymentsForSite.reduce((s, r) => s + (Number(r["Base Amount"]) || 0), 0);
        const totalAmt = paymentsForSite.reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0);
        const gstAmt = totalAmt - baseAmt;
        const expAmt = state.expenses.filter(e => e.Site === siteName).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        return { siteName, baseAmt, gstAmt, totalAmt, expAmt, bal: totalAmt - expAmt };
      });

      const engRows = ENGINEERS.map(eng => {
        const fAmt = state.funds.filter(f => f.Engineer === eng && !isSettledFlag(f.Settled)).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const eAmt = state.expenses.filter(e => e.Engineer === eng && !isSettledFlag(e.Settled)).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const isSettled = Boolean(state.settledEngineers[eng]);
        return { eng, fAmt, eAmt, bal: fAmt - eAmt, isSettled };
      });

      return `
        <div class="summary-grid-5">
          <div class="stat-box highlight-sage">
            <div class="stat-label">Client Received</div>
            <div class="stat-val c-green">${formatINR(totalClientReceived)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Site Expense</div>
            <div class="stat-val c-red">${formatINR(totalSiteExpense)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Balance</div>
            <div class="stat-val c-ink">${formatINR(siteBalance)}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Self Expense</div>
            <div class="stat-val c-red">${formatINR(totalSelfExpense)}</div>
          </div>
          <div class="stat-box highlight-sage">
            <div class="stat-label">Net Balance</div>
            <div class="stat-val c-ink">${formatINR(netBalance)}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Site-wise Summary</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Site</th>
                  <th>Client Base</th>
                  <th>GST Amount</th>
                  <th>Client Total</th>
                  <th>Site Expense</th>
                  <th>Balance</th>
                </tr>
              </thead>
              <tbody>
                ${siteRows.map(r => `
                  <tr>
                    <td><strong>${r.siteName}</strong></td>
                    <td>${formatINR(r.baseAmt)}</td>
                    <td>${formatINR(r.gstAmt)}</td>
                    <td class="c-green"><strong>${formatINR(r.totalAmt)}</strong></td>
                    <td class="c-red">${formatINR(r.expAmt)}</td>
                    <td><strong>${formatINR(r.bal)}</strong></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Engineer Fund Summary</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Engineer</th><th>Fund Received</th><th>Expense</th><th>Balance / Carry</th></tr></thead>
              <tbody>
                ${engRows.map(r => `
                  <tr>
                    <td><strong>${r.eng}</strong></td>
                    <td class="c-green">${formatINR(r.fAmt)}</td>
                    <td class="c-red">${formatINR(r.eAmt)}</td>
                    <td><strong>${formatINR(r.bal)}</strong> ${r.isSettled ? `<span class="badge-status badge-active">Carry</span>` : ""}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

                Fund: <strong>${formatINR(state.settlePreview.fSum)}</strong> |

                <button type="button" class="btn-primary btn-sm" onclick="confirmSettlePeriod()">Confirm &amp; Settle</button>

    }

    function syncGst() {
      const base = Number(document.getElementById("cpBase")?.value) || 0;
      const pct = Number(document.getElementById("cpGstPct")?.value) || 0;
      const totalEl = document.getElementById("cpTotal");
      if (totalEl) totalEl.value = (base + (base * pct) / 100).toFixed(2);
    }

    async function submitClientPayment(ev) {
      ev.preventDefault();
      const existing = state.editingClientPaymentId
        ? state.clientPayments.find(c => c.RecordId === state.editingClientPaymentId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("CP_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("cpDate").value),
        Site: document.getElementById("cpSite").value,
        "Base Amount": Number(document.getElementById("cpBase").value) || 0,
        "Gst%": Number(document.getElementById("cpGstPct").value) || 0,
        TotalAmount: Number(document.getElementById("cpTotal").value) || 0,
        PaymentMode: document.getElementById("cpMode").value,
        ReferenceNo: document.getElementById("cpRef").value.trim(),
        Remarks: document.getElementById("cpRemarks").value.trim()
      };

      if (existing) {
        const idx = state.clientPayments.findIndex(c => c.RecordId === existing.RecordId);
        if (idx > -1) state.clientPayments[idx] = rec;
        state.editingClientPaymentId = null;
        render();
        await postAction({ action: "updateClientPayment", record: rec });
      } else {
        state.clientPayments.unshift(rec);
        render();
        await postAction({ action: "addClientPayment", record: rec });
      }
    }

    async function deleteClientPayment(recordId) {
      if (!isAdmin()) return;
      state.clientPayments = state.clientPayments.filter(c => c.RecordId !== recordId);
      render();
      await postAction({ action: "deleteClientPayment", RecordId: recordId });
    }

    function startEditSite(siteName) {
      state.editingSiteName = siteName;
      render();
    }

    async function submitAddSite(ev) {
      ev.preventDefault();
      const name = document.getElementById("newSiteName").value.trim();
      const loc = document.getElementById("newSiteLoc").value.trim();
      const status = document.getElementById("newSiteStatus").value;
      if (!name) return;

      const rec = { "Site Name": name, Location: loc, Status: status };
      if (state.editingSiteName) {
        const prevIdx = state.sites.findIndex(s => s["Site Name"] === state.editingSiteName);
        if (prevIdx > -1) state.sites[prevIdx] = rec;
        state.editingSiteName = null;
      } else {
        const idx = state.sites.findIndex(s => s["Site Name"].toLowerCase() === name.toLowerCase());
        if (idx > -1) state.sites[idx] = rec;
        else state.sites.push(rec);
      }

      render();
      await postAction({ action: "addSite", record: rec });
    }

    async function submitSelfExpense(ev) {
      ev.preventDefault();
      const existing = state.editingSelfExpenseId
        ? state.selfExpenses.find(s => s.RecordId === state.editingSelfExpenseId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("SE_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("seDate").value),
        For: document.getElementById("seFor").value,
        Description: document.getElementById("seDesc").value.trim(),
        Amount: Number(document.getElementById("seAmt").value) || 0
      };

      if (existing) {
        const idx = state.selfExpenses.findIndex(s => s.RecordId === existing.RecordId);
        if (idx > -1) state.selfExpenses[idx] = rec;
        state.editingSelfExpenseId = null;
        render();
        await postAction({ action: "updateSelfExpense", record: rec });
      } else {
        state.selfExpenses.unshift(rec);
        render();
        await postAction({ action: "addSelfExpense", record: rec });
      }
    }

    async function deleteSelfExpense(recordId) {
      if (!isAdmin()) return;
      state.selfExpenses = state.selfExpenses.filter(s => s.RecordId !== recordId);
      render();
      await postAction({ action: "deleteSelfExpense", RecordId: recordId });
    }

    async function submitEngineerFund(ev) {
      ev.preventDefault();
      const existing = state.editingFundId
        ? state.funds.find(f => f.RecordId === state.editingFundId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("FND_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("efDate").value),
        Engineer: document.getElementById("efEng").value,
        Amount: Number(document.getElementById("efAmt").value) || 0,
        Mode: document.getElementById("efMode").value,
        Settled: existing ? isSettledFlag(existing.Settled) : false
      };

      if (existing) {
        const idx = state.funds.findIndex(f => f.RecordId === existing.RecordId);
        if (idx > -1) state.funds[idx] = rec;
        state.editingFundId = null;
        render();
        await postAction({ action: "updateFund", record: rec });
      } else {
        state.funds.unshift(rec);
        render();
        await postAction({ action: "addFund", record: rec });
      }
    }

    async function deleteFund(recordId) {
      if (!isAdmin()) return;
      state.funds = state.funds.filter(f => f.RecordId !== recordId);
      render();
      await postAction({ action: "deleteFund", RecordId: recordId });
    }

    function previewSettlePeriod(ev) {
      ev.preventDefault();
      const eng = document.getElementById("spEng").value;
      const upTo = toLocalDateStr(document.getElementById("spDate").value);
      const fSum = state.funds
        .filter(f => f.Engineer === eng && !isSettledFlag(f.Settled) && toLocalDateStr(f.Date) <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const eSum = state.expenses
        .filter(e => e.Engineer === eng && !isSettledFlag(e.Settled) && toLocalDateStr(e.Date) <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      state.settlePreview = { eng, upTo, fSum, eSum, carry: fSum - eSum };
      render();
    }

    async function confirmSettlePeriod() {
      if (!state.settlePreview) return;
      const { eng, upTo, carry } = state.settlePreview;

      state.funds.forEach(f => {
        if (f.Engineer === eng && !isSettledFlag(f.Settled) && toLocalDateStr(f.Date) <= upTo) f.Settled = true;
      });
      state.expenses.forEach(e => {
        if (e.Engineer === eng && !isSettledFlag(e.Settled) && toLocalDateStr(e.Date) <= upTo) e.Settled = true;
      });

      state.settledEngineers[eng] = { settledDate: upTo, carry };

      const carryRec = {
        RecordId: "CF_" + Date.now(),
        Date: todayISO(),
        Engineer: eng,
        Amount: carry,
        Mode: "Carry Balance",
        Settled: false
      };
      state.funds.unshift(carryRec);

      state.settlePreview = null;
      render();
      await postAction({ action: "settlePeriod", engineer: eng, upToDate: upTo, carryForward: carry, carryRecord: carryRec });
    }

    function render() {
      renderBottomNav();
      const container = document.getElementById("viewContainer");
      if (state.activeTab === "summary") {
        container.innerHTML = renderSummaryView();
      } else if (state.activeTab === "adminSetup" && isAdmin()) {
        container.innerHTML = renderAdminSetupView();
      } else {
        container.innerHTML = renderExpensesView();
      }
    }

    (function initSession() {
      const saved = sessionStorage.getItem("NA_SESSION");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.user && parsed.role) {
            state.currentUser = parsed;
            showAppShell();
            loadAllData(false);
            return;
          }
        } catch (_) {}
      }
      loadAllData(false);
    })();
  </script>
</body>
</html>

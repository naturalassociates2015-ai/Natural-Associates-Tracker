    function getScopedExpenses() {
      let list = [...state.expenses];
      if (!isAdmin()) {
        const eng = state.currentUser.user;
        list = list.filter(e =>
          e.Engineer === eng &&
          !isSettledFlag(e.Settled) &&
          !isRecordBeforeSettlement(eng, e.Date, e.RecordId)
        );
        const today = todayISO();
        if (state.engPeriod === "Day") {
          list = list.filter(e => toLocalDateStr(e.Date) === today);
        } else if (state.engPeriod === "Week") {
          const weekStart = getStartOfWeekISO();
          list = list.filter(e => {
            const d = toLocalDateStr(e.Date);
            return d >= weekStart && d <= today;
          });
        } else if (state.engPeriod === "Month") {
          const monthStart = getStartOfMonthISO();
          list = list.filter(e => {
            const d = toLocalDateStr(e.Date);
            return d >= monthStart && d <= today;
          });
        }
      } else {
        if (state.filters.engineer) list = list.filter(e => e.Engineer === state.filters.engineer);
        if (state.filters.site) list = list.filter(e => e.Site === state.filters.site);
        if (state.filters.category) list = list.filter(e => e.Category === state.filters.category);
        if (state.filters.vendor.trim()) {
          const vq = state.filters.vendor.trim().toLowerCase();
          list = list.filter(e => String(e["Vendor/Contractor"] || "").toLowerCase().includes(vq));
        }
        if (state.filters.description.trim()) {
          const dq = state.filters.description.trim().toLowerCase();
          list = list.filter(e => String(e.Description || "").toLowerCase().includes(dq));
        }
        if (state.filters.fromDate) list = list.filter(e => toLocalDateStr(e.Date) >= state.filters.fromDate);
        if (state.filters.toDate) list = list.filter(e => toLocalDateStr(e.Date) <= state.filters.toDate);
      }
      return list;
    }

    function openExpenseForm(recordId = null) {
      state.editingExpenseId = recordId;
      state.showExpenseForm = true;
      state.activeTab = "expenses";
      render();
      setTimeout(() => {
        const descEl = document.getElementById("expDesc");
        if (descEl && !recordId) descEl.focus();
      }, 40);
    }

    function closeExpenseForm() {
      state.editingExpenseId = null;
      state.showExpenseForm = false;
      render();
    }

    function calcExpenseAmount() {
      const qty = Number(document.getElementById("expQty")?.value) || 0;
      const rate = Number(document.getElementById("expRate")?.value) || 0;
      const amtEl = document.getElementById("expAmount");
      if (amtEl && qty > 0 && rate > 0) {
        amtEl.value = (qty * rate).toFixed(2);
      }
    }

    async function saveExpense(ev) {
      ev.preventDefault();
      if (state.isSavingExpense) return;

      const editingObj = state.editingExpenseId
        ? state.expenses.find(e => e.RecordId === state.editingExpenseId)
        : null;

      const date = toLocalDateStr(document.getElementById("expDate").value || todayISO());
      const engineer = isAdmin()
        ? (document.getElementById("expEngineer")?.value || editingObj?.Engineer || "Manigandan")
        : state.currentUser.user;
      const site = document.getElementById("expSite").value;
      const category = (isAdmin() || isManigandan())
        ? (document.getElementById("expCategory")?.value || "Material")
        : "Material";
      const vendor = document.getElementById("expVendor").value.trim();
      const description = document.getElementById("expDesc").value.trim();
      const qty = Number(document.getElementById("expQty").value) || 1;
      const unit = document.getElementById("expUnit").value || "Nos";
      const rate = Number(document.getElementById("expRate").value) || 0;
      const amount = Number(document.getElementById("expAmount").value) || (qty * rate);

      if (!description || amount <= 0) {
        setBanner("Please enter Description and valid Amount.", "warn");
        return;
      }

      state.isSavingExpense = true;
      const saveBtn = document.getElementById("expSaveBtn");
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";
      }

      if (editingObj) {
        const updated = {
          ...editingObj,
          Date: date,
          Engineer: engineer,
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount
        };
        const idx = state.expenses.findIndex(e => e.RecordId === editingObj.RecordId);
        if (idx > -1) state.expenses[idx] = updated;
        state.isSavingExpense = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await postAction({ action: "updateExpense", record: updated });
      } else {
        const newRec = {
          RecordId: "EXP_" + Date.now(),
          Date: date,
          Engineer: engineer,
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount,
          Settled: false
        };
        state.expenses.unshift(newRec);
        state.isSavingExpense = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await postAction({ action: "addExpense", record: newRec });
      }
    }

    async function deleteExpense(recordId) {
      if (!isAdmin()) return;
      state.expenses = state.expenses.filter(e => e.RecordId !== recordId);
      render();
      await postAction({ action: "deleteExpense", RecordId: recordId });
    }

    function renderEntryFormCard(editingObj) {
      const activeSiteNames = getActiveSiteNames();
      const unitOptions = sanitizeUnitsList(state.units);
      const defaultEng = editingObj ? editingObj.Engineer : state.currentUser.user;
      const defaultSite = editingObj ? editingObj.Site : (activeSiteNames[0] || DEFAULT_SITES[0]);
      const defaultCat = editingObj ? editingObj.Category : "Material";
      const defaultDate = editingObj ? toLocalDateStr(editingObj.Date) : todayISO();
      const defaultVendor = editingObj ? editingObj["Vendor/Contractor"] : "";
      const defaultDesc = editingObj ? editingObj.Description : "";
      const defaultQty = editingObj ? editingObj.Qty : 1;
      const defaultUnit = editingObj && !REMOVED_UNITS.has(String(editingObj.Unit || "").toLowerCase())
        ? editingObj.Unit
        : (unitOptions[0] || "Nos");
      const defaultRate = editingObj ? editingObj.Rate : "";
      const defaultAmt = editingObj ? editingObj.Amount : "";

      const useCategoryDropdown = isAdmin() || isManigandan();
      const formSiteOptions = editingObj && !activeSiteNames.includes(editingObj.Site)
        ? [editingObj.Site, ...activeSiteNames]
        : activeSiteNames;

      const formUnitOptions = !unitOptions.includes(defaultUnit)
        ? [defaultUnit, ...unitOptions]
        : unitOptions;

      return `
        <div class="card no-print">
          <div class="card-title">${editingObj ? "Edit Expense Entry" : "New Expense Entry"}</div>
          <form onsubmit="saveExpense(event)">
            <div class="step-pairs">
              <div class="pair-row">
                <div class="field">
                  <label>Date</label>
                  <input type="date" id="expDate" value="${defaultDate}" required />
                </div>
                <div class="field">
                  <label>Site</label>
                  <select id="expSite">
                    ${formSiteOptions.map(s => `<option value="${s}" ${s === defaultSite ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                </div>
              </div>

              <div class="pair-row">
                <div class="field">
                  <label>Category</label>
                  ${useCategoryDropdown ? `
                    <select id="expCategory">
                      ${CATEGORIES.map(c => `<option value="${c}" ${c === defaultCat ? "selected" : ""}>${c}</option>`).join("")}
                    </select>
                  ` : `
                    <input type="text" id="expCategory" value="Material" readonly />
                  `}
                </div>
                <div class="field">
                  <label>Vendor / Contractor</label>
                  <input type="text" id="expVendor" value="${defaultVendor}" placeholder="Supplier or contractor" />
                </div>
              </div>

              ${isAdmin() ? `
                <div class="pair-row">
                  <div class="field">
                    <label>Engineer</label>
                    <select id="expEngineer">
                      ${ENGINEERS.map(e => `<option value="${e}" ${e === defaultEng ? "selected" : ""}>${e}</option>`).join("")}
                    </select>
                  </div>
                  <div class="field">
                    <label>Description</label>
                    <textarea id="expDesc" class="desc-box" rows="2" placeholder="Material or work details..." required>${defaultDesc}</textarea>
                  </div>
                </div>
              ` : `
                <div class="pair-row">
                  <div class="field">
                    <label>Description</label>
                    <textarea id="expDesc" class="desc-box" rows="2" placeholder="Material or work details..." required>${defaultDesc}</textarea>
                  </div>
                  <div class="field">
                    <label>Qty</label>
                    <input type="number" step="0.01" min="0.01" id="expQty" value="${defaultQty}" oninput="calcExpenseAmount()" required />
                  </div>
                </div>
              `}

              ${isAdmin() ? `
                <div class="pair-row">
                  <div class="field">
                    <label>Qty</label>
                    <input type="number" step="0.01" min="0.01" id="expQty" value="${defaultQty}" oninput="calcExpenseAmount()" required />
                  </div>
                  <div class="field">
                    <label>Unit</label>
                    <select id="expUnit">
                      ${formUnitOptions.map(u => `<option value="${u}" ${u === defaultUnit ? "selected" : ""}>${u}</option>`).join("")}
                    </select>
                  </div>
                </div>
              ` : `
                <div class="pair-row">
                  <div class="field">
                    <label>Unit</label>
                    <select id="expUnit">
                      ${formUnitOptions.map(u => `<option value="${u}" ${u === defaultUnit ? "selected" : ""}>${u}</option>`).join("")}
                    </select>
                  </div>
                  <div class="field">
                    <label>Rate (₹)</label>
                    <input type="number" step="0.01" min="0" id="expRate" value="${defaultRate}" placeholder="0" oninput="calcExpenseAmount()" required />
                  </div>
                </div>
              `}

              ${isAdmin() ? `
                <div class="pair-row">
                  <div class="field">
                    <label>Rate (₹)</label>
                    <input type="number" step="0.01" min="0" id="expRate" value="${defaultRate}" placeholder="0" oninput="calcExpenseAmount()" required />
                  </div>
                  <div class="field">
                    <label>Amount (₹)</label>
                    <input type="number" step="0.01" min="0.01" id="expAmount" value="${defaultAmt}" placeholder="0" required />
                  </div>
                </div>
              ` : `
                <div class="pair-row">
                  <div class="field">
                    <label>Amount (₹)</label>
                    <input type="number" step="0.01" min="0.01" id="expAmount" value="${defaultAmt}" placeholder="0" required />
                  </div>
                  <div class="field" style="display:flex; align-items:flex-end; gap:8px;">
                    <button type="button" class="btn-secondary" style="flex:1;" onclick="closeExpenseForm()">Close</button>
                    <button type="submit" id="expSaveBtn" class="btn-primary" style="flex:1;">${editingObj ? "Update" : "Save"}</button>
                  </div>
                </div>
              `}
            </div>

            ${isAdmin() ? `
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeExpenseForm()">Close</button>
                <button type="submit" id="expSaveBtn" class="btn-primary">${editingObj ? "Update Entry" : "Save Expense"}</button>
              </div>
            ` : ""}
          </form>
        </div>
      `;
    }

    function renderExpensesView() {
      const allSiteNames = getAllSiteNames();
      const editingObj = isAdmin() && state.editingExpenseId
        ? state.expenses.find(e => e.RecordId === state.editingExpenseId)
        : null;

      const showForm = (!isAdmin() && state.showExpenseForm) || (isAdmin() && Boolean(editingObj));

      let html = "";

      if (showForm) {
        html += renderEntryFormCard(editingObj);
      }

      if (!isAdmin()) {
        html += `
          <div class="eng-toolbar no-print">
            <div class="period-group">
              ${["Day", "Week", "Month", "All"].map(p => `
                <button type="button" class="period-btn ${state.engPeriod === p ? "active" : ""}" onclick="state.engPeriod = '${p}'; render();">${p}</button>
              `).join("")}
            </div>
          </div>
        `;
      } else {
        html += `
          <div class="card no-print">
            <div class="card-title" style="margin-bottom:${state.adminFilterOpen ? "11px" : "0"};">
              <span>Expense Filter</span>
              <div style="display:flex; gap:6px;">
                <button type="button" class="btn-secondary btn-sm" onclick="state.adminFilterOpen = !state.adminFilterOpen; render();">
                  ${state.adminFilterOpen ? "Hide Filter" : "Filter"}
                </button>
                <button type="button" class="btn-secondary btn-sm" onclick="window.print()">Print</button>
              </div>
            </div>
            ${state.adminFilterOpen ? `
              <div class="form-grid">
                <div class="field">
                  <label>Engineer</label>
                  <select onchange="state.filters.engineer = this.value; render();">
                    <option value="">All Engineers</option>
                    ${ENGINEERS.map(e => `<option value="${e}" ${state.filters.engineer === e ? "selected" : ""}>${e}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label>Site</label>
                  <select onchange="state.filters.site = this.value; render();">
                    <option value="">All Sites</option>
                    ${allSiteNames.map(s => `<option value="${s}" ${state.filters.site === s ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label>Category</label>
                  <select onchange="state.filters.category = this.value; render();">
                    <option value="">All Categories</option>
                    ${CATEGORIES.map(c => `<option value="${c}" ${state.filters.category === c ? "selected" : ""}>${c}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label>Vendor / Contractor</label>
                  <input type="text" value="${state.filters.vendor}" placeholder="Search vendor..." oninput="state.filters.vendor = this.value; render();" />
                </div>
                <div class="field">
                  <label>Description</label>
                  <input type="text" value="${state.filters.description}" placeholder="Search description..." oninput="state.filters.description = this.value; render();" />
                </div>
                <div class="field">
                  <label>From Date</label>
                  <input type="date" value="${state.filters.fromDate}" onchange="state.filters.fromDate = this.value; render();" />
                </div>
                <div class="field">
                  <label>To Date</label>
                  <input type="date" value="${state.filters.toDate}" onchange="state.filters.toDate = this.value; render();" />
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }

      const scoped = getScopedExpenses().sort((a, b) => {
        const da = toLocalDateStr(a.Date);
        const db = toLocalDateStr(b.Date);
        if (db !== da) return db.localeCompare(da);
        return String(b.RecordId).localeCompare(String(a.RecordId));
      });

      const totalScopedExpense = scoped.reduce((sum, item) => sum + (Number(item.Amount) || 0), 0);
      const listHeading = isAdmin() ? "Expenses" : `Expenses (${state.engPeriod})`;

      if (!scoped.length) {
        html += `<div class="card"><div class="card-title"><span>${listHeading}</span><span>Total: ${formatINR(0)}</span></div><div class="pb-meta">No entries found.</div></div>`;
        return html;
      }

      html += `
        <div class="card">
          <div class="card-title"><span>${listHeading}</span><span>Total: ${formatINR(totalScopedExpense)}</span></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Engineer</th>
                  <th>Site</th>
                  <th>Category</th>
                  <th>Vendor / Contractor</th>
                  <th>Description</th>
                  <th>Qty</th>
                  <th>Unit</th>
                  <th>Rate</th>
                  <th>Amount</th>
                  ${isAdmin() ? `<th class="no-print">Action</th>` : ""}
                </tr>
              </thead>
              <tbody>
                ${scoped.map(item => `
                  <tr>
                    <td>${toLocalDateStr(item.Date)}</td>
                    <td><strong>${item.Engineer}</strong></td>
                    <td>${item.Site}</td>
                    <td>${item.Category}</td>
                    <td>${item["Vendor/Contractor"] || "-"}</td>
                    <td class="wrap-cell">${item.Description}</td>
                    <td>${item.Qty}</td>
                    <td>${item.Unit}</td>
                    <td>${formatINR(item.Rate)}</td>
                    <td class="c-red"><strong>${formatINR(item.Amount)}</strong></td>
                    ${isAdmin() ? `
                      <td class="no-print">
                        <div class="pb-actions">
                          <button type="button" class="btn-secondary btn-sm" onclick="openExpenseForm('${item.RecordId}')">Edit</button>
                          <button type="button" class="btn-danger btn-sm" onclick="deleteExpense('${item.RecordId}')">Del</button>
                        </div>
                      </td>
                    ` : ""}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      return html;
    }

    function toggleAdminPanel(panelName) {
      state.adminDetailPanel = state.adminDetailPanel === panelName ? null : panelName;
      state.adminAddFormOpen = false;
      state.settlePreview = null;
      render();
    }

    function renderAdminDetailSection(activeSiteNames, allSiteNames) {
      const panel = state.adminDetailPanel;
      if (!panel) return "";

      if (panel === "client") {
        const editCp = state.editingClientPaymentId
          ? state.clientPayments.find(c => c.RecordId === state.editingClientPaymentId)
          : null;
        const showForm = state.adminAddFormOpen || Boolean(editCp);
        const cpSiteOptions = editCp && !activeSiteNames.includes(editCp.Site)
          ? [editCp.Site, ...activeSiteNames]
          : activeSiteNames;

        const filteredCp = state.cpSiteFilter
          ? state.clientPayments.filter(c => c.Site === state.cpSiteFilter)
          : state.clientPayments;

        return `
          <div class="card">
            <div class="card-title">
              <span>Client Received Details</span>
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <select style="width:155px;" onchange="state.cpSiteFilter = this.value; render();">
                  <option value="">All Sites</option>
                  ${allSiteNames.map(s => `<option value="${s}" ${state.cpSiteFilter === s ? "selected" : ""}>${s}</option>`).join("")}
                </select>
                <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen = !state.adminAddFormOpen; state.editingClientPaymentId = null; render();">
                  ${showForm ? "Close" : "+ Add Payment"}
                </button>
              </div>
            </div>

            ${showForm ? `
              <form onsubmit="submitClientPayment(event)" style="margin-bottom:14px;">
                <div class="form-grid">
                  <div class="field"><label>Date</label><input type="date" id="cpDate" value="${editCp ? toLocalDateStr(editCp.Date) : todayISO()}" required /></div>
                  <div class="field"><label>Site</label><select id="cpSite">${cpSiteOptions.map(s => `<option value="${s}" ${editCp && editCp.Site === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
                  <div class="field"><label>Base Amount (₹)</label><input type="number" step="0.01" id="cpBase" value="${editCp ? editCp["Base Amount"] : ""}" oninput="syncGst()" required /></div>
                  <div class="field"><label>GST %</label><input type="number" step="0.01" id="cpGstPct" value="${editCp ? editCp["Gst%"] : 0}" oninput="syncGst()" /></div>
                  <div class="field"><label>Total Amount (₹)</label><input type="number" step="0.01" id="cpTotal" value="${editCp ? editCp.TotalAmount : ""}" required /></div>
                  <div class="field">
                    <label>Payment Mode</label>
                    <select id="cpMode">
                      ${["Bank Transfer", "UPI / GPay", "Cheque", "Cash"].map(m => `<option value="${m}" ${editCp && editCp.PaymentMode === m ? "selected" : ""}>${m}</option>`).join("")}
                    </select>
                  </div>
                  <div class="field"><label>Reference No</label><input type="text" id="cpRef" value="${editCp ? editCp.ReferenceNo : ""}" placeholder="UTR / Cheque No" /></div>
                  <div class="field"><label>Remarks</label><input type="text" id="cpRemarks" value="${editCp ? editCp.Remarks : ""}" placeholder="Client / Stage / notes" /></div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn-primary">${editCp ? "Update Payment" : "Save Payment"}</button>
                </div>
              </form>
            ` : ""}

            ${filteredCp.length ? `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th><th>Site</th><th>Base</th><th>GST%</th><th>Total</th><th>Mode</th><th>Ref No</th><th>Remarks</th><th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filteredCp.map(c => `
                      <tr>
                        <td>${toLocalDateStr(c.Date)}</td>
                        <td><strong>${c.Site}</strong></td>
                        <td>${formatINR(c["Base Amount"])}</td>
                        <td>${c["Gst%"]}%</td>
                        <td class="c-green"><strong>${formatINR(c.TotalAmount)}</strong></td>
                        <td>${c.PaymentMode}</td>
                        <td>${c.ReferenceNo || "-"}</td>
                        <td class="wrap-cell">${c.Remarks || "-"}</td>
                        <td>
                          <div class="pb-actions">
                            <button type="button" class="btn-secondary btn-sm" onclick="state.editingClientPaymentId = '${c.RecordId}'; state.adminAddFormOpen = true; render();">Edit</button>
                            <button type="button" class="btn-danger btn-sm" onclick="deleteClientPayment('${c.RecordId}')">Del</button>
                          </div>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No client payments found.</div>`}
          </div>
        `;
      }

      if (panel === "siteExpense") {
        let list = [...state.expenses];
        if (state.seSiteFilter) list = list.filter(e => e.Site === state.seSiteFilter);
        list = list.sort((a, b) => toLocalDateStr(b.Date).localeCompare(toLocalDateStr(a.Date)));

        return `
          <div class="card">
            <div class="card-title">
              <span>Site Expense Details</span>
              <div style="display:flex; gap:8px; align-items:center;">
                <select style="width:155px;" onchange="state.seSiteFilter = this.value; render();">
                  <option value="">All Sites</option>
                  ${allSiteNames.map(s => `<option value="${s}" ${state.seSiteFilter === s ? "selected" : ""}>${s}</option>`).join("")}
                </select>
                <button type="button" class="btn-secondary btn-sm" onclick="state.adminDetailPanel = null; render();">Close</button>
              </div>
            </div>
            ${list.length ? `
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th><th>Engineer</th><th>Site</th><th>Category</th><th>Vendor</th><th>Description</th><th>Amount</th><th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${list.map(item => `
                      <tr>
                        <td>${toLocalDateStr(item.Date)}</td>
                        <td><strong>${item.Engineer}</strong></td>
                        <td>${item.Site}</td>
                        <td>${item.Category}</td>
                        <td>${item["Vendor/Contractor"] || "-"}</td>
                        <td class="wrap-cell">${item.Description}</td>
                        <td class="c-red"><strong>${formatINR(item.Amount)}</strong></td>
                        <td>
                          <div class="pb-actions">
                            <button type="button" class="btn-secondary btn-sm" onclick="openExpenseForm('${item.RecordId}')">Edit</button>
                            <button type="button" class="btn-danger btn-sm" onclick="deleteExpense('${item.RecordId}')">Del</button>
                          </div>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No site expenses found.</div>`}
          </div>
        `;
      }

      if (panel === "selfExpense") {
        const editSe = state.editingSelfExpenseId
          ? state.selfExpenses.find(s => s.RecordId === state.editingSelfExpenseId)
          : null;
        const showForm = state.adminAddFormOpen || Boolean(editSe);

        return `
          <div class="card">
            <div class="card-title">
              <span>Self Expenses</span>
              <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen = !state.adminAddFormOpen; state.editingSelfExpenseId = null; render();">
                ${showForm ? "Close" : "+ Add Self Expense"}
              </button>
            </div>

            ${showForm ? `
              <form onsubmit="submitSelfExpense(event)" style="margin-bottom:14px;">
                <div class="form-grid">
                  <div class="field"><label>Date</label><input type="date" id="seDate" value="${editSe ? toLocalDateStr(editSe.Date) : todayISO()}" required /></div>
                  <div class="field">
                    <label>For</label>
                    <select id="seFor">
                      ${["Senthil", "Manigandan", "Office"].map(f => `<option value="${f}" ${editSe && editSe.For === f ? "selected" : ""}>${f}</option>`).join("")}
                    </select>
                  </div>
                  <div class="field"><label>Description</label><input type="text" id="seDesc" value="${editSe ? editSe.Description : ""}" placeholder="Self / office expense" required /></div>
                  <div class="field"><label>Amount (₹)</label><input type="number" step="0.01" id="seAmt" value="${editSe ? editSe.Amount : ""}" required /></div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn-primary">${editSe ? "Update" : "Save"}</button>
                </div>
              </form>
            ` : ""}

            ${state.selfExpenses.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>For</th><th>Description</th><th>Amount</th><th>Action</th></tr></thead>
                  <tbody>
                    ${state.selfExpenses.map(s => `
                      <tr>
                        <td>${toLocalDateStr(s.Date)}</td>
                        <td><strong>${s.For}</strong></td>
                        <td class="wrap-cell">${s.Description}</td>
                        <td class="c-red"><strong>${formatINR(s.Amount)}</strong></td>
                        <td>
                          <div class="pb-actions">
                            <button type="button" class="btn-secondary btn-sm" onclick="state.editingSelfExpenseId = '${s.RecordId}'; state.adminAddFormOpen = true; render();">Edit</button>
                            <button type="button" class="btn-danger btn-sm" onclick="deleteSelfExpense('${s.RecordId}')">Del</button>
                          </div>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No self expenses yet.</div>`}
          </div>
        `;
      }

      if (panel === "engineerFund") {
        const editFnd = state.editingFundId
          ? state.funds.find(f => f.RecordId === state.editingFundId)
          : null;
        const showForm = state.adminAddFormOpen || Boolean(editFnd);

        const filteredFunds = state.efEngFilter
          ? state.funds.filter(f => f.Engineer === state.efEngFilter)
          : state.funds;

        return `
          <div class="card">
            <div class="card-title">
              <span>Engineer Fund Details</span>
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                <select style="width:150px;" onchange="state.efEngFilter = this.value; render();">
                  <option value="">All Engineers</option>
                  ${ENGINEERS.map(e => `<option value="${e}" ${state.efEngFilter === e ? "selected" : ""}>${e}</option>`).join("")}
                </select>
                <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen = !state.adminAddFormOpen; state.editingFundId = null; render();">
                  ${showForm ? "Close" : "+ Add Fund"}
                </button>
              </div>
            </div>

            ${showForm ? `
              <form onsubmit="submitEngineerFund(event)" style="margin-bottom:14px;">
                <div class="form-grid">
                  <div class="field"><label>Date</label><input type="date" id="efDate" value="${editFnd ? toLocalDateStr(editFnd.Date) : todayISO()}" required /></div>
                  <div class="field"><label>Engineer</label><select id="efEng">${ENGINEERS.map(e => `<option value="${e}" ${editFnd && editFnd.Engineer === e ? "selected" : ""}>${e}</option>`).join("")}</select></div>
                  <div class="field"><label>Amount (₹)</label><input type="number" step="0.01" id="efAmt" value="${editFnd ? editFnd.Amount : ""}" required /></div>
                  <div class="field">
                    <label>Mode</label>
                    <select id="efMode">
                      ${["GPay / UPI", "Bank Transfer", "Cash", "Carry Balance"].map(m => `<option value="${m}" ${editFnd && editFnd.Mode === m ? "selected" : ""}>${m}</option>`).join("")}
                    </select>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn-primary">${editFnd ? "Update Fund" : "Save Fund"}</button>
                </div>
              </form>
            ` : ""}

            ${filteredFunds.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>Engineer</th><th>Mode</th><th>Amount</th><th>Settled</th><th>Action</th></tr></thead>
                  <tbody>
                    ${filteredFunds.map(f => `
                      <tr>
                        <td>${toLocalDateStr(f.Date)}</td>
                        <td><strong>${f.Engineer}</strong></td>
                        <td>${f.Mode}</td>
                        <td class="c-green"><strong>${formatINR(f.Amount)}</strong></td>
                        <td>${isSettledFlag(f.Settled) ? "Yes" : "No"}</td>
                        <td>
                          <div class="pb-actions">
                            <button type="button" class="btn-secondary btn-sm" onclick="state.editingFundId = '${f.RecordId}'; state.adminAddFormOpen = true; render();">Edit</button>
                            <button type="button" class="btn-danger btn-sm" onclick="deleteFund('${f.RecordId}')">Del</button>
                          </div>
                        </td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No fund entries yet.</div>`}

            <div class="confirm-box">
              <div style="font-size:13px; font-weight:800; margin-bottom:8px;">Settle Period (Carry Balance)</div>
              <form onsubmit="previewSettlePeriod(event)">
                <div class="form-grid">
                  <div class="field"><label>Engineer</label><select id="spEng" onchange="state.settlePreview = null; render();">${ENGINEERS.map(e => `<option value="${e}" ${state.settlePreview?.eng === e ? "selected" : ""}>${e}</option>`).join("")}</select></div>
                  <div class="field"><label>Settle Up To Date</label><input type="date" id="spDate" value="${state.settlePreview?.upTo || todayISO()}" onchange="state.settlePreview = null; render();" required /></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn-secondary btn-sm">Check Balance</button></div>
              </form>
              ${state.settlePreview ? `
                <div style="font-size:13px; margin-top:8px; padding-top:8px; border-top:1px solid #e7cf96;">
                  <strong>${state.settlePreview.eng}</strong> (up to <strong>${state.settlePreview.upTo}</strong>):<br/>
                  Fund: <strong>${formatINR(state.settlePreview.fSum)}</strong> |
                  Spent: <strong>${formatINR(state.settlePreview.eSum)}</strong> |
                  Carry Balance: <strong>${formatINR(state.settlePreview.carry)}</strong>
                  <div class="form-actions" style="margin-top:8px;">
                    <button type="button" class="btn-secondary btn-sm" onclick="state.settlePreview = null; render();">Cancel</button>
                    <button type="button" class="btn-primary btn-sm" onclick="confirmSettlePeriod()">Confirm &amp; Settle</button>
                  </div>
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }

      if (panel === "sites") {
        const editSiteObj = state.editingSiteName
          ? state.sites.find(s => s["Site Name"] === state.editingSiteName)
          : null;
        const showForm = state.adminAddFormOpen || Boolean(editSiteObj);

        return `
          <div class="card">
            <div class="card-title">
              <span>Sites</span>
              <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen = !state.adminAddFormOpen; state.editingSiteName = null; render();">
                ${showForm ? "Close" : "+ Add Site"}
              </button>
            </div>

            ${showForm ? `
              <form onsubmit="submitAddSite(event)" style="margin-bottom:14px;">
                <div class="form-grid">
                  <div class="field"><label>Site Name</label><input type="text" id="newSiteName" value="${editSiteObj ? editSiteObj["Site Name"] : ""}" placeholder="Enter Site Name" required /></div>
                  <div class="field"><label>Location</label><input type="text" id="newSiteLoc" value="${editSiteObj ? (editSiteObj.Location || "") : ""}" placeholder="Enter Location" /></div>
                  <div class="field">
                    <label>Status</label>
                    <select id="newSiteStatus">
                      <option value="Active" ${!editSiteObj || String(editSiteObj.Status).toLowerCase() !== "completed" ? "selected" : ""}>Active</option>
                      <option value="Completed" ${editSiteObj && String(editSiteObj.Status).toLowerCase() === "completed" ? "selected" : ""}>Completed</option>
                    </select>
                  </div>
                </div>
                <div class="form-actions">
                  <button type="submit" class="btn-primary">${editSiteObj ? "Update Site" : "Save Site"}</button>
                </div>
              </form>
            ` : ""}

            <div class="table-wrap">
              <table>
                <thead><tr><th>Site Name</th><th>Location</th><th>Status</th><th>Action</th></tr></thead>
                <tbody>
                  ${state.sites.map(s => {
                    const name = s["Site Name"];
                    const status = String(s.Status || "Active").toLowerCase() === "completed" ? "Completed" : "Active";
                    const isComp = status === "Completed";
                    return `
                      <tr>
                        <td><strong>${name}</strong></td>
                        <td>${s.Location || "-"}</td>
                        <td><span class="badge-status ${isComp ? "badge-completed" : "badge-active"}">${status}</span></td>
                        <td>
                          <div class="pb-actions">
                            <button type="button" class="btn-secondary btn-sm" onclick="startEditSite('${name.replace(/'/g, "\\'")}')">Edit</button>
                            <button type="button" class="btn-danger btn-sm" onclick="deleteSite('${name.replace(/'/g, "\\'")}')">Del</button>
                          </div>
                        </td>
                      </tr>
                    `;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      return "";
    }

    function renderSummaryView() {
      if (!isAdmin()) {
        const engName = state.currentUser.user;

        const myFunds = state.funds.filter(f =>
          f.Engineer === engName &&
          !isSettledFlag(f.Settled) &&
          !isRecordBeforeSettlement(engName, f.Date, f.RecordId)
        );
        const myExp = state.expenses.filter(e =>
          e.Engineer === engName &&
          !isSettledFlag(e.Settled) &&
          !isRecordBeforeSettlement(engName, e.Date, e.RecordId)
        );

        const carryItem = myFunds.find(f => f.Mode === "Carry Balance");
        const fSum = myFunds.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const eSum = myExp.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const balVal = fSum - eSum;

        return `
          <div class="summary-grid-3">
            <div class="stat-box highlight-soft">
              <div class="stat-label">${carryItem ? "Carry Balance" : "Fund Received"}</div>
              <div class="stat-val c-green">${formatINR(fSum)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Expense</div>
              <div class="stat-val c-red">${formatINR(eSum)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Balance</div>
              <div class="stat-val c-ink">${formatINR(balVal)}</div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Balance / Fund Details (${engName})</div>
            ${myFunds.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>Mode</th><th>Amount</th></tr></thead>
                  <tbody>
                    ${myFunds.map(f => `
                      <tr>
                        <td>${toLocalDateStr(f.Date)}</td>
                        <td>${f.Mode || "Online"}</td>
                        <td class="c-green"><strong>${formatINR(f.Amount)}</strong></td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No active balance entries.</div>`}
          </div>
        `;
      }

      const totalClientReceived = state.clientPayments.reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0);
      const totalSiteExpense = state.expenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const siteBalance = totalClientReceived - totalSiteExpense;
      const totalSelfExpense = state.selfExpenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const netBalance = siteBalance - totalSelfExpense;

      const totalEngineerFund = state.funds
        .filter(f => !isSettledFlag(f.Settled))
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);

      const activeSiteNames = getActiveSiteNames();
      const allSiteNames = getAllSiteNames();

      return `
        <div class="summary-grid-5">
          <div class="stat-box highlight-soft clickable ${state.adminDetailPanel === "client" ? "selected-box" : ""}" onclick="toggleAdminPanel('client')">
            <div class="stat-label">Client Received</div>
            <div class="stat-val c-green">${formatINR(totalClientReceived)}</div>
            <div class="stat-hint">Tap for details</div>
          </div>
          <div class="stat-box clickable ${state.adminDetailPanel === "siteExpense" ? "selected-box" : ""}" onclick="toggleAdminPanel('siteExpense')">
            <div class="stat-label">Site Expense</div>
            <div class="stat-val c-red">${formatINR(totalSiteExpense)}</div>
            <div class="stat-hint">Tap for details</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Balance</div>
            <div class="stat-val c-ink">${formatINR(siteBalance)}</div>
            <div class="stat-hint">Client - Site Exp</div>
          </div>
          <div class="stat-box clickable ${state.adminDetailPanel === "selfExpense" ? "selected-box" : ""}" onclick="toggleAdminPanel('selfExpense')">
            <div class="stat-label">Self Expense</div>
            <div class="stat-val c-red">${formatINR(totalSelfExpense)}</div>
            <div class="stat-hint">Tap for details</div>
          </div>
          <div class="stat-box highlight-soft">
            <div class="stat-label">Net Balance</div>
            <div class="stat-val c-ink">${formatINR(netBalance)}</div>
            <div class="stat-hint">Balance - Self Exp</div>
          </div>
        </div>

        <div class="admin-blocks-grid">
          <div class="stat-box clickable ${state.adminDetailPanel === "engineerFund" ? "selected-box" : ""}" onclick="toggleAdminPanel('engineerFund')">
            <div class="stat-label">Engineer Fund</div>
            <div class="stat-val c-green">${formatINR(totalEngineerFund)}</div>
            <div class="stat-hint">Tap for breakdown &amp; settle</div>
          </div>
          <div class="stat-box clickable ${state.adminDetailPanel === "sites" ? "selected-box" : ""}" onclick="toggleAdminPanel('sites')">
            <div class="stat-label">Sites</div>
            <div class="stat-val c-ink">${activeSiteNames.length} Active / ${allSiteNames.length} Total</div>
            <div class="stat-hint">Tap to Add / Edit / Delete</div>
          </div>
        </div>

        ${renderAdminDetailSection(activeSiteNames, allSiteNames)}
      `;
    }

    function syncGst() {
      const base = Number(document.getElementById("cpBase")?.value) || 0;
      const pct = Number(document.getElementById("cpGstPct")?.value) || 0;
      const totalEl = document.getElementById("cpTotal");
      if (totalEl) totalEl.value = (base + (base * pct) / 100).toFixed(2);
    }

    async function submitClientPayment(ev) {
      ev.preventDefault();
      const existing = state.editingClientPaymentId
        ? state.clientPayments.find(c => c.RecordId === state.editingClientPaymentId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("CP_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("cpDate").value),
        Site: document.getElementById("cpSite").value,
        "Base Amount": Number(document.getElementById("cpBase").value) || 0,
        "Gst%": Number(document.getElementById("cpGstPct").value) || 0,
        TotalAmount: Number(document.getElementById("cpTotal").value) || 0,
        PaymentMode: document.getElementById("cpMode").value,
        ReferenceNo: document.getElementById("cpRef").value.trim(),
        Remarks: document.getElementById("cpRemarks").value.trim()
      };

      if (existing) {
        const idx = state.clientPayments.findIndex(c => c.RecordId === existing.RecordId);
        if (idx > -1) state.clientPayments[idx] = rec;
        state.editingClientPaymentId = null;
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "updateClientPayment", record: rec });
      } else {
        state.clientPayments.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "addClientPayment", record: rec });
      }
    }

    async function deleteClientPayment(recordId) {
      if (!isAdmin()) return;
      state.clientPayments = state.clientPayments.filter(c => c.RecordId !== recordId);
      render();
      await postAction({ action: "deleteClientPayment", RecordId: recordId });
    }

    function startEditSite(siteName) {
      state.editingSiteName = siteName;
      state.adminAddFormOpen = true;
      render();
    }

    async function deleteSite(siteName) {
      if (!isAdmin()) return;
      state.sites = state.sites.filter(s => s["Site Name"] !== siteName);
      if (state.editingSiteName === siteName) state.editingSiteName = null;
      render();
      await postAction({ action: "deleteSite", siteName });
    }

    async function submitAddSite(ev) {
      ev.preventDefault();
      const name = document.getElementById("newSiteName").value.trim();
      const loc = document.getElementById("newSiteLoc").value.trim();
      const status = document.getElementById("newSiteStatus").value;
      if (!name) return;

      const rec = { "Site Name": name, Location: loc, Status: status };
      if (state.editingSiteName) {
        const prevIdx = state.sites.findIndex(s => s["Site Name"] === state.editingSiteName);
        if (prevIdx > -1) state.sites[prevIdx] = rec;
        state.editingSiteName = null;
      } else {
        const idx = state.sites.findIndex(s => s["Site Name"].toLowerCase() === name.toLowerCase());
        if (idx > -1) state.sites[idx] = rec;
        else state.sites.push(rec);
      }

      state.adminAddFormOpen = false;
      render();
      await postAction({ action: "addSite", record: rec });
    }

    async function submitSelfExpense(ev) {
      ev.preventDefault();
      const existing = state.editingSelfExpenseId
        ? state.selfExpenses.find(s => s.RecordId === state.editingSelfExpenseId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("SE_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("seDate").value),
        For: document.getElementById("seFor").value,
        Description: document.getElementById("seDesc").value.trim(),
        Amount: Number(document.getElementById("seAmt").value) || 0
      };

      if (existing) {
        const idx = state.selfExpenses.findIndex(s => s.RecordId === existing.RecordId);
        if (idx > -1) state.selfExpenses[idx] = rec;
        state.editingSelfExpenseId = null;
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "updateSelfExpense", record: rec });
      } else {
        state.selfExpenses.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "addSelfExpense", record: rec });
      }
    }

    async function deleteSelfExpense(recordId) {
      if (!isAdmin()) return;
      state.selfExpenses = state.selfExpenses.filter(s => s.RecordId !== recordId);
      render();
      await postAction({ action: "deleteSelfExpense", RecordId: recordId });
    }

    async function submitEngineerFund(ev) {
      ev.preventDefault();
      const existing = state.editingFundId
        ? state.funds.find(f => f.RecordId === state.editingFundId)
        : null;

      const rec = {
        RecordId: existing ? existing.RecordId : ("FND_" + Date.now()),
        Date: toLocalDateStr(document.getElementById("efDate").value),
        Engineer: document.getElementById("efEng").value,
        Amount: Number(document.getElementById("efAmt").value) || 0,
        Mode: document.getElementById("efMode").value,
        Settled: existing ? isSettledFlag(existing.Settled) : false
      };

      if (existing) {
        const idx = state.funds.findIndex(f => f.RecordId === existing.RecordId);
        if (idx > -1) state.funds[idx] = rec;
        state.editingFundId = null;
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "updateFund", record: rec });
      } else {
        state.funds.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await postAction({ action: "addFund", record: rec });
      }
    }

    async function deleteFund(recordId) {
      if (!isAdmin()) return;
      state.funds = state.funds.filter(f => f.RecordId !== recordId);
      render();
      await postAction({ action: "deleteFund", RecordId: recordId });
    }

    function previewSettlePeriod(ev) {
      ev.preventDefault();
      const eng = document.getElementById("spEng").value;
      const upTo = toLocalDateStr(document.getElementById("spDate").value);
      const fSum = state.funds
        .filter(f => f.Engineer === eng && !isSettledFlag(f.Settled) && toLocalDateStr(f.Date) <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const eSum = state.expenses
        .filter(e => e.Engineer === eng && !isSettledFlag(e.Settled) && toLocalDateStr(e.Date) <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      state.settlePreview = { eng, upTo, fSum, eSum, carry: fSum - eSum };
      render();
    }

    async function confirmSettlePeriod() {
      if (!state.settlePreview) return;
      const { eng, upTo, carry } = state.settlePreview;

      state.funds.forEach(f => {
        if (f.Engineer === eng && !isSettledFlag(f.Settled) && toLocalDateStr(f.Date) <= upTo) f.Settled = true;
      });
      state.expenses.forEach(e => {
        if (e.Engineer === eng && !isSettledFlag(e.Settled) && toLocalDateStr(e.Date) <= upTo) e.Settled = true;
      });

      const prevSettledDate = state.settledUntilByEng[eng];
      if (!prevSettledDate || upTo > prevSettledDate) {
        state.settledUntilByEng[eng] = upTo;
      }

      const carryRec = {
        RecordId: "CF_" + Date.now(),
        Date: todayISO(),
        Engineer: eng,
        Amount: carry,
        Mode: "Carry Balance",
        Settled: false
      };
      state.funds.unshift(carryRec);

      state.settlePreview = null;
      render();
      await postAction({ action: "settlePeriod", engineer: eng, upToDate: upTo, carryForward: carry, carryRecord: carryRec });
    }

    function render() {
      renderBottomNav();
      const container = document.getElementById("viewContainer");
      if (state.activeTab === "summary") {
        container.innerHTML = renderSummaryView();
      } else {
        container.innerHTML = renderExpensesView();
      }
    }

    restoreCache();

    setInterval(() => {
      if (state.currentUser && document.visibilityState === "visible" && !isUserInteractingWithFormOrDropdown()) {
        loadAllData(false);
      }
    }, 4000);

    (function initSession() {
      const saved = sessionStorage.getItem("NA_SESSION");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.user && parsed.role) {
            state.currentUser = parsed;
            showAppShell();
            loadAllData(false);
            return;
          }
        } catch (_) {}
      }
      loadAllData(false);
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natural Associates - Site Expense Tracker</title>
  <style>
    :root {
      --bg: #f3f5f4;
      --card: #ffffff;
      --ink: #16201b;
      --muted: #5d6b63;
      --primary: #146c43;
      --primary-dark: #0e4f31;
      --primary-soft: #e6f4ed;
      --danger: #c92a2a;
      --danger-soft: #fff0f0;
      --border: #dfe5e1;
      --shadow: 0 2px 10px rgba(22, 32, 27, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 92px;
      line-height: 1.4;
    }

    .topbar {
      background: var(--primary-dark);
      color: #fff;
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }

    .topbar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .brand-sub {
      font-size: 11px;
      color: #c8e6d7;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select, input, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
    }

    input[readonly] {
      background: #f5f7f6;
      color: #3f4d45;
      font-weight: 600;
    }

    .topbar select {
      width: auto;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 13px;
      transition: transform 0.05s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-refresh {
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-secondary {
      background: #eef2f0;
      color: var(--ink);
    }

    .btn-sm {
      padding: 5px 9px;
      font-size: 12px;
    }

    .main-tabs {
      max-width: 960px;
      margin: 10px auto 0;
      padding: 0 12px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .tab-btn {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .container {
      max-width: 960px;
      margin: 12px auto 0;
      padding: 0 12px;
    }

    .status-banner {
      display: none;
      padding: 9px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-banner.info {
      display: block;
      background: var(--primary-soft);
      color: var(--primary-dark);
      border: 1px solid #b9decb;
    }

    .status-banner.warn {
      display: block;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #f5c2c2;
    }

    .center-action-wrap {
      display: flex;
      justify-content: center;
      margin: 10px 0 14px;
    }

    .btn-center-expense {
      background: var(--danger);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 11px 28px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(201, 42, 42, 0.25);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pill-chip {
      background: #f1f5f3;
      color: var(--ink);
      border: 1px solid #cfd9d3;
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .pill-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .date-group-header {
      background: #e9efec;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      margin: 12px 0 6px;
      display: flex;
      justify-content: space-between;
    }

    .passbook-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .pb-left {
      min-width: 0;
      flex: 1;
    }

    .pb-site {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .pb-desc {
      font-size: 13px;
      color: var(--ink);
      margin-top: 2px;
      word-break: break-word;
    }

    .pb-meta {
      font-size: 11px;
      color: #5d6b63;
      margin-top: 3px;
    }

    .pb-right {
      text-align: right;
      flex-shrink: 0;
    }

    .pb-amt-expense {
      font-size: 15px;
      font-weight: 700;
      color: var(--danger);
    }

    .pb-bal {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      font-weight: 600;
    }

    .pb-actions {
      margin-top: 5px;
      display: flex;
      gap: 5px;
      justify-content: flex-end;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      margin-top: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      background: #f7faf8;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .confirm-box {
      background: #fff8e6;
      border: 1px solid #f0c36d;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .bottom-summary {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 2px solid var(--primary);
      box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.08);
      z-index: 40;
    }

    .bottom-summary-inner {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
    }

    .bs-col {
      padding: 8px 6px;
      border-right: 1px solid var(--border);
    }

    .bs-col:last-child {
      border-right: none;
    }

    .bs-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .bs-amount {
      font-size: 15px;
      font-weight: 800;
      margin-top: 2px;
    }

    .c-green { color: var(--primary); }
    .c-red { color: var(--danger); }
    .c-ink { color: var(--ink); }

    @media print {
      .topbar, .main-tabs, .center-action-wrap, .bottom-summary, .no-print {
        display: none !important;
      }
      body {
        background: #fff;
        padding-bottom: 0;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <div class="brand-title">Natural Associates</div>
        <div class="brand-sub">இயற்கை அசோசியேட்ஸ் • Site Expense &amp; Fund Tracker</div>
      </div>
      <div class="user-controls">
        <select id="roleSelect" onchange="onRoleChange()">
          <option value="ADMIN">Admin</option>
          <option value="MANIGANDAN">MANIGANDAN</option>
          <option value="Sivashankar">Sivashankar</option>
          <option value="Yogesh">Yogesh</option>
          <option value="Senthil">Senthil</option>
        </select>
        <button class="btn-refresh btn-sm" onclick="loadAllData(true)">Sync</button>
      </div>
    </div>
  </header>

  <nav class="main-tabs" id="mainTabs"></nav>

  <main class="container">
    <div id="statusBanner" class="status-banner"></div>
    <section id="viewContainer"></section>
  </main>

  <footer class="bottom-summary">
    <div class="bottom-summary-inner">
      <div class="bs-col">
        <div class="bs-title" id="barReceivedLabel">Total In</div>
        <div class="bs-amount c-green" id="barReceived">₹0</div>
      </div>
      <div class="bs-col">
        <div class="bs-title">Expense</div>
        <div class="bs-amount c-red" id="barExpense">₹0</div>
      </div>
      <div class="bs-col">
        <div class="bs-title">Balance</div>
        <div class="bs-amount c-ink" id="barBalance">₹0</div>
      </div>
    </div>
  </footer>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgrEAoJfYOUEBCtOzJ3938s-81eHi8LDwSiQDxSiVqEg8N2Wcc-pagsmxWLfdbjZO80A/exec";

    const ENGINEERS = ["Sivashankar", "Yogesh", "Senthil", "MANIGANDAN"];
    const CATEGORIES = [
      "Material",
      "Masonry",
      "Centring",
      "Electrician",
      "Plumber",
      "Painter",
      "Tiles Layer",
      "Carpenter",
      "Fabricator",
      "Polish",
      "Granite layer"
    ];
    const DEFAULT_SITES = [
      "Madhuravoyal",
      "Sithalapakam",
      "Oragadam",
      "Sunguvachathiram",
      "Plot-6A"
    ];
    const DEFAULT_UNITS = [
      "Nos", "Kg", "Tons", "Cft", "Ltr", "Load", "Bags", "Day", "NMR", "Bundle", "Advance", "Transport", "W-Payment"
    ];

    const state = {
      role: "ADMIN",
      activeTab: "expenses",
      adminSetupTab: "Client Payment",
      showExpenseForm: false,
      editingExpenseId: null,
      settlePreview: null,
      expenses: [],
      funds: [],
      clientPayments: [],
      selfExpenses: [],
      sites: DEFAULT_SITES.map(s => ({ "Site Name": s, Location: "", Status: "Active" })),
      units: [...DEFAULT_UNITS],
      filters: {
        engineer: "",
        site: "",
        category: "",
        vendor: "",
        description: "",
        fromDate: "",
        toDate: ""
      }
    };

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function formatINR(num) {
      const n = Number(num) || 0;
      return "₹" + n.toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    function formatDateHeading(dateStr) {
      if (!dateStr) return "Unscheduled Date";
      const clean = String(dateStr).slice(0, 10);
      const dt = new Date(clean + "T00:00:00");
      if (isNaN(dt.getTime())) return clean;
      return dt.toLocaleDateString("en-GB", {
        weekday: "short",
        day: "2-digit",
        month: "short",
        year: "numeric"
      });
    }

    function isSettledFlag(val) {
      return val === true || String(val).trim().toUpperCase() === "TRUE";
    }

    function setBanner(msg, type = "info") {
      const el = document.getElementById("statusBanner");
      if (!msg) {
        el.className = "status-banner";
        el.textContent = "";
        return;
      }
      el.className = `status-banner ${type}`;
      el.textContent = msg;
    }

    function getSiteNames() {
      const activeSites = state.sites
        .filter(s => String(s.Status || "Active").toLowerCase() !== "closed")
        .map(s => String(s["Site Name"] || "").trim())
        .filter(Boolean);
      return activeSites.length ? activeSites : [...DEFAULT_SITES];
    }

    function normalizeExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => {
        const qty = Number(r.Qty ?? r.qty ?? 1) || 1;
        const rate = Number(r.Rate ?? r.rate ?? 0) || 0;
        const amt = Number(r.Amount ?? r.amount ?? (qty * rate)) || 0;
        return {
          RecordId: String(r.RecordId || r.id || `EXP_${i + 1}`),
          Date: String(r.Date || r.date || todayISO()).slice(0, 10),
          Engineer: String(r.Engineer || r.engineer || "MANIGANDAN"),
          Site: String(r.Site || r.site || DEFAULT_SITES[0]),
          Category: String(r.Category || r.category || "Material"),
          "Vendor/Contractor": String(r["Vendor/Contractor"] || r.vendor || ""),
          Description: String(r.Description || r.description || ""),
          Qty: qty,
          Unit: String(r.Unit || r.unit || "Nos"),
          Rate: rate,
          Amount: amt,
          Settled: isSettledFlag(r.Settled ?? r.settled)
        };
      });
    }

    function normalizeFunds(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => ({
        RecordId: String(r.RecordId || r.id || `FND_${i + 1}`),
        Date: String(r.Date || r.date || todayISO()).slice(0, 10),
        Engineer: String(r.Engineer || r.engineer || "MANIGANDAN"),
        Amount: Number(r.Amount ?? r.amount ?? 0) || 0,
        Mode: String(r.Mode || r.mode || "Online"),
        Settled: isSettledFlag(r.Settled ?? r.settled)
      }));
    }

    function normalizeClientPayments(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => ({
        RecordId: String(r.RecordId || r.id || `CP_${i + 1}`),
        Date: String(r.Date || r.date || todayISO()).slice(0, 10),
        Site: String(r.Site || r.site || DEFAULT_SITES[0]),
        "Base Amount": Number(r["Base Amount"] ?? r.baseAmount ?? 0) || 0,
        "Gst%": Number(r["Gst%"] ?? r.gstPct ?? 0) || 0,
        TotalAmount: Number(r.TotalAmount ?? r["Total Amount"] ?? r.amount ?? 0) || 0,
        PaymentMode: String(r.PaymentMode || r.paymentMode || ""),
        ReferenceNo: String(r.ReferenceNo || r.referenceNo || ""),
        Remarks: String(r.Remarks || r.remarks || "")
      }));
    }

    function normalizeSelfExpenses(list) {
      if (!Array.isArray(list)) return [];
      return list.map((r, i) => ({
        RecordId: String(r.RecordId || r.id || `SE_${i + 1}`),
        Date: String(r.Date || r.date || todayISO()).slice(0, 10),
        For: String(r.For || r.for || "Office"),
        Description: String(r.Description || r.description || ""),
        Amount: Number(r.Amount ?? r.amount ?? 0) || 0
      }));
    }

    async function loadAllData(showMessage = false) {
      if (showMessage) setBanner("Syncing with Google Sheet...", "info");
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAll`, { method: "GET" });
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();

        if (Array.isArray(data.expenses)) state.expenses = normalizeExpenses(data.expenses);
        if (Array.isArray(data.funds)) state.funds = normalizeFunds(data.funds);
        if (Array.isArray(data.clientPayments)) state.clientPayments = normalizeClientPayments(data.clientPayments);
        if (Array.isArray(data.selfExpenses)) state.selfExpenses = normalizeSelfExpenses(data.selfExpenses);

        if (Array.isArray(data.sites) && data.sites.length) {
          const map = new Map();
          state.sites.forEach(s => map.set(s["Site Name"], s));
          data.sites.forEach(s => {
            const name = typeof s === "string" ? s.trim() : String(s["Site Name"] || "").trim();
            if (name) {
              map.set(name, {
                "Site Name": name,
                Location: typeof s === "object" ? String(s.Location || "") : "",
                Status: typeof s === "object" ? String(s.Status || "Active") : "Active"
              });
            }
          });
          state.sites = Array.from(map.values());
        }

        if (Array.isArray(data.units) && data.units.length) {
          const mergedUnits = new Set([...data.units, ...DEFAULT_UNITS]);
          state.units = Array.from(mergedUnits);
        }

        if (showMessage) setBanner("Synced safely with Natural Associates Tracker.", "info");
      } catch (err) {
        setBanner("Offline/Preview mode — check Apps Script Web App deployment if sheet entries do not load.", "warn");
      } finally {
        render();
      }
    }

    async function postAction(payload) {
      setBanner("Saving to Google Sheet...", "info");
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          try {
            const json = await res.json();
            if (json && json.status === "error") {
              setBanner(json.message || "Error saving record.", "warn");
              return false;
            }
          } catch (_) {}
          setBanner("Saved successfully to Google Sheet.", "info");
          return true;
        }
      } catch (_) {}
      setBanner("Saved in current screen. Verify Apps Script URL/permissions for live sheet sync.", "warn");
      return true;
    }

    function isAdmin() {
      return state.role === "ADMIN";
    }

    function isManigandan() {
      return state.role === "MANIGANDAN";
    }

    function onRoleChange() {
      state.role = document.getElementById("roleSelect").value;
      state.editingExpenseId = null;
      state.showExpenseForm = false;
      state.settlePreview = null;
      if (!isAdmin() && state.activeTab === "adminSetup") {
        state.activeTab = "expenses";
      }
      render();
    }

    function getScopedExpenses() {
      let list = [...state.expenses];
      if (!isAdmin()) {
        list = list.filter(e => e.Engineer === state.role);
      } else {
        if (state.filters.engineer) list = list.filter(e => e.Engineer === state.filters.engineer);
      }
      if (state.filters.site) list = list.filter(e => e.Site === state.filters.site);
      if (state.filters.category) list = list.filter(e => e.Category === state.filters.category);
      if (state.filters.vendor.trim()) {
        const vq = state.filters.vendor.trim().toLowerCase();
        list = list.filter(e => String(e["Vendor/Contractor"] || "").toLowerCase().includes(vq));
      }
      if (state.filters.description.trim()) {
        const dq = state.filters.description.trim().toLowerCase();
        list = list.filter(e => String(e.Description || "").toLowerCase().includes(dq));
      }
      if (state.filters.fromDate) list = list.filter(e => e.Date >= state.filters.fromDate);
      if (state.filters.toDate) list = list.filter(e => e.Date <= state.filters.toDate);
      return list;
    }

    function computeBottomBar() {
      const labelEl = document.getElementById("barReceivedLabel");
      let received = 0;
      let expense = 0;

      if (isAdmin()) {
        labelEl.textContent = "Total In";
        const clientTotal = state.clientPayments.reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0);
        const fundTotal = state.funds.filter(f => !f.Settled).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        received = clientTotal > 0 ? clientTotal : fundTotal;

        const siteExp = state.expenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const selfExp = state.selfExpenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        expense = siteExp + selfExp;
      } else {
        labelEl.textContent = "Fund In";
        received = state.funds
          .filter(f => f.Engineer === state.role && !f.Settled)
          .reduce((s, r) => s + (Number(r.Amount) || 0), 0);

        expense = state.expenses
          .filter(e => e.Engineer === state.role && !e.Settled)
          .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      }

      document.getElementById("barReceived").textContent = formatINR(received);
      document.getElementById("barExpense").textContent = formatINR(expense);
      document.getElementById("barBalance").textContent = formatINR(received - expense);
    }

    function renderTabs() {
      const tabs = [
        { id: "expenses", label: "Expenses" },
        { id: "summary", label: "Summary" }
      ];
      if (isAdmin()) {
        tabs.push({ id: "adminSetup", label: "Admin Setup" });
      }
      if (!tabs.some(t => t.id === state.activeTab)) {
        state.activeTab = "expenses";
      }

      document.getElementById("mainTabs").innerHTML = tabs
        .map(t => `<button class="tab-btn ${state.activeTab === t.id ? "active" : ""}" onclick="switchTab('${t.id}')">${t.label}</button>`)
        .join("");
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      state.editingExpenseId = null;
      state.settlePreview = null;
      render();
    }

    function openExpenseForm(recordId = null) {
      state.editingExpenseId = recordId;
      state.showExpenseForm = true;
      render();
    }

    function closeExpenseForm() {
      state.editingExpenseId = null;
      state.showExpenseForm = false;
      render();
    }

    function calcExpenseAmount() {
      const qty = Number(document.getElementById("expQty")?.value) || 0;
      const rate = Number(document.getElementById("expRate")?.value) || 0;
      const amtEl = document.getElementById("expAmount");
      if (amtEl && qty > 0 && rate > 0) {
        amtEl.value = (qty * rate).toFixed(2);
      }
    }

    async function saveExpense(ev) {
      ev.preventDefault();
      const date = document.getElementById("expDate").value || todayISO();
      const engineer = isAdmin()
        ? (document.getElementById("expEngineer").value || "MANIGANDAN")
        : state.role;
      const site = document.getElementById("expSite").value;
      const category = (isAdmin() || isManigandan())
        ? document.getElementById("expCategory").value
        : "Material";
      const vendor = document.getElementById("expVendor").value.trim();
      const description = document.getElementById("expDesc").value.trim();
      const qty = Number(document.getElementById("expQty").value) || 1;
      const unit = document.getElementById("expUnit").value || "Nos";
      const rate = Number(document.getElementById("expRate").value) || 0;
      const amount = Number(document.getElementById("expAmount").value) || (qty * rate);

      if (!description || amount <= 0) {
        setBanner("Please enter Description and valid Amount.", "warn");
        return;
      }

      if (state.editingExpenseId) {
        const idx = state.expenses.findIndex(e => e.RecordId === state.editingExpenseId);
        if (idx > -1) {
          const updated = {
            ...state.expenses[idx],
            Date: date,
            Engineer: engineer,
            Site: site,
            Category: category,
            "Vendor/Contractor": vendor,
            Description: description,
            Qty: qty,
            Unit: unit,
            Rate: rate,
            Amount: amount
          };
          state.expenses[idx] = updated;
          await postAction({ action: "updateExpense", record: updated });
        }
      } else {
        const newRec = {
          RecordId: "EXP_" + Date.now(),
          Date: date,
          Engineer: engineer,
          Site: site,
          Category: category,
          "Vendor/Contractor": vendor,
          Description: description,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amount,
          Settled: false
        };
        state.expenses.unshift(newRec);
        await postAction({ action: "addExpense", record: newRec });
      }

      state.editingExpenseId = null;
      state.showExpenseForm = false;
      render();
    }

    async function deleteExpense(recordId) {
      const target = state.expenses.find(e => e.RecordId === recordId);
      if (!target) return;
      state.expenses = state.expenses.filter(e => e.RecordId !== recordId);
      await postAction({ action: "deleteExpense", RecordId: recordId });
      render();
    }

    function renderExpensesView() {
      const siteNames = getSiteNames();
      const editingObj = state.editingExpenseId
        ? state.expenses.find(e => e.RecordId === state.editingExpenseId)
        : null;

      const defaultEng = editingObj ? editingObj.Engineer : (isAdmin() ? "MANIGANDAN" : state.role);
      const defaultSite = editingObj ? editingObj.Site : (siteNames[0] || DEFAULT_SITES[0]);
      const defaultCat = editingObj ? editingObj.Category : "Material";
      const defaultDate = editingObj ? editingObj.Date : todayISO();
      const defaultVendor = editingObj ? editingObj["Vendor/Contractor"] : "";
      const defaultDesc = editingObj ? editingObj.Description : "";
      const defaultQty = editingObj ? editingObj.Qty : 1;
      const defaultUnit = editingObj ? editingObj.Unit : (state.units[0] || "Nos");
      const defaultRate = editingObj ? editingObj.Rate : "";
      const defaultAmt = editingObj ? editingObj.Amount : "";

      const showCategoryDropdown = isAdmin() || isManigandan();

      let html = `
        <div class="center-action-wrap no-print">
          <button class="btn-center-expense" onclick="openExpenseForm()">+ Expense</button>
        </div>
      `;

      if (state.showExpenseForm || editingObj) {
        html += `
          <div class="card no-print">
            <div class="card-title">${editingObj ? "Edit Expense" : "New Expense Entry"}</div>
            <form onsubmit="saveExpense(event)">
              <div class="form-grid">
                <div class="field">
                  <label>Date</label>
                  <input type="date" id="expDate" value="${defaultDate}" required />
                </div>
                ${isAdmin() ? `
                  <div class="field">
                    <label>Engineer</label>
                    <select id="expEngineer">
                      ${ENGINEERS.map(e => `<option value="${e}" ${e === defaultEng ? "selected" : ""}>${e}</option>`).join("")}
                    </select>
                  </div>
                ` : ""}
                <div class="field">
                  <label>Site</label>
                  <select id="expSite">
                    ${siteNames.map(s => `<option value="${s}" ${s === defaultSite ? "selected" : ""}>${s}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label>Category</label>
                  ${showCategoryDropdown ? `
                    <select id="expCategory">
                      ${CATEGORIES.map(c => `<option value="${c}" ${c === defaultCat ? "selected" : ""}>${c}</option>`).join("")}
                    </select>
                  ` : `
                    <input type="text" id="expCategory" value="Material" readonly />
                  `}
                </div>
                <div class="field">
                  <label>Vendor / Contractor</label>
                  <input type="text" id="expVendor" value="${defaultVendor}" placeholder="Supplier / Contractor name" />
                </div>
                <div class="field">
                  <label>Description</label>
                  <input type="text" id="expDesc" value="${defaultDesc}" placeholder="Material / work details" required />
                </div>
                <div class="field">
                  <label>Qty</label>
                  <input type="number" step="0.01" min="0.01" id="expQty" value="${defaultQty}" oninput="calcExpenseAmount()" required />
                </div>
                <div class="field">
                  <label>Unit</label>
                  <select id="expUnit">
                    ${state.units.map(u => `<option value="${u}" ${u === defaultUnit ? "selected" : ""}>${u}</option>`).join("")}
                  </select>
                </div>
                <div class="field">
                  <label>Rate (₹)</label>
                  <input type="number" step="0.01" min="0" id="expRate" value="${defaultRate}" placeholder="0" oninput="calcExpenseAmount()" required />
                </div>
                <div class="field">
                  <label>Amount (₹)</label>
                  <input type="number" step="0.01" min="0.01" id="expAmount" value="${defaultAmt}" placeholder="0" required />
                </div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeExpenseForm()">Cancel</button>
                <button type="submit" class="btn-primary">Save Expense</button>
              </div>
            </form>
          </div>
        `;
      }

      if (isAdmin()) {
        html += `
          <div class="card no-print">
            <div class="card-title">
              <span>Filters &amp; Report</span>
              <button class="btn-secondary btn-sm" onclick="window.print()">Print Report</button>
            </div>
            <div class="form-grid">
              <div class="field">
                <label>Engineer</label>
                <select onchange="state.filters.engineer = this.value; render();">
                  <option value="">All Engineers</option>
                  ${ENGINEERS.map(e => `<option value="${e}" ${state.filters.engineer === e ? "selected" : ""}>${e}</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label>Site</label>
                <select onchange="state.filters.site = this.value; render();">
                  <option value="">All Sites</option>
                  ${siteNames.map(s => `<option value="${s}" ${state.filters.site === s ? "selected" : ""}>${s}</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label>Category</label>
                <select onchange="state.filters.category = this.value; render();">
                  <option value="">All Categories</option>
                  ${CATEGORIES.map(c => `<option value="${c}" ${state.filters.category === c ? "selected" : ""}>${c}</option>`).join("")}
                </select>
              </div>
              <div class="field">
                <label>Vendor / Contractor</label>
                <input type="text" value="${state.filters.vendor}" placeholder="Search vendor..." oninput="state.filters.vendor = this.value; render();" />
              </div>
              <div class="field">
                <label>Description</label>
                <input type="text" value="${state.filters.description}" placeholder="Search description..." oninput="state.filters.description = this.value; render();" />
              </div>
              <div class="field">
                <label>From Date</label>
                <input type="date" value="${state.filters.fromDate}" onchange="state.filters.fromDate = this.value; render();" />
              </div>
              <div class="field">
                <label>To Date</label>
                <input type="date" value="${state.filters.toDate}" onchange="state.filters.toDate = this.value; render();" />
              </div>
            </div>
          </div>
        `;
      }

      const scoped = getScopedExpenses().sort((a, b) => {
        if (b.Date !== a.Date) return b.Date.localeCompare(a.Date);
        return String(b.RecordId).localeCompare(String(a.RecordId));
      });

      const totalScopedExpense = scoped.reduce((sum, item) => sum + (Number(item.Amount) || 0), 0);

      let runningBal = isAdmin()
        ? (state.clientPayments.reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0) ||
           state.funds.filter(f => !f.Settled).reduce((s, r) => s + (Number(r.Amount) || 0), 0)) -
          state.selfExpenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0)
        : state.funds
            .filter(f => f.Engineer === state.role && !f.Settled)
            .reduce((s, r) => s + (Number(r.Amount) || 0), 0);

      const chronological = [...scoped].reverse();
      const balById = {};
      for (const row of chronological) {
        if (!row.Settled) {
          runningBal -= Number(row.Amount) || 0;
        }
        balById[row.RecordId] = runningBal;
      }

      if (!scoped.length) {
        html += `<div class="card"><div class="pb-meta">No expense entries found for the selected view.</div></div>`;
        return html;
      }

      html += `<div class="card"><div class="card-title"><span>Date-wise Passbook</span><span>Total: ${formatINR(totalScopedExpense)}</span></div>`;

      let currentDate = "";
      for (const item of scoped) {
        if (item.Date !== currentDate) {
          currentDate = item.Date;
          const daySum = scoped
            .filter(x => x.Date === currentDate)
            .reduce((s, x) => s + (Number(x.Amount) || 0), 0);
          html += `
            <div class="date-group-header">
              <span>${formatDateHeading(currentDate)}</span>
              <span>${formatINR(daySum)}</span>
            </div>
          `;
        }

        const canEdit = isAdmin() || item.Engineer === state.role;
        const vendorTag = item["Vendor/Contractor"] ? ` • ${item["Vendor/Contractor"]}` : "";
        const qtyTag = `${item.Qty} ${item.Unit} × ${formatINR(item.Rate)}`;

        html += `
          <div class="passbook-item">
            <div class="pb-left">
              <div class="pb-site">${item.Site}</div>
              <div class="pb-desc">${item.Description}</div>
              <div class="pb-meta">${item.Category}${vendorTag} • ${qtyTag} • ${item.Engineer}</div>
            </div>
            <div class="pb-right">
              <div class="pb-amt-expense">${formatINR(item.Amount)}</div>
              <div class="pb-bal">Bal ${formatINR(balById[item.RecordId])}</div>
              ${canEdit ? `
                <div class="pb-actions no-print">
                  <button class="btn-secondary btn-sm" onclick="openExpenseForm('${item.RecordId}')">Edit</button>
                  <button class="btn-danger btn-sm" onclick="deleteExpense('${item.RecordId}')">Del</button>
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      return html;
    }

    function renderSummaryView() {
      if (!isAdmin()) {
        const myFunds = state.funds.filter(f => f.Engineer === state.role && !f.Settled);
        const myExp = state.expenses.filter(e => e.Engineer === state.role && !e.Settled);
        const fSum = myFunds.reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const eSum = myExp.reduce((s, r) => s + (Number(r.Amount) || 0), 0);

        return `
          <div class="summary-grid">
            <div class="stat-box">
              <div class="stat-label">Fund In</div>
              <div class="stat-val c-green">${formatINR(fSum)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Expense</div>
              <div class="stat-val c-red">${formatINR(eSum)}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Balance</div>
              <div class="stat-val c-ink">${formatINR(fSum - eSum)}</div>
            </div>
          </div>
          <div class="card">
            <div class="card-title">Active Fund Receipts</div>
            ${myFunds.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Date</th><th>Mode</th><th>Amount</th></tr></thead>
                  <tbody>
                    ${myFunds.map(f => `<tr><td>${f.Date}</td><td>${f.Mode || "Online"}</td><td class="c-green"><strong>${formatINR(f.Amount)}</strong></td></tr>`).join("")}
                  </tbody>
                </table>
              </div>
            ` : `<div class="pb-meta">No active fund records.</div>`}
          </div>
        `;
      }

      const siteNames = getSiteNames();
      const siteRows = siteNames.map(siteName => {
        const cAmt = state.clientPayments.filter(c => c.Site === siteName).reduce((s, r) => s + (Number(r.TotalAmount) || 0), 0);
        const eAmt = state.expenses.filter(e => e.Site === siteName).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        return { siteName, cAmt, eAmt, bal: cAmt - eAmt };
      });

      const engRows = ENGINEERS.map(eng => {
        const fAmt = state.funds.filter(f => f.Engineer === eng && !f.Settled).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        const eAmt = state.expenses.filter(e => e.Engineer === eng && !e.Settled).reduce((s, r) => s + (Number(r.Amount) || 0), 0);
        return { eng, fAmt, eAmt, bal: fAmt - eAmt };
      });

      const selfTotal = state.selfExpenses.reduce((s, r) => s + (Number(r.Amount) || 0), 0);

      return `
        <div class="card">
          <div class="card-title">Site-wise Overall Summary</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Site</th><th>Client Received</th><th>Site Expense</th><th>Balance</th></tr></thead>
              <tbody>
                ${siteRows.map(r => `
                  <tr>
                    <td><strong>${r.siteName}</strong></td>
                    <td class="c-green">${formatINR(r.cAmt)}</td>
                    <td class="c-red">${formatINR(r.eAmt)}</td>
                    <td><strong>${formatINR(r.bal)}</strong></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Engineer Fund Summary (Active)</div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Engineer</th><th>Fund Given</th><th>Spent</th><th>Balance</th></tr></thead>
              <tbody>
                ${engRows.map(r => `
                  <tr>
                    <td><strong>${r.eng}</strong></td>
                    <td class="c-green">${formatINR(r.fAmt)}</td>
                    <td class="c-red">${formatINR(r.eAmt)}</td>
                    <td><strong>${formatINR(r.bal)}</strong></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Self Expense Total</div>
          <div class="stat-val c-red">${formatINR(selfTotal)}</div>
        </div>
      `;
    }

    function syncGst() {
      const base = Number(document.getElementById("cpBase")?.value) || 0;
      const pct = Number(document.getElementById("cpGstPct")?.value) || 0;
      const totalEl = document.getElementById("cpTotal");
      if (totalEl) totalEl.value = (base + (base * pct) / 100).toFixed(2);
    }

    async function submitClientPayment(ev) {
      ev.preventDefault();
      const rec = {
        RecordId: "CP_" + Date.now(),
        Date: document.getElementById("cpDate").value,
        Site: document.getElementById("cpSite").value,
        "Base Amount": Number(document.getElementById("cpBase").value) || 0,
        "Gst%": Number(document.getElementById("cpGstPct").value) || 0,
        TotalAmount: Number(document.getElementById("cpTotal").value) || 0,
        PaymentMode: document.getElementById("cpMode").value,
        ReferenceNo: document.getElementById("cpRef").value.trim(),
        Remarks: document.getElementById("cpRemarks").value.trim()
      };
      state.clientPayments.unshift(rec);
      await postAction({ action: "addClientPayment", record: rec });
      render();
    }

    async function submitAddSite(ev) {
      ev.preventDefault();
      const name = document.getElementById("newSiteName").value.trim();
      const loc = document.getElementById("newSiteLoc").value.trim();
      const status = document.getElementById("newSiteStatus").value;
      if (!name) return;

      const rec = { "Site Name": name, Location: loc, Status: status };
      if (!state.sites.some(s => s["Site Name"].toLowerCase() === name.toLowerCase())) {
        state.sites.push(rec);
      }
      await postAction({ action: "addSite", record: rec });
      document.getElementById("newSiteName").value = "";
      document.getElementById("newSiteLoc").value = "";
      render();
    }

    async function submitSelfExpense(ev) {
      ev.preventDefault();
      const rec = {
        RecordId: "SE_" + Date.now(),
        Date: document.getElementById("seDate").value,
        For: document.getElementById("seFor").value,
        Description: document.getElementById("seDesc").value.trim(),
        Amount: Number(document.getElementById("seAmt").value) || 0
      };
      state.selfExpenses.unshift(rec);
      await postAction({ action: "addSelfExpense", record: rec });
      render();
    }

    async function submitEngineerFund(ev) {
      ev.preventDefault();
      const rec = {
        RecordId: "FND_" + Date.now(),
        Date: document.getElementById("efDate").value,
        Engineer: document.getElementById("efEng").value,
        Amount: Number(document.getElementById("efAmt").value) || 0,
        Mode: document.getElementById("efMode").value,
        Settled: false
      };
      state.funds.unshift(rec);
      await postAction({ action: "addFund", record: rec });
      render();
    }

    function previewSettlePeriod(ev) {
      ev.preventDefault();
      const eng = document.getElementById("spEng").value;
      const upTo = document.getElementById("spDate").value;
      const fSum = state.funds
        .filter(f => f.Engineer === eng && !f.Settled && f.Date <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      const eSum = state.expenses
        .filter(e => e.Engineer === eng && !e.Settled && e.Date <= upTo)
        .reduce((s, r) => s + (Number(r.Amount) || 0), 0);
      state.settlePreview = { eng, upTo, fSum, eSum, carry: fSum - eSum };
      render();
    }

    async function confirmSettlePeriod() {
      if (!state.settlePreview) return;
      const { eng, upTo, carry } = state.settlePreview;

      state.funds.forEach(f => {
        if (f.Engineer === eng && !f.Settled && f.Date <= upTo) f.Settled = true;
      });
      state.expenses.forEach(e => {
        if (e.Engineer === eng && !e.Settled && e.Date <= upTo) e.Settled = true;
      });

      if (carry > 0) {
        state.funds.unshift({
          RecordId: "CF_" + Date.now(),
          Date: todayISO(),
          Engineer: eng,
          Amount: carry,
          Mode: "Carry Forward",
          Settled: false
        });
      }

      state.settlePreview = null;
      await postAction({ action: "settlePeriod", engineer: eng, upToDate: upTo, carryForward: carry });
      render();
    }

    function render() {
      renderTabs();
      const container = document.getElementById("viewContainer");
      if (state.activeTab === "summary") {
        container.innerHTML = renderSummaryView();
      } else if (state.activeTab === "adminSetup" && isAdmin()) {
        container.innerHTML = renderAdminSetupView();
      } else {
        container.innerHTML = renderExpensesView();
      }
      computeBottomBar();
    }

    render();
    loadAllData(false);
  </script>
</body>
</html>

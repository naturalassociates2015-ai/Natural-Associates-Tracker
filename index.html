<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Natural Associates - Site Expense Tracker</title>
  <link rel="icon" type="image/png" href="icon-192.png" />
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #18221d;
      --muted: #5c6b63;
      --header-bg: #1e293b;
      --header-ink: #ffffff;
      --accent: #1b5e3a;
      --accent-soft: #eef5f1;
      --accent-border: #d3e3da;
      --terracotta: #c84b31;
      --terracotta-dark: #a83a22;
      --terracotta-soft: #fdf2ef;
      --amber-soft: #fbf6e9;
      --border: #dfe5e2;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--ink); padding-bottom: 96px; line-height: 1.45; min-height: 100vh; }

    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: 18px; padding: 28px 22px; border: 1px solid var(--border); box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08); text-align: center; }
    .login-emblem { width: 48px; height: 48px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; border: 1px solid var(--accent-border); overflow: hidden; }
    .login-emblem img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .login-brand { font-size: 21px; font-weight: 800; color: var(--ink); margin-bottom: 20px; }
    .login-field { margin-bottom: 14px; text-align: left; }
    .login-user-select { text-align: center; text-align-last: center; font-size: 18px; font-weight: 800; padding: 12px 14px; background: #f8faf9; border: 1.5px solid var(--border); border-radius: 11px; }
    .pin-input { text-align: center; font-size: 18px; font-weight: 700; letter-spacing: 6px; padding: 11px 38px 11px 14px; }
    .pw-wrap { position: relative; display: flex; align-items: center; }
    .pw-toggle { position: absolute; right: 8px; background: transparent; color: var(--muted); padding: 4px 6px; font-size: 12px; }
    .btn-login { width: 100%; padding: 12px; font-size: 15px; font-weight: 700; background: var(--header-bg); color: #fff; border-radius: 10px; margin-top: 4px; }
    .login-error { color: var(--terracotta); background: var(--terracotta-soft); border: 1px solid #f2c4ba; padding: 9px 11px; border-radius: 9px; font-size: 12.5px; margin-bottom: 14px; display: none; text-align: left; }

    .app-shell { display: none; }
    .topbar { background: var(--header-bg); color: var(--header-ink); padding: 12px 16px; position: sticky; top: 0; z-index: 30; box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12); }
    .topbar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .menu-toggle-btn { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.22); width: 34px; height: 34px; padding: 0; font-size: 18px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .brand-leaf { width: 32px; height: 32px; border-radius: 9px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .brand-leaf img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .brand-title { font-size: 16px; font-weight: 800; }
    .brand-sub { font-size: 11.5px; color: #cbd5e1; }
    .top-actions { display: flex; align-items: center; gap: 7px; }

    .drawer-backdrop { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 60; }
    .drawer-backdrop.open { display: block; }
    .side-drawer { position: fixed; top: 0; left: -280px; width: 265px; max-width: 82vw; height: 100vh; background: #fff; z-index: 70; box-shadow: 4px 0 22px rgba(15,23,42,0.18); transition: left 0.22s ease; display: flex; flex-direction: column; padding: 18px 14px; }
    .side-drawer.open { left: 0; }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
    .drawer-title { font-size: 15px; font-weight: 800; }
    .drawer-close { background: #f1f5f9; color: var(--ink); padding: 4px 9px; font-size: 13px; border-radius: 7px; }
    .drawer-list { display: flex; flex-direction: column; gap: 6px; }
    .drawer-item { width: 100%; text-align: left; background: #f8fafc; color: var(--ink); padding: 11px 12px; border-radius: 9px; font-size: 13.5px; font-weight: 700; border: 1px solid transparent; }
    .drawer-item:hover, .drawer-item.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }

    select, input, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; color: var(--ink); background: #fff; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--header-bg); }
    input[readonly] { background: #f1f5f3; color: #3a4f42; font-weight: 700; }
    button { cursor: pointer; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; padding: 8px 14px; }
    button:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-ghost { background: rgba(255,255,255,0.14); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .btn-primary { background: var(--header-bg); color: #fff; }
    .btn-danger { background: var(--terracotta); color: #fff; }
    .btn-secondary { background: #eef2f6; color: var(--ink); border: 1px solid var(--border); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .container { max-width: 1100px; margin: 14px auto 0; padding: 0 12px; }
    .status-banner { display: none; padding: 8px 12px; border-radius: 9px; margin-bottom: 11px; font-size: 12.5px; font-weight: 600; }
    .status-banner.info { display: block; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-border); }
    .status-banner.warn { display: block; background: var(--terracotta-soft); color: var(--terracotta); border: 1px solid #f2c4ba; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 15px; margin-bottom: 13px; box-shadow: var(--shadow); }
    .card-title { font-size: 15px; font-weight: 800; margin-bottom: 11px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

    .eng-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .period-group { display: inline-flex; background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
    .period-btn { background: transparent; color: var(--muted); padding: 6px 12px; font-size: 12.5px; font-weight: 700; border-radius: 7px; }
    .period-btn.active { background: var(--header-bg); color: #fff; }

    .vertical-stack { display: flex; flex-direction: column; gap: 11px; }
    .desc-box { min-height: 64px; resize: vertical; background: #fafbfc; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 700; }
    .form-actions { display: flex; gap: 8px; margin-top: 13px; justify-content: flex-end; flex-wrap: wrap; }
    .pb-meta { font-size: 12.5px; color: var(--muted); }
    .pb-actions { display: flex; gap: 5px; align-items: center; }

    .summary-grid-5 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 13px; }
    @media (max-width: 540px) { .summary-grid-5 { grid-template-columns: repeat(2, 1fr); } }
    .stat-box { background: #fff; border: 1px solid var(--border); border-radius: 11px; padding: 12px 10px; text-align: center; box-shadow: var(--shadow); }
    .stat-box.highlight-soft { background: var(--accent-soft); border-color: var(--accent-border); }
    .stat-label { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .stat-val { font-size: 16.5px; font-weight: 800; margin-top: 4px; }

    .badge-status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge-paid { background: #dcfce7; color: #166534; }
    .badge-unpaid { background: #fef3c7; color: #92400e; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
    td.wrap-cell { white-space: normal; min-width: 150px; }
    th { color: var(--ink); font-size: 12px; background: #f1f5f9; font-weight: 700; }
    .table-wrap { overflow-x: auto; }

    .confirm-box { background: var(--amber-soft); border: 1px solid #e7cf96; border-radius: 10px; padding: 12px; margin-top: 14px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; pointer-events: none; }
    .bottom-plus-bar { max-width: 1100px; margin: 0 auto 8px; padding: 0 16px; display: flex; justify-content: flex-end; pointer-events: none; }
    .bottom-plus-btn { pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; background: var(--terracotta); color: #fff; border: 2px solid #fff; box-shadow: 0 4px 14px rgba(200, 75, 49, 0.45); font-size: 24px; font-weight: 800; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
    .bottom-nav-inner { max-width: 1100px; margin: 0 auto; display: flex; background: #fff; border-top: 1px solid var(--border); box-shadow: 0 -3px 12px rgba(15, 23, 42, 0.08); pointer-events: auto; }
    .nav-btn { flex: 1; border-radius: 0; background: #fff; color: var(--muted); font-size: 13.5px; font-weight: 800; padding: 13px 8px; border-right: 1px solid var(--border); }
    .nav-btn:last-child { border-right: none; }
    .nav-btn.nav-summary { color: var(--accent); background: #f2f8f5; }
    .nav-btn.nav-summary.active { background: var(--accent); color: #fff; }
    .nav-btn.nav-expense { color: var(--terracotta-dark); background: var(--terracotta-soft); }
    .nav-btn.nav-expense.active { background: var(--terracotta); color: #fff; }

    .c-green { color: var(--accent); }
    .c-red { color: var(--terracotta); }
    .c-ink { color: var(--ink); }

    @media print {
      .topbar, .bottom-nav, .side-drawer, .drawer-backdrop, .no-print { display: none !important; }
      body { background: #fff; padding-bottom: 0; }
      .card { box-shadow: none; border: 1px solid #ccc; }
      body.print-only-section .card:not(.print-target) { display: none !important; }
      body.print-only-section .print-target { display: block !important; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-emblem">
        <img src="icon-192.png" alt="Logo" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div class="login-brand">Natural Associates</div>
      <form onsubmit="handleLogin(event)" autocomplete="off">
        <div class="login-field">
          <select id="loginUserSelect" class="login-user-select" aria-label="User"></select>
        </div>
        <div class="login-field">
          <div class="pw-wrap">
            <input type="password" id="loginPasswordInput" class="pin-input" maxlength="4" inputmode="numeric" autocomplete="new-password" placeholder="••••" required />
            <button type="button" class="pw-toggle" onclick="togglePasswordVisibility()">Show</button>
          </div>
        </div>
        <div id="loginError" class="login-error"></div>
        <button type="submit" class="btn-login">Login</button>
      </form>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <div id="drawerBackdrop" class="drawer-backdrop no-print" onclick="closeSideDrawer()"></div>
    <aside id="sideDrawer" class="side-drawer no-print" aria-label="Admin Menu">
      <div class="drawer-header">
        <span class="drawer-title">Admin Menu</span>
        <button type="button" class="drawer-close" onclick="closeSideDrawer()">✕</button>
      </div>
      <div class="drawer-list">
        <button type="button" class="drawer-item" data-view="summary" onclick="selectDrawerView('summary')">Summary</button>
        <button type="button" class="drawer-item" data-view="expenses" onclick="selectDrawerView('expenses')">Expenses</button>
        <button type="button" class="drawer-item" data-view="clientPayment" onclick="selectDrawerView('clientPayment')">Client Payment</button>
        <button type="button" class="drawer-item" data-view="engineerFund" onclick="selectDrawerView('engineerFund')">Engineer Fund</button>
        <button type="button" class="drawer-item" data-view="selfExpense" onclick="selectDrawerView('selfExpense')">Self Expense</button>
        <button type="button" class="drawer-item" data-view="addEngineer" onclick="selectDrawerView('addEngineer')">Add Engineer</button>
        <button type="button" class="drawer-item" data-view="addSite" onclick="selectDrawerView('addSite')">Add Site</button>
        <button type="button" class="drawer-item" data-view="addUnits" onclick="selectDrawerView('addUnits')">Add Units</button>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-wrap">
          <button type="button" id="menuBtn" class="menu-toggle-btn no-print" title="Menu" onclick="openSideDrawer()">☰</button>
          <div class="brand-leaf">
            <img src="icon-192.png" alt="Logo" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
              <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">Natural Associates</div>
            <div class="brand-sub" id="loggedInBadge">Logged in</div>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="btn-ghost btn-sm" onclick="loadAllData(true)">Sync</button>
          <button type="button" class="btn-ghost btn-sm" onclick="handleLogout()">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="statusBanner" class="status-banner"></div>
      <section id="viewContainer"></section>
    </main>

    <nav class="bottom-nav no-print">
      <div id="bottomPlusBar" class="bottom-plus-bar"></div>
      <div class="bottom-nav-inner" id="bottomNavInner"></div>
    </nav>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXRT6Qo9B1jWFOSHrozhXyP7wX9pb4T5MxFgQEOoyWR-3-cwpga41M9IuZI5duzPCMbg/exec";
    const CACHE_KEY = "NA_TRACKER_FRESH_V1";

    const SELF_EXPENSE_PERSONS = ["Senthil", "Manigandan"];
    const CATEGORIES = [
      "Material", "Masonry", "Centring", "Electrician", "Plumber",
      "Painter", "Tiles Layer", "Carpenter", "Fabricator", "Polish", "Granite layer"
    ];
    const DEFAULT_UNITS = [
      "Nos", "Kg", "Tons", "Cft", "Ltr", "Bags", "Bundle", "Advance", "Transport", "Unit"
    ];
    const DEFAULT_USERS = [
      { user: "Admin", role: "ADMIN", password: "2021" },
      { user: "Senthil", role: "ENGINEER", password: "1981" },
      { user: "Manigandan", role: "Manigandan", password: "8889" },
      { user: "Yogesh", role: "ENGINEER", password: "7699" },
      { user: "Sivashankar", role: "ENGINEER", password: "2962" }
    ];

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    function toDateISO(val) {
      if (!val) return "";
      if (val instanceof Date && !isNaN(val.getTime())) {
        return `${val.getFullYear()}-${String(val.getMonth() + 1).padStart(2, "0")}-${String(val.getDate()).padStart(2, "0")}`;
      }
      const s = String(val).trim();
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      return s.slice(0, 10);
    }

    function normPay(val) {
      return String(val ?? "").trim().toLowerCase() === "unpaid" ? "Unpaid" : "Paid";
    }

    function isPaid(item) {
      return normPay(item.PaymentStatus ?? item.Status) === "Paid";
    }

    function isPaidByAdmin(item) {
      return isPaid(item) && (item.PaidByAdmin === true || String(item.PaidByAdmin ?? "").trim().toUpperCase() === "TRUE");
    }

    function deductsEngineerBalance(item) {
      return isPaid(item) && !isPaidByAdmin(item);
    }

    function isSettled(val) {
      return val === true || String(val ?? "").trim().toUpperCase() === "TRUE";
    }

    function numVal(v) {
      if (typeof v === "number") return isNaN(v) ? 0 : v;
      const n = Number(String(v ?? "").replace(/[^\d.-]/g, ""));
      return isNaN(n) ? 0 : n;
    }

    function formatINR(n) {
      return "₹" + (Number(n) || 0).toLocaleString("en-IN", { maximumFractionDigits: 2 });
    }

    function printCardById(cardId) {
      document.querySelectorAll(".card.print-target").forEach(el => el.classList.remove("print-target"));
      const target = document.getElementById(cardId);
      if (target) {
        target.classList.add("print-target");
        document.body.classList.add("print-only-section");
      }
      const cleanup = () => {
        document.body.classList.remove("print-only-section");
        if (target) target.classList.remove("print-target");
        window.removeEventListener("afterprint", cleanup);
      };
      window.addEventListener("afterprint", cleanup);
      window.print();
      setTimeout(cleanup, 1000);
    }

    function userKey(name) {
      const k = String(name || "").trim().toLowerCase();
      if (k === "manikandan" || k === "மணிகண்டன்" || k === "மணிஜண்டன்") return "manigandan";
      if (k === "செந்தில்") return "senthil";
      if (k === "யோகேஷ்") return "yogesh";
      if (k === "சிவசங்கர்") return "sivashankar";
      if (k === "அட்மின்") return "admin";
      return k;
    }

    function displayName(name) {
      const k = userKey(name);
      if (k === "manigandan") return "Manigandan";
      if (k === "senthil") return "Senthil";
      if (k === "yogesh") return "Yogesh";
      if (k === "sivashankar") return "Sivashankar";
      if (k === "admin") return "Admin";
      return String(name || "").trim();
    }

    function dedupeUsers(list) {
      const map = new Map();
      (list || []).forEach(u => {
        if (!u || !u.user) return;
        const k = userKey(u.user);
        if (!k) return;
        const dn = displayName(u.user);
        map.set(k, {
          user: dn,
          role: k === "admin" ? "ADMIN" : (k === "manigandan" ? "Manigandan" : (u.role || "ENGINEER")),
          password: String(u.password || "1234")
        });
      });
      return Array.from(map.values());
    }

    function normSiteStatus(v) {
      const s = String(v || "").trim().toLowerCase();
      return (s === "completed" || s === "complete" || s === "closed") ? "Completed" : "Ongoing";
    }

    function cleanUnits(arr) {
      const out = [];
      const seen = new Set();
      (arr || []).forEach(u => {
        const val = String(u || "").trim();
        if (!val) return;
        const low = val.toLowerCase();
        if (!seen.has(low)) {
          seen.add(low);
          out.push(val);
        }
      });
      return out;
    }

    const state = {
      currentUser: null,
      activeTab: "summary",
      engPeriod: "All",
      adminFilterOpen: false,
      adminAddFormOpen: false,
      showExpenseForm: false,
      isSaving: false,
      editingExpenseId: null,
      editingCpId: null,
      editingFundId: null,
      editingSeId: null,
      editingSiteName: null,
      editingUserName: null,
      cpSiteFilter: "",
      cpFromDate: "",
      cpToDate: "",
      efEngFilter: "",
      seWhoFilter: "",
      settleEng: "",
      settleUpToDate: todayISO(),
      settlePreview: null,
      users: dedupeUsers(DEFAULT_USERS),
      expenses: [],
      funds: [],
      selfExpenses: [],
      clientPayments: [],
      sites: [],
      units: [...DEFAULT_UNITS],
      filters: { engineer: "", site: "", category: "", vendor: "", description: "", fromDate: "", toDate: "" }
    };

    function isAdmin() {
      return state.currentUser && state.currentUser.role === "ADMIN";
    }

    function isManigandan() {
      return state.currentUser && userKey(state.currentUser.user) === "manigandan";
    }

    function saveLocal() {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({
          users: state.users,
          expenses: state.expenses,
          funds: state.funds,
          selfExpenses: state.selfExpenses,
          clientPayments: state.clientPayments,
          sites: state.sites,
          units: state.units
        }));
      } catch (_) {}
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return;
        const p = JSON.parse(raw);
        if (Array.isArray(p.users) && p.users.length) state.users = dedupeUsers(p.users);
        if (Array.isArray(p.expenses)) state.expenses = normalizeExp(p.expenses);
        if (Array.isArray(p.funds)) state.funds = normalizeFnd(p.funds);
        if (Array.isArray(p.selfExpenses)) state.selfExpenses = normalizeSe(p.selfExpenses);
        if (Array.isArray(p.clientPayments)) state.clientPayments = normalizeCp(p.clientPayments);
        if (Array.isArray(p.sites)) {
          state.sites = p.sites
            .map(s => ({ "Site Name": String(s["Site Name"] || "").trim(), Status: normSiteStatus(s.Status) }))
            .filter(s => s["Site Name"]);
        }
        if (Array.isArray(p.units) && p.units.length) state.units = cleanUnits(p.units);
      } catch (_) {}
    }

    function normalizeExp(list) {
      return (list || [])
        .filter(r => r && typeof r === "object")
        .map((r, i) => {
          const qty = numVal(r.Qty ?? r.qty ?? 1) || 1;
          const rate = numVal(r.Rate ?? r.rate ?? 0);
          const amt = numVal(r.Amount ?? r.amount ?? (qty * rate));
          const pay = normPay(r.PaymentStatus ?? r.paymentStatus ?? r.Status);
          const paidAdmin = pay === "Paid" && (r.PaidByAdmin === true || String(r.PaidByAdmin ?? "").trim().toUpperCase() === "TRUE");
          return {
            RecordId: String(r.RecordId || r.id || `EXP_${i + 1}`).trim(),
            Date: toDateISO(r.Date || r.date || todayISO()),
            Engineer: displayName(r.Engineer || r.engineer || "Manigandan"),
            Site: String(r.Site || r.site || "").trim(),
            Category: String(r.Category || r.category || "Material").trim(),
            "Vendor/Contractor": String(r["Vendor/Contractor"] || r.vendor || "").trim(),
            Description: String(r.Description || r.description || "").trim(),
            Qty: qty,
            Unit: String(r.Unit || r.unit || "Nos").trim(),
            Rate: rate,
            Amount: amt,
            PaymentStatus: pay,
            Settled: isSettled(r.Settled ?? r.settled),
            PaidByAdmin: paidAdmin
          };
        })
        .filter(x => x.Amount > 0 && (x.Description || x.Site));
    }

    function normalizeFnd(list) {
      return (list || [])
        .filter(r => r && typeof r === "object")
        .map((r, i) => ({
          RecordId: String(r.RecordId || r.id || `FND_${i + 1}`).trim(),
          Date: toDateISO(r.Date || r.date || todayISO()),
          Engineer: displayName(r.Engineer || r.engineer || "").trim(),
          Amount: numVal(r.Amount ?? r.amount ?? 0),
          Mode: String(r.Mode || r.mode || "Online").trim(),
          Settled: isSettled(r.Settled ?? r.settled)
        }))
        .filter(x => x.Engineer && x.Amount !== 0);
    }

    function normalizeSe(list) {
      return (list || [])
        .filter(r => r && typeof r === "object")
        .map((r, i) => ({
          RecordId: String(r.RecordId || r.id || `SE_${i + 1}`).trim(),
          Date: toDateISO(r.Date || r.date || todayISO()),
          Description: String(r.Description || r.description || "").trim(),
          Amount: numVal(r.Amount ?? r.amount ?? 0),
          Who: displayName(r.Who || r.who || "Manigandan")
        }))
        .filter(x => x.Amount > 0 && x.Description);
    }

    function normalizeCp(list) {
      return (list || [])
        .filter(r => r && typeof r === "object")
        .map((r, i) => {
          const base = numVal(r["Base Amount"] ?? r.baseAmount ?? 0);
          const pct = numVal(r["Gst%"] ?? r.gstPct ?? 0);
          const gst = numVal(r["GST Amount"] ?? r.gstAmount ?? ((base * pct) / 100));
          const tot = numVal(r.TotalAmount ?? r["Total Amount"] ?? r.amount ?? (base + gst));
          return {
            RecordId: String(r.RecordId || r.id || `CP_${i + 1}`).trim(),
            Date: toDateISO(r.Date || r.date || todayISO()),
            Site: String(r.Site || r.site || "").trim(),
            "Base Amount": base,
            "Gst%": pct,
            "GST Amount": gst,
            TotalAmount: tot,
            PaymentMode: String(r.PaymentMode || r.paymentMode || "").trim(),
            ReferenceNo: String(r.ReferenceNo || r.referenceNo || "").trim(),
            Remarks: String(r.Remarks || r.remarks || "").trim()
          };
        })
        .filter(x => x.Site && x.TotalAmount > 0);
    }

    function getEngineerList() {
      const out = [];
      const seen = new Set();
      state.users.forEach(u => {
        const k = userKey(u.user);
        if (!k || k === "admin") return;
        if (!seen.has(k)) {
          seen.add(k);
          out.push(displayName(u.user));
        }
      });
      return out;
    }

    function getOngoingSites() {
      return state.sites.filter(s => normSiteStatus(s.Status) === "Ongoing").map(s => s["Site Name"]);
    }

    function getAllSites() {
      return state.sites.map(s => s["Site Name"]);
    }

    function isSiteDone(siteName) {
      const t = String(siteName || "").trim().toLowerCase();
      if (!t) return false;
      const found = state.sites.find(s => String(s["Site Name"]).trim().toLowerCase() === t);
      return found ? normSiteStatus(found.Status) === "Completed" : false;
    }

    function setBanner(msg, type = "info") {
      const el = document.getElementById("statusBanner");
      if (!el) return;
      if (!msg) {
        el.className = "status-banner";
        el.textContent = "";
        return;
      }
      el.className = `status-banner ${type}`;
      el.textContent = msg;
    }

    function syncLoginSelect() {
      const sel = document.getElementById("loginUserSelect");
      if (!sel) return;
      const curKey = userKey(sel.value || "Admin") || "admin";
      const list = dedupeUsers(state.users);
      const chosen = list.find(u => userKey(u.user) === curKey)?.user || list[0]?.user || "Admin";
      sel.innerHTML = list.map(u => `<option value="${u.user}" ${u.user === chosen ? "selected" : ""}>${u.user}</option>`).join("");

    function togglePasswordVisibility() {
      const inp = document.getElementById("loginPasswordInput");
      const btn = document.querySelector(".pw-toggle");
      if (!inp || !btn) return;
      inp.type = inp.type === "password" ? "text" : "password";
      btn.textContent = inp.type === "password" ? "Show" : "Hide";
    }

    function handleLogin(ev) {
      ev.preventDefault();
      const uVal = document.getElementById("loginUserSelect").value;
      const pwVal = document.getElementById("loginPasswordInput").value.trim();
      const err = document.getElementById("loginError");
      const k = userKey(uVal);
      const found = state.users.find(u => userKey(u.user) === k);
      if (!found || String(found.password) !== String(pwVal)) {
        err.textContent = "Invalid user or PIN.";
        err.style.display = "block";
        return;
      }
      err.style.display = "none";
      state.currentUser = {
        user: found.user,
        role: k === "admin" ? "ADMIN" : (k === "manigandan" ? "Manigandan" : (found.role || "ENGINEER"))
      };
      sessionStorage.setItem("NA_FRESH_SESSION", JSON.stringify(state.currentUser));
      document.getElementById("loginPasswordInput").value = "";
      state.activeTab = "summary";
      state.showExpenseForm = false;
      state.editingExpenseId = null;
      state.adminAddFormOpen = false;
      showApp();
      loadAllData(false);
    }

    function handleLogout() {
      sessionStorage.removeItem("NA_FRESH_SESSION");
      state.currentUser = null;
      closeSideDrawer();
      document.getElementById("appShell").style.display = "none";
      document.getElementById("loginScreen").style.display = "flex";
    }

    function showApp() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appShell").style.display = "block";
      const menuBtn = document.getElementById("menuBtn");
      if (menuBtn) menuBtn.style.display = isAdmin() ? "flex" : "none";
      document.getElementById("loggedInBadge").textContent = `${state.currentUser.user} • ${isAdmin() ? "Admin" : "Engineer"}`;

      document.getElementById("sideDrawer")?.classList.add("open");

      state.showExpenseForm = false;
      state.settlePreview = null;
      state.editingExpenseId = null;
      state.editingCpId = null;
      state.editingFundId = null;
      state.editingSeId = null;
      state.editingSiteName = null;
      state.editingUserName = null;

    let syncing = false;
    let blockSyncUntil = 0;

    function isEditingNow() {
      if (state.showExpenseForm || state.editingExpenseId || state.adminAddFormOpen || state.settlePreview) return true;
      const el = document.activeElement;
      if (!el) return false;
      if (el.id === "spEng") return true;
      return ["INPUT", "SELECT", "TEXTAREA"].includes(el.tagName);
    }

    async function loadAllData(showMsg = false) {
      if (syncing) return;
      syncing = true;
      if (showMsg) setBanner("Syncing...", "info");
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAll&t=${Date.now()}`, {
          method: "GET",
          redirect: "follow",
          cache: "no-store"
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (data.status === "error") throw new Error(data.message || "Sheet error");

        if (Date.now() < blockSyncUntil) {
          saveLocal();
          if (showMsg) setBanner("Synced.", "info");
          return;
        }

        if (Array.isArray(data.users) && data.users.length) state.users = dedupeUsers(data.users);
        syncLoginSelect();

        if (Array.isArray(data.expenses)) state.expenses = normalizeExp(data.expenses);
        if (Array.isArray(data.funds)) state.funds = normalizeFnd(data.funds);
        if (Array.isArray(data.selfExpenses)) state.selfExpenses = normalizeSe(data.selfExpenses);
        if (Array.isArray(data.clientPayments)) state.clientPayments = normalizeCp(data.clientPayments);

        if (Array.isArray(data.sites)) {
          const map = new Map();
          data.sites.forEach(s => {
            const name = typeof s === "string" ? s.trim() : String(s["Site Name"] || "").trim();
            if (name) {
              map.set(name.toLowerCase(), {
                "Site Name": name,
                Status: typeof s === "object" ? normSiteStatus(s.Status) : "Ongoing"
              });
            }
          });
          state.sites = Array.from(map.values());
        }

        if (Array.isArray(data.units) && data.units.length) {
          state.units = cleanUnits(data.units);
        }

        saveLocal();
        if (showMsg) setBanner("Synced with Google Sheet.", "info");
      } catch (err) {
        if (showMsg) setBanner("Sync failed. Check Apps Script deployment.", "warn");
      } finally {
        syncing = false;
        if (state.currentUser && !isEditingNow()) render();
      }
    }

    async function sendAction(payload) {
      blockSyncUntil = Date.now() + 7000;
      saveLocal();
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          setBanner("Save failed (HTTP " + res.status + ").", "warn");
          return false;
        }
        let json = null;
        try { json = await res.json(); } catch (_) {}
        if (json && json.status === "error") {
          setBanner(json.message || "Error saving.", "warn");
          return false;
        }
        setBanner("Saved.", "info");
        return true;
      } catch (_) {
        setBanner("Network error while saving.", "warn");
        return false;
      }
    }

    function calcAmt() {
      const q = numVal(document.getElementById("expQty")?.value);
      const r = numVal(document.getElementById("expRate")?.value);
      const aEl = document.getElementById("expAmount");
      if (aEl && q > 0 && r > 0) aEl.value = (q * r).toFixed(2);
    }

    async function saveExpense(ev) {
      ev.preventDefault();
      if (state.isSaving) return;
      const editing = state.editingExpenseId ? state.expenses.find(e => e.RecordId === state.editingExpenseId) : null;
      if (!isAdmin() && editing) return;

      const date = toDateISO(document.getElementById("expDate").value || todayISO());
      const eng = isAdmin() ? (document.getElementById("expEngineer")?.value || editing?.Engineer || "Manigandan") : state.currentUser.user;
      const site = document.getElementById("expSite").value;
      const cat = (isAdmin() || isManigandan()) ? (document.getElementById("expCategory")?.value || "Material") : "Material";
      const vendor = document.getElementById("expVendor").value.trim();
      const desc = document.getElementById("expDesc").value.trim();
      const qty = numVal(document.getElementById("expQty").value) || 1;
      const unit = document.getElementById("expUnit").value || "Nos";
      const rate = numVal(document.getElementById("expRate").value);
      const amt = numVal(document.getElementById("expAmount").value) || (qty * rate);
      const payStatus = normPay(document.getElementById("expPayStatus")?.value);

      if (!desc || amt <= 0) {
        setBanner("Enter Description and valid Amount.", "warn");
        return;
      }
      if (!isAdmin() && (!site || isSiteDone(site))) {
        setBanner("No active site selected.", "warn");
        return;
      }

      state.isSaving = true;
      if (editing) {
        const wasUnpaid = !isPaid(editing);
        const paidAdmin = payStatus === "Paid"
          ? (wasUnpaid ? true : isPaidByAdmin(editing))
          : false;
        const updated = {
          ...editing,
          Date: date,
          Engineer: displayName(eng),
          Site: site,
          Category: cat,
          "Vendor/Contractor": vendor,
          Description: desc,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amt,
          PaymentStatus: payStatus,
          PaidByAdmin: paidAdmin
        };
        const idx = state.expenses.findIndex(e => e.RecordId === editing.RecordId);
        if (idx > -1) state.expenses[idx] = updated;
        state.isSaving = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await sendAction({ action: "updateExpense", record: updated });
      } else {
        const rec = {
          RecordId: "EXP_" + Date.now(),
          Date: date,
          Engineer: displayName(eng),
          Site: site,
          Category: cat,
          "Vendor/Contractor": vendor,
          Description: desc,
          Qty: qty,
          Unit: unit,
          Rate: rate,
          Amount: amt,
          PaymentStatus: payStatus,
          Settled: false,
          PaidByAdmin: false
        };
        state.expenses.unshift(rec);
        state.isSaving = false;
        state.editingExpenseId = null;
        state.showExpenseForm = false;
        render();
        await sendAction({ action: "addExpense", record: rec });
      }
    }

    async function setExpensePayStatus(recordId, nextVal) {
      if (!isAdmin()) return;
      const idx = state.expenses.findIndex(e => e.RecordId === recordId);
      if (idx === -1) return;
      const cur = state.expenses[idx];
      const nextStatus = normPay(nextVal);
      const nextPaidAdmin = nextStatus === "Paid"
        ? (!isPaid(cur) ? true : isPaidByAdmin(cur))
        : false;
      const updated = { ...cur, PaymentStatus: nextStatus, PaidByAdmin: nextPaidAdmin };
      state.expenses[idx] = updated;
      render();
      await sendAction({ action: "updateExpense", record: updated });
    }

    async function deleteExpense(recordId) {
      if (!isAdmin()) return;
      state.expenses = state.expenses.filter(e => e.RecordId !== recordId);
      render();
      await sendAction({ action: "deleteExpense", RecordId: recordId });
    }

    function getScopedExpenses() {
      let list = [...state.expenses];
      if (!isAdmin()) {
        const ek = userKey(state.currentUser.user);
        list = list.filter(e =>
          userKey(e.Engineer) === ek &&
          !isSiteDone(e.Site) &&
          !isSettled(e.Settled) &&
          !isPaidByAdmin(e)
        );
        const today = todayISO();
        if (state.engPeriod === "Day") {
          list = list.filter(e => toDateISO(e.Date) === today);
        } else if (state.engPeriod === "Week") {
          const d = new Date();
          const diff = d.getDay() === 0 ? -6 : 1 - d.getDay();
          d.setDate(d.getDate() + diff);
          const ws = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
          list = list.filter(e => { const dt = toDateISO(e.Date); return dt >= ws && dt <= today; });
        } else if (state.engPeriod === "Month") {
          const d = new Date();
          const ms = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;
          list = list.filter(e => { const dt = toDateISO(e.Date); return dt >= ms && dt <= today; });
        }
      } else {
        if (state.filters.engineer) list = list.filter(e => userKey(e.Engineer) === userKey(state.filters.engineer));
        if (state.filters.site) list = list.filter(e => e.Site === state.filters.site);
        if (state.filters.category) list = list.filter(e => e.Category === state.filters.category);
        if (state.filters.vendor.trim()) {
          const v = state.filters.vendor.trim().toLowerCase();
          list = list.filter(e => String(e["Vendor/Contractor"] || "").toLowerCase().includes(v));
        }
        if (state.filters.description.trim()) {
          const q = state.filters.description.trim().toLowerCase();
          list = list.filter(e => String(e.Description || "").toLowerCase().includes(q));
        }
        if (state.filters.fromDate) list = list.filter(e => toDateISO(e.Date) >= state.filters.fromDate);
        if (state.filters.toDate) list = list.filter(e => toDateISO(e.Date) <= state.filters.toDate);
      }
      return list;
    }

      `;

            <div style="display:flex; gap:8px; align-items:center;">
              <span>Paid Total: ${formatINR(paidSum)}</span>

    function renderSummaryView() {
      if (!isAdmin()) {
        const eng = state.currentUser.user;
        const ek = userKey(eng);
        const funds = state.funds.filter(f => userKey(f.Engineer) === ek && !isSettled(f.Settled));
        const paidExp = state.expenses.filter(e => userKey(e.Engineer) === ek && !isSiteDone(e.Site) && deductsEngineerBalance(e) && !isSettled(e.Settled));
        const fSum = funds.reduce((s, r) => s + numVal(r.Amount), 0);
        const eSum = paidExp.reduce((s, r) => s + numVal(r.Amount), 0);

        return `
          <div class="summary-grid-5" style="grid-template-columns: repeat(3, 1fr);">
            <div class="stat-box highlight-soft"><div class="stat-label">Fund / Balance</div><div class="stat-val c-green">${formatINR(fSum)}</div></div>
            <div class="stat-box"><div class="stat-label">Expense (Paid)</div><div class="stat-val c-red">${formatINR(eSum)}</div></div>
            <div class="stat-box"><div class="stat-label">Balance</div><div class="stat-val c-ink">${formatINR(fSum - eSum)}</div></div>
          </div>
          <div class="card">
            <div class="card-title">Balance / Fund Details (${eng})</div>
            ${funds.length ? `
              <div class="table-wrap"><table><thead><tr><th>Date</th><th>Mode</th><th>Amount</th></tr></thead><tbody>
                ${funds.map(f => `<tr><td>${toDateISO(f.Date)}</td><td><strong>${f.Mode}</strong></td><td class="c-green"><strong>${formatINR(f.Amount)}</strong></td></tr>`).join("")}
              </tbody></table></div>
            ` : `<div class="pb-meta">No active fund entries.</div>`}
          </div>
        `;
      }

      const clientSum = state.clientPayments.reduce((s, r) => s + numVal(r.TotalAmount), 0);
      const paidExpSum = state.expenses.filter(e => isPaid(e)).reduce((s, r) => s + numVal(r.Amount), 0);
      const bal = clientSum - paidExpSum;
      const selfSum = state.selfExpenses.reduce((s, r) => s + numVal(r.Amount), 0);
      const net = bal - selfSum;

      const siteNames = [];
      const seenSites = new Set();
      getAllSites().forEach(sn => {
        const k = sn.toLowerCase();
        if (!seenSites.has(k)) { seenSites.add(k); siteNames.push(sn); }
      });
      state.clientPayments.forEach(c => {
        const k = String(c.Site || "").trim().toLowerCase();
        if (k && !seenSites.has(k)) { seenSites.add(k); siteNames.push(String(c.Site).trim()); }
      });
      state.expenses.forEach(e => {
        const k = String(e.Site || "").trim().toLowerCase();
        if (k && !seenSites.has(k)) { seenSites.add(k); siteNames.push(String(e.Site).trim()); }
      });

      const siteRows = siteNames.map(site => {
        const sk = site.toLowerCase();
        const cpSite = state.clientPayments.filter(c => String(c.Site || "").trim().toLowerCase() === sk);
        const baseAmt = cpSite.reduce((s, r) => s + numVal(r["Base Amount"]), 0);
        const gstAmt = cpSite.reduce((s, r) => s + numVal(r["GST Amount"]), 0);
        const totalAmt = cpSite.reduce((s, r) => s + numVal(r.TotalAmount), 0);
        const expSite = state.expenses.filter(e => String(e.Site || "").trim().toLowerCase() === sk && isPaid(e));
        const expAmt = expSite.reduce((s, r) => s + numVal(r.Amount), 0);
        return { site, baseAmt, gstAmt, totalAmt, expAmt, balAmt: totalAmt - expAmt };
      });

      const siteTotBase = siteRows.reduce((s, r) => s + r.baseAmt, 0);
      const siteTotGst = siteRows.reduce((s, r) => s + r.gstAmt, 0);
      const siteTotAll = siteRows.reduce((s, r) => s + r.totalAmt, 0);
      const siteTotExp = siteRows.reduce((s, r) => s + r.expAmt, 0);
      const siteTotBal = siteRows.reduce((s, r) => s + r.balAmt, 0);

      const rows = getEngineerList().map(eng => {
        const ek = userKey(eng);
        const fGiven = state.funds.filter(f => userKey(f.Engineer) === ek && !isSettled(f.Settled)).reduce((s, r) => s + numVal(r.Amount), 0);
        const spent = state.expenses.filter(e => userKey(e.Engineer) === ek && deductsEngineerBalance(e) && !isSettled(e.Settled)).reduce((s, r) => s + numVal(r.Amount), 0);
        return { eng, fGiven, spent, rem: fGiven - spent };
      });

      return `
        <div class="summary-grid-5">
          <div class="stat-box highlight-soft"><div class="stat-label">Client Payment</div><div class="stat-val c-green">${formatINR(clientSum)}</div></div>
          <div class="stat-box"><div class="stat-label">Site Expense</div><div class="stat-val c-red">${formatINR(paidExpSum)}</div></div>
          <div class="stat-box highlight-soft"><div class="stat-label">Balance</div><div class="stat-val c-ink">${formatINR(bal)}</div></div>
          <div class="stat-box"><div class="stat-label">Self Expense</div><div class="stat-val c-red">${formatINR(selfSum)}</div></div>
          <div class="stat-box highlight-soft"><div class="stat-label">Net Balance</div><div class="stat-val c-green">${formatINR(net)}</div></div>
        </div>
        <div id="siteWiseSummaryCard" class="card">
          <div class="card-title">
            <span>Site-wise Summary</span>
            <button type="button" class="btn-secondary btn-sm no-print" onclick="printCardById('siteWiseSummaryCard')">Print</button>
          </div>
          ${siteRows.length ? `
            <div class="table-wrap"><table><thead><tr><th>Site</th><th>Base Amount</th><th>GST Amount</th><th>Total Amount</th><th>Expense</th><th>Balance</th></tr></thead><tbody>
              ${siteRows.map(s => `
                <tr>
                  <td><strong>${s.site}</strong></td>
                  <td>${formatINR(s.baseAmt)}</td>
                  <td>${formatINR(s.gstAmt)}</td>
                  <td class="c-green"><strong>${formatINR(s.totalAmt)}</strong></td>
                  <td class="c-red"><strong>${formatINR(s.expAmt)}</strong></td>
                  <td class="c-ink"><strong>${formatINR(s.balAmt)}</strong></td>
                </tr>
              `).join("")}
              <tr>
                <td><strong>Total</strong></td>
                <td><strong>${formatINR(siteTotBase)}</strong></td>
                <td><strong>${formatINR(siteTotGst)}</strong></td>
                <td class="c-green"><strong>${formatINR(siteTotAll)}</strong></td>
                <td class="c-red"><strong>${formatINR(siteTotExp)}</strong></td>
                <td class="c-ink"><strong>${formatINR(siteTotBal)}</strong></td>
              </tr>
            </tbody></table></div>
          ` : `<div class="pb-meta">No site data found.</div>`}
        </div>
        <div class="card">
          <div class="card-title">Engineers Fund &amp; Expense Summary</div>
          <div class="table-wrap"><table><thead><tr><th>Engineer</th><th>Fund Received</th><th>Expense (Paid)</th><th>Balance</th></tr></thead><tbody>
            ${rows.map(r => `<tr><td><strong>${r.eng}</strong></td><td class="c-green"><strong>${formatINR(r.fGiven)}</strong></td><td class="c-red"><strong>${formatINR(r.spent)}</strong></td><td class="c-ink"><strong>${formatINR(r.rem)}</strong></td></tr>`).join("")}
          </tbody></table></div>
        </div>
      `;
    }

    function renderEngineerFundPage() {
      const engs = getEngineerList();
      const editF = state.editingFundId ? state.funds.find(f => f.RecordId === state.editingFundId) : null;
      const showForm = state.adminAddFormOpen || Boolean(editF);

      return `
        <div class="summary-grid-5" style="grid-template-columns: repeat(3, 1fr);">

          <div class="stat-box"><div class="stat-label">Expense (Paid)</div><div class="stat-val c-red">${formatINR(eTot)}</div></div>

        <div class="card">
          <div class="card-title">
            <span>Engineer Fund</span>

              <select style="width:150px;" onchange="state.efEngFilter=this.value; render();">

                ${engs.map(e => `<option value="${e}" ${state.efEngFilter === e ? "selected" : ""}>${e}</option>`).join("")}
              </select>
              <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen=!state.adminAddFormOpen; state.editingFundId=null; render();">${showForm ? "Close" : "+"}</button>

          ${showForm ? `
            <form onsubmit="submitFund(event)" style="margin-bottom:14px;">

                <div class="field"><label>Date</label><input type="date" id="efDate" value="${editF ? toDateISO(editF.Date) : todayISO()}" required /></div>
                <div class="field"><label>Engineer</label><select id="efEng">${engs.map(e => `<option value="${e}" ${editF && userKey(editF.Engineer) === userKey(e) ? "selected" : ""}>${e}</option>`).join("")}</select></div>
                <div class="field"><label>Amount (₹)</label><input type="number" step="0.01" id="efAmt" value="${editF ? editF.Amount : ""}" required /></div>
                <div class="field"><label>Mode</label><select id="efMode">${["GPay", "Bank Transfer", "Cash", "Carry Balance"].map(m => `<option value="${m}" ${editF && editF.Mode === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn-primary">${editF ? "Update Fund" : "Save"}</button></div>
            </form>
          ` : ""}

          ${actFunds.length ? `
            <div class="table-wrap"><table><thead><tr><th>Date</th><th>Engineer</th><th>Mode</th><th>Amount</th><th>Action</th></tr></thead><tbody>
              ${actFunds.map(f => `
                <tr>
                  <td>${toDateISO(f.Date)}</td>
                  <td><strong>${f.Engineer}</strong></td>
                  <td><strong>${f.Mode}</strong></td>
                  <td class="c-green"><strong>${formatINR(f.Amount)}</strong></td>
                  <td>
                    <div class="pb-actions">
                      <button type="button" class="btn-secondary btn-sm" onclick="state.editingFundId='${f.RecordId}'; state.adminAddFormOpen=true; render();">Edit</button>
                      <button type="button" class="btn-danger btn-sm" onclick="deleteFund('${f.RecordId}')">Del</button>
                    </div>
                  </td>

          ` : `<div class="pb-meta">No active fund entries.</div>`}

          <div class="confirm-box">
            <div style="font-size:13px; font-weight:800; margin-bottom:8px;">Settle Period (Carry Balance)</div>

                <div class="field"><label>Engineer</label><select id="spEng" onchange="state.settleEng=this.value; state.settlePreview=null;">${engs.map(e => `<option value="${e}" ${selectedSpEng === e ? "selected" : ""}>${e}</option>`).join("")}</select></div>
                <div class="field"><label>Settle Up To Date</label><input type="date" id="spDate" value="${upToVal}" oninput="state.settleUpToDate=toDateISO(this.value); state.settlePreview=null;" required /></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn-secondary btn-sm">Check Balance</button></div>
            </form>
            ${state.settlePreview ? `
              <div style="font-size:13px; margin-top:8px; padding-top:8px; border-top:1px solid #e7cf96;">
                <strong>${state.settlePreview.eng}</strong> (up to <strong>${state.settlePreview.upTo}</strong>):<br/>
                Fund: <strong>${formatINR(state.settlePreview.fSum)}</strong> |
                Paid Spent: <strong>${formatINR(state.settlePreview.eSum)}</strong> |
                Carry Balance: <strong>${formatINR(state.settlePreview.carry)}</strong>

                  <button type="button" class="btn-secondary btn-sm" onclick="state.settlePreview=null; render();">Cancel</button>

    function previewSettle(ev) {
      ev.preventDefault();
      const eng = document.getElementById("spEng").value;
      state.settleEng = eng;
      const ek = userKey(eng);
      const upTo = toDateISO(document.getElementById("spDate").value || state.settleUpToDate || todayISO());
      state.settleUpToDate = upTo;
      const fSum = state.funds.filter(f => userKey(f.Engineer) === ek && !isSettled(f.Settled) && toDateISO(f.Date) <= upTo).reduce((s, r) => s + numVal(r.Amount), 0);
      const eSum = state.expenses.filter(e => userKey(e.Engineer) === ek && deductsEngineerBalance(e) && !isSettled(e.Settled) && toDateISO(e.Date) <= upTo).reduce((s, r) => s + numVal(r.Amount), 0);
      state.settlePreview = { eng, upTo, fSum, eSum, carry: fSum - eSum };
      render();
    }

    async function confirmSettle() {
      if (!state.settlePreview) return;
      const { eng, upTo, carry } = state.settlePreview;
      const ek = userKey(eng);
      const dn = displayName(eng);

      const settledFundIds = [];
      state.funds.forEach(f => {
        if (userKey(f.Engineer) === ek && !isSettled(f.Settled) && toDateISO(f.Date) <= upTo) {
          f.Settled = true;
          settledFundIds.push(f.RecordId);
        }
      });

      const settledExpenseIds = [];
      state.expenses.forEach(e => {
        if (userKey(e.Engineer) === ek && !isSettled(e.Settled) && toDateISO(e.Date) <= upTo) {
          e.Settled = true;
          settledExpenseIds.push(e.RecordId);
        }
      });

      const carryRec = {
        RecordId: "CF_" + Date.now(),
        Date: todayISO(),
        Engineer: dn,
        Amount: carry,
        Mode: "Carry Balance",
        Settled: false
      };
      state.funds.unshift(carryRec);
      state.settlePreview = null;
      render();

      await sendAction({
        action: "settlePeriod",
        engineer: dn,
        upToDate: upTo,
        carryForward: carry,
        settledFundIds,
        settledExpenseIds,
        carryRecord: carryRec
      });
    }

    async function submitFund(ev) {
      ev.preventDefault();
      const existing = state.editingFundId ? state.funds.find(f => f.RecordId === state.editingFundId) : null;
      const rec = {
        RecordId: existing ? existing.RecordId : ("FND_" + Date.now()),
        Date: toDateISO(document.getElementById("efDate").value),
        Engineer: displayName(document.getElementById("efEng").value),
        Amount: numVal(document.getElementById("efAmt").value),
        Mode: document.getElementById("efMode").value,
        Settled: existing ? isSettled(existing.Settled) : false
      };
      if (existing) {
        const idx = state.funds.findIndex(f => f.RecordId === existing.RecordId);
        if (idx > -1) state.funds[idx] = rec;
        state.editingFundId = null;
        state.adminAddFormOpen = false;
        render();
        await sendAction({ action: "updateFund", record: rec });
      } else {
        state.funds.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await sendAction({ action: "addFund", record: rec });
      }
    }

    async function deleteFund(id) {
      if (!isAdmin()) return;
      state.funds = state.funds.filter(f => f.RecordId !== id);
      render();
      await sendAction({ action: "deleteFund", RecordId: id });
    }

      list.sort((a, b) => toDateISO(b.Date).localeCompare(toDateISO(a.Date)) || String(b.RecordId).localeCompare(String(a.RecordId)));
      const tot = list.reduce((s, x) => s + numVal(x.Amount), 0);

      return `
        <div class="card no-print">

            <span>Self Expense</span>

              <select style="width:145px;" onchange="state.seWhoFilter=this.value; render();">

                ${SELF_EXPENSE_PERSONS.map(p => `<option value="${p}" ${state.seWhoFilter === p ? "selected" : ""}>${p}</option>`).join("")}
              </select>
              <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen=!state.adminAddFormOpen; state.editingSeId=null; render();">${showForm ? "Close" : "+"}</button>
            </div>
          </div>
          ${showForm ? `
            <form onsubmit="submitSe(event)">
              <div class="form-grid">
                <div class="field"><label>Date</label><input type="date" id="seDate" value="${editSe ? toDateISO(editSe.Date) : todayISO()}" required /></div>
                <div class="field"><label>Description</label><input type="text" id="seDesc" value="${editSe ? editSe.Description : ""}" required /></div>
                <div class="field"><label>Amount (₹)</label><input type="number" step="0.01" id="seAmount" value="${editSe ? editSe.Amount : ""}" required /></div>
                <div class="field"><label>Who</label><select id="seWho">${SELF_EXPENSE_PERSONS.map(p => `<option value="${p}" ${editSe && userKey(editSe.Who) === userKey(p) ? "selected" : ""}>${p}</option>`).join("")}</select></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn-primary">${editSe ? "Update" : "Save"}</button></div>
            </form>
          ` : ""}
        </div>
        <div class="card">
          <div class="card-title"><span>Self Expense List</span><span>Total: ${formatINR(tot)}</span></div>
          ${list.length ? `
            <div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Who</th><th class="no-print">Action</th></tr></thead><tbody>
              ${list.map(x => `
                <tr>
                  <td>${toDateISO(x.Date)}</td>
                  <td class="wrap-cell">${x.Description}</td>
                  <td class="c-red"><strong>${formatINR(x.Amount)}</strong></td>
                  <td><strong>${displayName(x.Who)}</strong></td>
                  <td class="no-print"><div class="pb-actions">
                    <button type="button" class="btn-secondary btn-sm" onclick="state.editingSeId='${x.RecordId}'; state.adminAddFormOpen=true; render();">Edit</button>
                    <button type="button" class="btn-danger btn-sm" onclick="deleteSe('${x.RecordId}')">Del</button>
                  </div></td>
                </tr>
              `).join("")}
            </tbody></table></div>
          ` : `<div class="pb-meta">No entries yet.</div>`}
        </div>
      `;
    }

    async function submitSe(ev) {
      ev.preventDefault();
      if (!isAdmin()) return;
      const existing = state.editingSeId ? state.selfExpenses.find(s => s.RecordId === state.editingSeId) : null;
      const rec = {
        RecordId: existing ? existing.RecordId : ("SE_" + Date.now()),
        Date: toDateISO(document.getElementById("seDate").value || todayISO()),
        Description: document.getElementById("seDesc").value.trim(),
        Amount: numVal(document.getElementById("seAmount").value),
        Who: displayName(document.getElementById("seWho").value || "Senthil")
      };
      if (!rec.Description || rec.Amount <= 0) return;
      if (existing) {
        const idx = state.selfExpenses.findIndex(s => s.RecordId === existing.RecordId);
        if (idx > -1) state.selfExpenses[idx] = rec;
        state.editingSeId = null;
        state.adminAddFormOpen = false;
        render();
        await sendAction({ action: "updateSelfExpense", record: rec });
      } else {
        state.selfExpenses.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await sendAction({ action: "addSelfExpense", record: rec });
      }
    }

    async function deleteSe(id) {
      if (!isAdmin()) return;
      state.selfExpenses = state.selfExpenses.filter(s => s.RecordId !== id);
      render();
      await sendAction({ action: "deleteSelfExpense", RecordId: id });
    }

    function renderClientPaymentPage() {
      const sites = getAllSites();
      const editCp = state.editingCpId ? state.clientPayments.find(c => c.RecordId === state.editingCpId) : null;
      const showForm = state.adminAddFormOpen || Boolean(editCp);
      let list = [...state.clientPayments];
      if (state.cpSiteFilter) list = list.filter(c => c.Site === state.cpSiteFilter);
      if (state.cpFromDate) list = list.filter(c => toDateISO(c.Date) >= state.cpFromDate);
      if (state.cpToDate) list = list.filter(c => toDateISO(c.Date) <= state.cpToDate);
      list.sort((a, b) => toDateISO(b.Date).localeCompare(toDateISO(a.Date)));
      const tot = list.reduce((s, r) => s + numVal(r.TotalAmount), 0);

      return `
        <div class="card no-print">
          <div class="card-title">
            <span>Client Payment</span>
            <div style="display:flex; gap:6px;">
              <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen=!state.adminAddFormOpen; state.editingCpId=null; render();">${showForm ? "Close" : "+"}</button>
            </div>
          </div>
          <div class="form-grid">
            <div class="field"><label>Site</label><select onchange="state.cpSiteFilter=this.value; render();"><option value="">All Sites</option>${sites.map(s => `<option value="${s}" ${state.cpSiteFilter === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
            <div class="field"><label>From</label><input type="date" value="${state.cpFromDate}" onchange="state.cpFromDate=this.value; render();" /></div>
            <div class="field"><label>To</label><input type="date" value="${state.cpToDate}" onchange="state.cpToDate=this.value; render();" /></div>
          </div>
          ${showForm ? `
            <form onsubmit="submitCp(event)" style="margin-top:14px;">
              <div class="form-grid">
                <div class="field"><label>Date</label><input type="date" id="cpDate" value="${editCp ? toDateISO(editCp.Date) : todayISO()}" required /></div>
                <div class="field"><label>Site</label><select id="cpSite">${sites.map(s => `<option value="${s}" ${editCp && editCp.Site === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
                <div class="field"><label>Base (₹)</label><input type="number" step="0.01" id="cpBase" value="${editCp ? editCp["Base Amount"] : ""}" oninput="syncGst()" required /></div>
                <div class="field"><label>GST %</label><input type="number" step="0.01" id="cpGstPct" value="${editCp ? editCp["Gst%"] : 0}" oninput="syncGst()" /></div>
                <div class="field"><label>GST Amt</label><input type="number" step="0.01" id="cpGstAmt" value="${editCp ? editCp["GST Amount"] : 0}" readonly /></div>
                <div class="field"><label>Total (₹)</label><input type="number" step="0.01" id="cpTotal" value="${editCp ? editCp.TotalAmount : ""}" required /></div>
                <div class="field"><label>Mode</label><select id="cpMode">${["Bank Transfer", "GPay", "Cheque", "Cash"].map(m => `<option value="${m}" ${editCp && editCp.PaymentMode === m ? "selected" : ""}>${m}</option>`).join("")}</select></div>
                <div class="field"><label>Ref No</label><input type="text" id="cpRef" value="${editCp ? editCp.ReferenceNo : ""}" /></div>
                <div class="field"><label>Remarks</label><input type="text" id="cpRemarks" value="${editCp ? editCp.Remarks : ""}" /></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn-primary">${editCp ? "Update" : "Save"}</button></div>
            </form>
          ` : ""}
        </div>
        <div id="clientPaymentListCard" class="card">
          <div class="card-title">
            <span>Client Payment List</span>
            <div style="display:flex; gap:8px; align-items:center;">
              <span>Total: ${formatINR(tot)}</span>
              <button type="button" class="btn-secondary btn-sm no-print" onclick="printCardById('clientPaymentListCard')">Print</button>
            </div>
          </div>
          ${list.length ? `
            <div class="table-wrap"><table><thead><tr><th>Date</th><th>Site</th><th>Base</th><th>GST</th><th>Total</th><th>Mode</th><th>Ref</th><th>Remarks</th><th class="no-print">Action</th></tr></thead><tbody>
              ${list.map(c => `
                <tr>
                  <td>${toDateISO(c.Date)}</td>
                  <td><strong>${c.Site}</strong></td>
                  <td>${formatINR(c["Base Amount"])}</td>
                  <td>${formatINR(c["GST Amount"])}</td>
                  <td class="c-green"><strong>${formatINR(c.TotalAmount)}</strong></td>
                  <td>${c.PaymentMode}</td>
                  <td>${c.ReferenceNo || "-"}</td>
                  <td class="wrap-cell">${c.Remarks || "-"}</td>
                  <td class="no-print"><div class="pb-actions">
                    <button type="button" class="btn-secondary btn-sm" onclick="state.editingCpId='${c.RecordId}'; state.adminAddFormOpen=true; render();">Edit</button>
                    <button type="button" class="btn-danger btn-sm" onclick="deleteCp('${c.RecordId}')">Del</button>
                  </div></td>
                </tr>
              `).join("")}
            </tbody></table></div>
          ` : `<div class="pb-meta">No entries found.</div>`}
        </div>
      `;
    }

    function syncGst() {
      const b = numVal(document.getElementById("cpBase")?.value);
      const p = numVal(document.getElementById("cpGstPct")?.value);
      const g = (b * p) / 100;
      const gEl = document.getElementById("cpGstAmt");
      const tEl = document.getElementById("cpTotal");
      if (gEl) gEl.value = g.toFixed(2);
      if (tEl) tEl.value = (b + g).toFixed(2);
    }

    async function submitCp(ev) {
      ev.preventDefault();
      const existing = state.editingCpId ? state.clientPayments.find(c => c.RecordId === state.editingCpId) : null;
      const b = numVal(document.getElementById("cpBase").value);
      const p = numVal(document.getElementById("cpGstPct").value);
      const g = numVal(document.getElementById("cpGstAmt")?.value) || ((b * p) / 100);
      const t = numVal(document.getElementById("cpTotal").value) || (b + g);
      const rec = {
        RecordId: existing ? existing.RecordId : ("CP_" + Date.now()),
        Date: toDateISO(document.getElementById("cpDate").value),
        Site: document.getElementById("cpSite").value,
        "Base Amount": b,
        "Gst%": p,
        "GST Amount": g,
        TotalAmount: t,
        PaymentMode: document.getElementById("cpMode").value,
        ReferenceNo: document.getElementById("cpRef").value.trim(),
        Remarks: document.getElementById("cpRemarks").value.trim()
      };
      if (existing) {
        const idx = state.clientPayments.findIndex(c => c.RecordId === existing.RecordId);
        if (idx > -1) state.clientPayments[idx] = rec;
        state.editingCpId = null;
        state.adminAddFormOpen = false;
        render();
        await sendAction({ action: "updateClientPayment", record: rec });
      } else {
        state.clientPayments.unshift(rec);
        state.adminAddFormOpen = false;
        render();
        await sendAction({ action: "addClientPayment", record: rec });
      }
    }

    async function deleteCp(id) {
      if (!isAdmin()) return;
      state.clientPayments = state.clientPayments.filter(c => c.RecordId !== id);
      render();
      await sendAction({ action: "deleteClientPayment", RecordId: id });
    }

    function renderAddSitePage() {
      const editObj = state.editingSiteName ? state.sites.find(s => s["Site Name"] === state.editingSiteName) : null;
      const showForm = state.adminAddFormOpen || Boolean(editObj);
      const st = editObj ? normSiteStatus(editObj.Status) : "Ongoing";

      return `
        <div class="card">
          <div class="card-title">
            <span>Sites</span>
            <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen=!state.adminAddFormOpen; state.editingSiteName=null; render();">${showForm ? "Close" : "+"}</button>
          </div>
          ${showForm ? `
            <form onsubmit="submitSite(event)" style="margin-bottom:14px;">
              <div class="form-grid">
                <div class="field"><label>Site Name</label><input type="text" id="newSiteName" value="${editObj ? editObj["Site Name"] : ""}" required /></div>
                <div class="field"><label>Status</label><select id="newSiteStatus"><option value="Ongoing" ${st === "Ongoing" ? "selected" : ""}>Ongoing</option><option value="Completed" ${st === "Completed" ? "selected" : ""}>Completed</option></select></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn-primary">${editObj ? "Update" : "Save"}</button></div>
            </form>
          ` : ""}
          ${state.sites.length ? `
            <div class="table-wrap"><table><thead><tr><th>Site Name</th><th>Status</th><th>Action</th></tr></thead><tbody>
              ${state.sites.map(s => {
                const name = s["Site Name"];
                const comp = normSiteStatus(s.Status) === "Completed";
                const esc = name.replace(/'/g, "\\'");
                return `
                  <tr>
                    <td><strong>${name}</strong></td>
                    <td>
                      <select style="width:125px; padding:4px 7px; font-size:12px;" onchange="changeSiteStatus('${esc}', this.value)">
                        <option value="Ongoing" ${!comp ? "selected" : ""}>Ongoing</option>
                        <option value="Completed" ${comp ? "selected" : ""}>Completed</option>
                      </select>
                    </td>
                    <td><div class="pb-actions">
                      <button type="button" class="btn-secondary btn-sm" onclick="state.editingSiteName='${esc}'; state.adminAddFormOpen=true; render();">Edit</button>
                      <button type="button" class="btn-danger btn-sm" onclick="deleteSite('${esc}')">Del</button>
                    </div></td>
                  </tr>
                `;
              }).join("")}
            </tbody></table></div>
          ` : `<div class="pb-meta">No sites found.</div>`}
        </div>
      `;
    }

    async function submitSite(ev) {
      ev.preventDefault();
      const name = document.getElementById("newSiteName").value.trim();
      const status = normSiteStatus(document.getElementById("newSiteStatus").value);
      if (!name) return;
      const oldName = state.editingSiteName || "";
      const rec = { "Site Name": name, Status: status };
      if (oldName) {
        state.sites = state.sites.filter(s => s["Site Name"].toLowerCase() !== oldName.toLowerCase());
      }
      const idx = state.sites.findIndex(s => s["Site Name"].toLowerCase() === name.toLowerCase());
      if (idx > -1) state.sites[idx] = rec; else state.sites.push(rec);
      state.editingSiteName = null;
      state.adminAddFormOpen = false;
      render();
      await sendAction({ action: oldName ? "updateSite" : "addSite", oldSiteName: oldName, record: rec });
    }

    async function changeSiteStatus(name, st) {
      if (!isAdmin()) return;
      const idx = state.sites.findIndex(s => s["Site Name"].toLowerCase() === name.toLowerCase());
      if (idx === -1) return;
      const rec = { "Site Name": state.sites[idx]["Site Name"], Status: normSiteStatus(st) };
      state.sites[idx] = rec;
      render();
      await sendAction({ action: "addSite", record: rec });
    }

    async function deleteSite(name) {
      if (!isAdmin()) return;
      state.sites = state.sites.filter(s => s["Site Name"].toLowerCase() !== name.toLowerCase());
      render();
      await sendAction({ action: "deleteSite", siteName: name });
    }

    function renderAddEngineerPage() {
      const editU = state.editingUserName ? state.users.find(u => u.user === state.editingUserName) : null;
      const showForm = state.adminAddFormOpen || Boolean(editU);
      return `
        <div class="card">
          <div class="card-title">
            <span>Engineers &amp; Passwords</span>
            <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen=!state.adminAddFormOpen; state.editingUserName=null; render();">${showForm ? "Close" : "+"}</button>
          </div>
          ${showForm ? `
            <form onsubmit="submitUser(event)" style="margin-bottom:14px;">
              <div class="form-grid">
                <div class="field"><label>Name</label><input type="text" id="engUserName" value="${editU ? editU.user : ""}" ${editU ? "readonly" : ""} required /></div>
                <div class="field"><label>PIN</label><input type="text" id="engUserPin" maxlength="6" value="${editU ? editU.password : ""}" required /></div>
              </div>
              <div class="form-actions"><button type="submit" class="btn-primary">Save</button></div>
            </form>
          ` : ""}
          <div class="table-wrap"><table><thead><tr><th>User</th><th>PIN</th><th>Action</th></tr></thead><tbody>
            ${state.users.map(u => {
              const adm = userKey(u.user) === "admin";
              const esc = u.user.replace(/'/g, "\\'");
              return `
                <tr>
                  <td><strong>${u.user}</strong></td>
                  <td>${u.password}</td>
                  <td><div class="pb-actions">
                    <button type="button" class="btn-secondary btn-sm" onclick="state.editingUserName='${esc}'; state.adminAddFormOpen=true; render();">Edit PIN</button>
                    ${!adm ? `<button type="button" class="btn-danger btn-sm" onclick="deleteUser('${esc}')">Delete</button>` : ""}
                  </div></td>
                </tr>
              `;
            }).join("")}
          </tbody></table></div>
        </div>
      `;
    }

    async function submitUser(ev) {
      ev.preventDefault();
      const raw = document.getElementById("engUserName").value.trim();
      const pin = document.getElementById("engUserPin").value.trim();
      if (!raw || !pin) return;
      const k = userKey(raw);
      const rec = { user: displayName(raw), role: k === "admin" ? "ADMIN" : (k === "manigandan" ? "Manigandan" : "ENGINEER"), password: pin };
      state.users = dedupeUsers([...state.users.filter(u => userKey(u.user) !== k), rec]);
      syncLoginSelect();
      state.editingUserName = null;
      state.adminAddFormOpen = false;
      render();
      await sendAction({ action: "saveUser", record: rec });
    }

    async function deleteUser(name) {
      if (!isAdmin()) return;
      const k = userKey(name);
      if (!k || k === "admin") return;
      state.users = dedupeUsers(state.users.filter(u => userKey(u.user) !== k));
      syncLoginSelect();
      render();
      await sendAction({ action: "deleteUser", user: name });
    }

    function renderAddUnitsPage() {
      const units = cleanUnits(state.units);
      return `
        <div class="card">
          <div class="card-title">
            <span>Units</span>
            <button type="button" class="btn-primary btn-sm" onclick="state.adminAddFormOpen=!state.adminAddFormOpen; render();">${state.adminAddFormOpen ? "Close" : "+"}</button>
          </div>
          ${state.adminAddFormOpen ? `
            <form onsubmit="submitUnit(event)" style="margin-bottom:14px;">
              <div class="form-grid"><div class="field"><label>Unit Name</label><input type="text" id="newUnitName" required /></div></div>
              <div class="form-actions"><button type="submit" class="btn-primary">Save</button></div>
            </form>
          ` : ""}
          <div class="table-wrap"><table><thead><tr><th>Unit</th><th>Action</th></tr></thead><tbody>
            ${units.map(u => `<tr><td><strong>${u}</strong></td><td><button type="button" class="btn-danger btn-sm" onclick="deleteUnit('${u.replace(/'/g, "\\'")}')">Del</button></td></tr>`).join("")}
          </tbody></table></div>
        </div>
      `;
    }

    async function submitUnit(ev) {
      ev.preventDefault();
      const u = document.getElementById("newUnitName").value.trim();
      if (!u) return;
      if (!state.units.some(x => x.toLowerCase() === u.toLowerCase())) state.units.push(u);
      state.adminAddFormOpen = false;
      render();
      await sendAction({ action: "addUnit", unit: u });
    }

    async function deleteUnit(u) {
      if (!isAdmin()) return;
      state.units = state.units.filter(x => x.toLowerCase() !== u.toLowerCase());
      render();
      await sendAction({ action: "deleteUnit", unit: u });
    }

    function render() {
      renderBottomNav();
      const c = document.getElementById("viewContainer");
      if (state.activeTab === "summary") c.innerHTML = renderSummaryView();
      else if (state.activeTab === "expenses") c.innerHTML = renderExpensesView();
      else if (isAdmin() && state.activeTab === "clientPayment") c.innerHTML = renderClientPaymentPage();
      else if (isAdmin() && state.activeTab === "engineerFund") c.innerHTML = renderEngineerFundPage();
      else if (isAdmin() && state.activeTab === "selfExpense") c.innerHTML = renderSelfExpensePage();
      else if (isAdmin() && state.activeTab === "addEngineer") c.innerHTML = renderAddEngineerPage();
      else if (isAdmin() && state.activeTab === "addSite") c.innerHTML = renderAddSitePage();
      else if (isAdmin() && state.activeTab === "addUnits") c.innerHTML = renderAddUnitsPage();
      else c.innerHTML = renderSummaryView();
    }

    loadLocal();
    syncLoginSelect();

    setInterval(() => {
      if (state.currentUser && document.visibilityState === "visible" && !isEditingNow()) {
        loadAllData(false);
      }
    }, 5000);

    (function boot() {
      const saved = sessionStorage.getItem("NA_FRESH_SESSION");
      if (saved) {
        try {
          const p = JSON.parse(saved);
          if (p && p.user && p.role) {
            state.currentUser = p;
            showApp();
            loadAllData(false);
            return;
          }
        } catch (_) {}
      }
      loadAllData(false);
    })();
  </script>
</body>
</html>
